法と形式を示したうえで承諾を得る。口頭の承諾だけでは足りない。"},{"ok":false,"r":"映像と音声を双方向でやりとりできる環境が必要。"},{"ok":false,"r":"承諾後でも、受けない旨の申出があれば電磁的方法で提供してはならない（再承諾を除く）。"}],"ans":2},{"no":3,"f":"管理受託契約","pt":"締結時書面：対象住宅、業務の実施方法、報酬、期間、更新・解除、再委託、責任・免責、報告、入居者への周知など。","stem":"賃貸住宅管理業法第14条の管理受託契約締結時書面に記載しなければならない事項として正しいものはいくつあるか。","items":["管理業務の対象となる賃貸住宅","管理業務の実施方法","契約の更新又は解除に関する定めがあるときは、その内容","賃貸住宅管理業者の直近の事業年度の財産及び損益の状況"],"itemExp":[{"ok":true,"r":"記載事項。"},{"ok":true,"r":"記載事項。"},{"ok":true,"r":"記載事項。"},{"ok":false,"r":"記載事項ではない。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":4,"f":"管理受託契約","pt":"業務管理者は「管理・監督」役。重説・書面、維持保全、金銭管理、帳簿、定期報告、秘密保持、苦情処理。","stem":"業務管理者に関する次の記述のうち、最も不適切なものはどれか。","c":["業務管理者は、入居者からの苦情の処理に関する事項を管理・監督する。","業務管理者は、委託者への定期報告に関する事項を管理・監督する。","業務管理者は、業務に支障がなければ、複数の営業所の業務管理者を兼務することができる。","業務管理者は、管理受託契約重要事項説明及び書面の交付に関する事項を管理・監督する。"],"exp":[{"ok":true,"r":"業務管理者の職務の一つ。"},{"ok":true,"r":"業務管理者の職務の一つ。"},{"ok":false,"r":"他の営業所・事務所の業務管理者を兼ねることはできない。"},{"ok":true,"r":"業務管理者の職務の一つ。"}],"ans":3},{"no":5,"f":"管理受託契約","pt":"標準契約書は「ひな形」で使用は任意。不可抗力は免責。解除は原則として催告してから。","stem":"賃貸住宅標準管理受託契約書に関する次の記述のうち、最も適切なものはどれか。","c":["当事者の一方が契約上の義務の履行を怠った場合、相手方は相当の期間を定めて履行を催告し、その期間内に履行がないときは契約を解除できる。","標準管理受託契約書は国土交通省が作成したもので、その使用が法律上義務付けられている。","管理業者は、修繕が必要と認めた場合でも委託者に通知せず、自らの判断で費用を立て替えて修繕を実施しなければならない。","委託者は、天災地変等の不可抗力により生じた損害についても、管理業者に賠償を請求することができる。"],"exp":[{"ok":true,"r":"催告による解除の規定。"},{"ok":false,"r":"標準契約書はひな形であり、使用は義務ではない。"},{"ok":false,"r":"修繕の必要を認めたときは委託者に通知し、費用負担等は契約の定めに従う。"},{"ok":false,"r":"不可抗力による損害について、管理業者は責任を負わない（免責）。"}],"ans":1},{"no":6,"f":"管理受託契約","pt":"委任：善管注意義務（無償でも）、報告義務、いつでも解除可（不利な時期の解除は賠償。ただしやむを得ない事由があれば不要）。","stem":"管理受託契約の民法上の性質（委任）に関する次の記述のうち、最も不適切なものはどれか。","c":["受任者は、委任者の請求があるときは、いつでも委任事務の処理の状況を報告しなければならない。","管理受託契約は、民法上、委任（準委任）契約の性質を有する。","受任者である管理業者は、委任の本旨に従い、善良な管理者の注意をもって事務を処理する義務を負う。","委任は各当事者がいつでも解除できるが、相手方に不利な時期に解除したときは、やむを得ない事由があっても、必ず損害を賠償しなければならない。"],"exp":[{"ok":true,"r":"民法645条。"},{"ok":true,"r":"事務の委託であり、準委任の性質を持つ（清掃・修繕等の請負の要素を含むこともある）。"},{"ok":true,"r":"民法644条（善管注意義務）。報酬の有無を問わない。"},{"ok":false,"r":"民法651条2項。やむを得ない事由があれば賠償は不要。"}],"ans":4},{"no":7,"f":"管理受託契約","pt":"委任の終了事由：死亡・破産手続開始・後見開始（受任者）。報酬は特約が必要。復委任は許諾 or やむを得ない事由。","stem":"委任契約に関する次の記述のうち、最も適切なものはどれか。","c":["受任者が委任事務の処理に必要な費用を支出したときは、委任者に対し、その費用及び支出の日以後の利息の償還を請求できる。","受任者は、報酬の特約がなくても、委任者に当然に報酬を請求できる。","委任者が死亡しても、委任契約は終了しない。","受任者は、委任者の許諾を得なくても、自由に復受任者を選任することができる。"],"exp":[{"ok":true,"r":"民法650条1項。"},{"ok":false,"r":"民法648条1項。特約がなければ報酬を請求できない（商人の場合は商法512条で請求可）。"},{"ok":false,"r":"民法653条。委任者・受任者の死亡や破産手続開始決定等で終了する。"},{"ok":false,"r":"民法644条の2。許諾を得たとき又はやむを得ない事由があるときに限る。"}],"ans":1},{"no":8,"f":"維持保全・原状回復","pt":"負担額＝費用×残存価値割合。クロスは6年で1円、3年経過なら約半分。","stem":"入居時に新品だった壁クロスを、入居から3年経過した時点で賃借人の過失により汚損し、張替費用が6万円かかった。「原状回復をめぐるトラブルとガイドライン」の考え方（耐用年数6年・定額法で6年経過時に残存価値1円）による賃借人負担額の目安として、最も適切なものはどれか。","c":["6万円","4万円","3万円","1万円"],"exp":[{"ok":false,"r":"経過年数を考慮しないと全額になってしまう。ガイドラインでは経過年数を考慮する。"},{"ok":false,"r":"計算が合わない。"},{"ok":true,"r":"6年で価値がほぼ0（1円）になるので、3年経過時点の残存価値は約50％。6万円×約50％＝約3万円。"},{"ok":false,"r":"計算が合わない。"}],"ans":3},{"no":9,"f":"維持保全・原状回復","pt":"ペット・手入れ不足・不注意＝賃借人。日照・地震・経年＝賃貸人。","stem":"「原状回復をめぐるトラブルとガイドライン」において、賃借人の負担とされるものはいくつあるか。","items":["ペットが柱を引っかいてできたキズ","日照による畳の変色","手入れを怠ったために付着した台所の油汚れ","地震で破損した窓ガラス"],"itemExp":[{"ok":true,"r":"善管注意義務違反として賃借人負担。"},{"ok":false,"r":"通常損耗（賃貸人負担）。"},{"ok":true,"r":"通常の清掃を怠った結果であり賃借人負担。"},{"ok":false,"r":"自然災害による破損は賃貸人負担。"}],"note":"→ 該当するものは2つ。正解は肢2。","c":["１つ","２つ","３つ","４つ"],"ans":2},{"no":10,"f":"建物・設備","pt":"採光1/7（照明で1/10）、天井高2.1m、界壁は小屋裏・天井裏まで、地階の居室は防湿措置で可。","stem":"建築基準法の居室等に関する次の記述のうち、最も不適切なものはどれか。","c":["居室の天井の高さは、2.1m以上でなければならない。","共同住宅の各戸の界壁は、原則として小屋裏又は天井裏に達するものとしなければならない。","地階に居室を設けることは、いかなる場合も禁止されている。","住宅の居室には、原則として床面積の7分の1以上の採光に有効な開口部が必要である。"],"exp":[{"ok":true,"r":"1室で高さが異なる場合は平均の高さ。"},{"ok":true,"r":"天井を強化天井とした場合などは例外あり。"},{"ok":false,"r":"防湿・防水等の措置を講じれば、地階に住宅の居室を設けることができる。"},{"ok":true,"r":"一定の照明設備を設ければ10分の1まで緩和できる（2023年4月施行）。"}],"ans":3},{"no":11,"f":"建物・設備","pt":"共用廊下：両側居室1.6m・片側1.2m。住戸内に非常用照明は不要。","stem":"共同住宅の避難・防火に関する次の記述のうち、最も適切なものはどれか。","c":["非常用の照明装置は、共同住宅の住戸内にも必ず設置しなければならない。","共同住宅で、2以上の直通階段の設置が必要となる場合はない。","住戸の床面積の合計が100㎡を超える階の共用廊下の幅は、両側に居室がある場合は1.6m以上、その他の場合は1.2m以上必要である。","居室から直通階段までの歩行距離について、法令上の制限はない。"],"exp":[{"ok":false,"r":"共同住宅の住戸には非常用照明の設置は不要。"},{"ok":false,"r":"一定規模以上（居室の床面積が一定以上の階等）では2以上の直通階段が必要。"},{"ok":true,"r":"建築基準法施行令119条。"},{"ok":false,"r":"構造や用途に応じて歩行距離の上限が定められている。"}],"ans":3},{"no":12,"f":"建物・設備","pt":"都市ガス＝天井、LPガス＝床。エコジョーズ＝ガス（排熱回収）、エコキュート＝電気（空気熱）。","stem":"ガス・給湯設備に関する次の記述のうち、最も不適切なものはどれか。","c":["都市ガスの多くは空気より軽いため、ガス漏れ警報器は天井付近に設置する。","LPガスは空気より重いため、ガス漏れ警報器は床付近に設置する。","ヒートポンプ給湯器（エコキュート）は、ガスを燃焼させて湯を沸かす給湯器である。","潜熱回収型給湯器（エコジョーズ）は、排気中の熱を回収して熱効率を高める給湯器である。"],"exp":[{"ok":true,"r":"天井から30cm以内などが目安。"},{"ok":true,"r":"床から30cm以内などが目安。"},{"ok":false,"r":"電気で動くヒートポンプにより、空気の熱を利用して湯を沸かす。"},{"ok":true,"r":"排気熱を再利用するガス給湯器。"}],"ans":3},{"no":13,"f":"建物・設備","pt":"単相3線式で100V/200V。50kW以上は高圧受電。漏電遮断器≠配線用遮断器。","stem":"電気設備に関する次の記述のうち、最も適切なものはどれか。","c":["分電盤は、電力会社から建物全体の電気を受電する設備である。","契約電力が50kW以上となる建物では、高圧で受電し、受変電設備（キュービクル等）が必要となる。","漏電遮断器は、過電流を検知して電気を遮断する装置である。","単相2線式の引込みで、100Vと200Vの両方の機器を使用できる。"],"exp":[{"ok":false,"r":"分電盤は、住戸内などで各回路に電気を分ける設備。"},{"ok":true,"r":"50kW以上は高圧受電となり、自家用電気工作物として保安管理が必要。"},{"ok":false,"r":"漏電遮断器は漏電を検知する。過電流を検知するのは配線用遮断器（ブレーカー）。"},{"ok":false,"r":"100Vと200Vの両方を使えるのは単相3線式。"}],"ans":2},{"no":14,"f":"建物・設備","pt":"チョーキング＝塗装の劣化。タイルの浮きは打診調査で確認。","stem":"屋根・外壁・防水に関する次の記述のうち、最も不適切なものはどれか。","c":["散水試験は、雨漏りの浸入箇所を特定する調査方法の一つである。","外壁目地のシーリング材の劣化は、外壁からの雨水浸入の原因となる。","陸屋根（平らな屋根）は、傾斜屋根に比べて雨漏りが発生しやすい。","外壁を手で触ると白い粉が付くチョーキング（白亜化）は、タイル外壁の剥落の直接の兆候である。"],"exp":[{"ok":true,"r":"疑わしい箇所に順に散水して浸入箇所を特定する。"},{"ok":true,"r":"ひび割れ・剥離を定期的に点検する。"},{"ok":true,"r":"水が溜まりやすく、防水層の劣化が雨漏りにつながりやすい。"},{"ok":false,"r":"チョーキングは塗装の劣化現象で、塗り替えの目安。タイルの剥落の兆候は浮き（打診で確認）。"}],"ans":4},{"no":15,"f":"建物・設備","pt":"結露対策＝換気・除湿・断熱。シロアリは湿気を好む。北側は結露しやすい。","stem":"結露・カビ・シロアリに関する次の記述のうち、最も適切なものはどれか。","c":["結露は、室内の水蒸気が温度の低い壁面等で冷やされて水滴となる現象で、換気不足が原因の一つとなる。","北側の押入れは、日が当たらず外気の影響を受けにくいため結露が発生しにくい。","結露を防止するには、室内の換気を控えて湿度を高く保つのが効果的である。","シロアリは乾燥した場所を好むため、床下の湿気対策はシロアリ被害の防止にはならない。"],"exp":[{"ok":true,"r":"換気・除湿・断熱が対策。"},{"ok":false,"r":"北側は壁面温度が低く、結露しやすい。"},{"ok":false,"r":"換気をして湿度を下げることが有効。"},{"ok":false,"r":"シロアリは湿った木材を好むため、床下の防湿・換気は有効な対策。"}],"ans":1},{"no":16,"f":"維持保全・原状回復","pt":"鍵は入替時に交換（賃貸人負担）。住戸への立入りは原則承諾が必要。","stem":"鍵の管理・防犯に関する次の記述のうち、最も不適切なものはどれか。","c":["入居者の入れ替え時には、鍵（シリンダー）を交換することが望ましい。","管理業者が鍵を保管する場合、鍵と住戸番号の対応が第三者に容易に分からないように管理すべきである。","防犯カメラで撮影した特定の個人を識別できる映像は、個人情報に該当し得る。","管理業者は、防犯上必要と判断すれば、入居者の事前の承諾なく自由に住戸に立ち入ることができる。"],"exp":[{"ok":true,"r":"前入居者による不正な侵入を防ぐため。費用は原則賃貸人負担。"},{"ok":true,"r":"鍵の紛失・盗難時の被害を防ぐため。"},{"ok":true,"r":"利用目的の明示や適切な管理が必要。"},{"ok":false,"r":"住戸への立入りは原則として入居者の承諾が必要（緊急時を除く）。"}],"ans":4},{"no":17,"f":"維持保全・原状回復","pt":"修繕周期の目安：外壁塗装・屋上防水10〜15年、給排水管20〜30年、エレベーター取替25〜30年。","stem":"修繕の周期（目安）に関する次の記述のうち、最も適切なものはどれか。","c":["エレベーターの取替えは、一般に5年程度の周期で行われる。","屋上防水の改修は、一般に10〜15年程度の周期で行われる。","外壁の塗装の修繕周期は、一般に1〜2年程度とされる。","給排水管の更新は、一般に5年程度の周期で行われる。"],"exp":[{"ok":false,"r":"一般に25〜30年程度が目安（保守点検は毎月等）。"},{"ok":true,"r":"防水の種類にもよるが10〜15年程度が目安。"},{"ok":false,"r":"一般に10〜15年程度が目安。"},{"ok":false,"r":"一般に20〜30年程度が目安。"}],"ans":2},{"no":18,"f":"金銭管理・会計","pt":"金銭債務は不可抗力でも免責されない。賃料は特約がなければ月末後払い・持参債務。","stem":"賃料の支払・弁済に関する次の記述のうち、最も不適切なものはどれか。","c":["賃料・遅延損害金・費用の全部を消滅させるに足りない弁済は、合意がなければ、費用、利息（遅延損害金）、元本の順に充当される。","金銭債務の不履行について、債務者は不可抗力を理由に責任を免れることができる。","建物の賃料の支払時期について特約がなければ、毎月末に当月分を支払う。","賃料の支払場所について特約がなければ、賃貸人（債権者）の現在の住所で支払う。"],"exp":[{"ok":true,"r":"民法489条（法定充当）。"},{"ok":false,"r":"民法419条3項。金銭債務は不可抗力をもって抗弁とすることができない。"},{"ok":true,"r":"民法614条（後払いの原則）。実務では前払い特約が一般的。"},{"ok":true,"r":"民法484条（持参債務）。"}],"ans":2},{"no":19,"f":"金銭管理・会計","pt":"明渡しの強制執行＝債務名義＋執行文、執行官が実施。占有移転禁止の仮処分は訴訟前に。","stem":"建物明渡しの法的手続に関する次の記述のうち、最も適切なものはどれか。","c":["強制執行で搬出した動産は、執行官が直ちに廃棄しなければならない。","建物明渡しの強制執行は執行官が行い、債務名義と執行文が必要である。","賃借人が行方不明の場合、公示送達によって訴訟を進めることはできない。","占有移転禁止の仮処分は、明渡しの判決が確定した後でなければ申し立てることができない。"],"exp":[{"ok":false,"r":"一定期間保管し、引取りがなければ売却等の手続がとられる。"},{"ok":true,"r":"判決等の債務名義に執行文を付けて申し立てる。"},{"ok":false,"r":"所在不明の場合は公示送達により訴訟を進めることができる。"},{"ok":false,"r":"訴訟前・訴訟中に、占有者が変わるのを防ぐために申し立てる。"}],"ans":2},{"no":20,"f":"金銭管理・会計","pt":"家賃債務保証業者の登録は任意（有効期間5年）。不当な取立ての禁止。","stem":"家賃債務保証業者に関する次の記述のうち、最も不適切なものはどれか。","c":["登録業者は、求償権を行使する際、賃借人等を威迫するなどの不当な取立てをしてはならない。","家賃債務保証業者が賃借人に代わって賃料を支払った（代位弁済した）場合、賃借人に対して求償権を取得する。","家賃債務保証業を営むすべての事業者は、国土交通大臣の登録を受けなければならない。","国土交通省の家賃債務保証業者登録制度における登録の有効期間は5年である。"],"exp":[{"ok":true,"r":"登録規程で禁止されている。"},{"ok":true,"r":"保証人が弁済すれば主債務者に求償できる。"},{"ok":false,"r":"登録は任意。2025年10月からの認定制度（改正住宅セーフティネット法）も任意の制度。"},{"ok":true,"r":"更新制。"}],"ans":3},{"no":21,"f":"金銭管理・会計","pt":"前受家賃＝前受金（負債）、未収家賃＝未収金（資産）、敷金＝預り金（負債）。","stem":"賃貸管理に関する会計処理（仕訳）に関する次の記述のうち、最も適切なものはどれか。","c":["当月に翌月分の家賃を受け取ったときは、借方を現金、貸方を前受金（前受収益）として処理する。","当月分の家賃が未収となっているときは、借方を未払金として処理する。","減価償却費は、現金の支出を伴う費用である。","賃借人から敷金を受け取ったときは、貸方を売上として処理する。"],"exp":[{"ok":true,"r":"翌月分は当月の収益ではなく負債。"},{"ok":false,"r":"未収の家賃は未収金（未収収益）として資産に計上する。"},{"ok":false,"r":"減価償却費は現金支出を伴わない費用。"},{"ok":false,"r":"敷金は預り金（負債）。"}],"ans":1},{"no":22,"f":"賃貸借契約","pt":"賃貸借は諾成契約。他人物賃貸借も有効。用法違反の損害賠償は返還から1年以内。","stem":"賃貸借契約の成立等に関する次の記述のうち、最も不適切なものはどれか。","c":["民法上、賃貸借の存続期間は50年を超えることができないが、建物の賃貸借には適用されない。","賃貸借契約は諾成契約であり、契約書を作成しなくても成立する。","賃借人の用法違反による損害の賠償請求は、賃貸人が返還を受けた時から1年以内にしなければならない。","他人の物を目的とする賃貸借契約は無効である。"],"exp":[{"ok":true,"r":"借地借家法29条2項により、建物賃貸借には50年の上限が適用されない。"},{"ok":true,"r":"当事者の合意だけで成立する（定期借家は書面が必要）。"},{"ok":true,"r":"民法622条・600条。"},{"ok":false,"r":"他人物賃貸借も契約として有効に成立する。賃貸人は使用収益させる義務を負う。"}],"ans":4},{"no":23,"f":"賃貸借契約","pt":"賃借人の義務：善管注意、用法遵守、修繕の必要・権利主張者の通知、賃料支払、原状回復。","stem":"賃借人の義務に関する次の記述のうち、最も不適切なものはどれか。","c":["賃借人は、契約又は賃借物の性質によって定まった用法に従って使用収益しなければならない。","賃借物の修繕が必要な場合でも、賃貸人が既にそのことを知っているときは、賃借人は通知しなくてよい。","賃借物について権利を主張する第三者があっても、賃借人は賃貸人に通知する必要はない。","賃借人は、賃借物を返還するまで、善良な管理者の注意をもって保存しなければならない。"],"exp":[{"ok":true,"r":"民法616条・594条1項（用法遵守義務）。"},{"ok":true,"r":"民法615条ただし書。"},{"ok":false,"r":"民法615条。遅滞なく賃貸人に通知しなければならない（賃貸人が知っている場合を除く）。"},{"ok":true,"r":"民法400条（善管注意義務）。"}],"ans":3},{"no":24,"f":"賃貸借契約","pt":"正当事由の主たる要素＝双方の使用の必要性。立退料・老朽化等は補完要素。","stem":"普通建物賃貸借の正当事由に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸人と賃借人それぞれの建物使用の必要性は、正当事由の主たる判断要素である。","建物が老朽化していれば、それだけで常に正当事由が認められる。","正当事由は、更新拒絶の通知時から期間満了時まで（解約申入れの場合は申入れから6か月間）存続していなければならない。","立退料の申出額が不十分でも、裁判所が相当と認める額に増額することで正当事由が認められることがある。"],"exp":[{"ok":true,"r":"その他の事情（従前の経過・利用状況・建物の現況・立退料）は補完的要素。"},{"ok":false,"r":"老朽化は判断要素の一つにすぎず、総合的に判断される。"},{"ok":true,"r":"判例。"},{"ok":true,"r":"判例（増額した立退料の支払と引換えに明渡しを命じることがある）。"}],"ans":2},{"no":25,"f":"賃貸借契約","pt":"定期借家は事業用も可。再契約にも事前説明が必要。通知遅れ→通知から6か月後に終了。","stem":"定期建物賃貸借に関する次の記述のうち、最も適切なものはどれか。","c":["期間1年以上の定期建物賃貸借で、通知期間の経過後に終了の通知をした場合、通知の日から6か月を経過した後に終了を対抗できる。","定期建物賃貸借の再契約をする場合、改めて事前説明をする必要はない。","期間満了後に賃借人が使用を続け、賃貸人が遅滞なく異議を述べなかった場合、定期建物賃貸借は法定更新される。","定期建物賃貸借は、居住用建物に限って締結することができる。"],"exp":[{"ok":true,"r":"借地借家法38条6項。"},{"ok":false,"r":"再契約は新たな契約なので、改めて書面の交付と事前説明が必要。"},{"ok":false,"r":"定期建物賃貸借には法定更新の規定は適用されない。"},{"ok":false,"r":"事業用建物でも締結できる（中途解約権の規定は居住用200㎡未満のみ）。"}],"ans":1},{"no":26,"f":"賃貸借契約","pt":"取壊し予定建物の特約は書面で事由を記載。一時使用は実態で判断。","stem":"取壊し予定の建物の賃貸借及び一時使用目的の賃貸借に関する次の記述のうち、最も不適切なものはどれか。","c":["契約書に「一時使用」と記載すれば、実態にかかわらず一時使用目的の賃貸借と認められる。","法令又は契約により一定期間経過後に建物を取り壊すことが明らかな場合、建物を取り壊す時に賃貸借が終了する旨を定めることができる。","取壊し予定の建物の賃貸借の特約は、建物を取り壊すべき事由を記載した書面（又は電磁的記録）でしなければならない。","一時使用のために建物の賃貸借をしたことが明らかな場合、借地借家法の借家に関する規定は適用されない。"],"exp":[{"ok":false,"r":"一時使用かどうかは、期間・目的・経緯等の実態から客観的に判断される。"},{"ok":true,"r":"借地借家法39条1項。"},{"ok":true,"r":"借地借家法39条2項・3項。"},{"ok":true,"r":"借地借家法40条。"}],"ans":1},{"no":27,"f":"賃貸借契約","pt":"造作買取請求権・費用償還請求権はいずれも特約で排除できる。債務不履行解除では造作買取請求は不可。","stem":"造作買取請求権・費用償還請求権に関する次の記述のうち、最も適切なものはどれか。","c":["造作買取請求権を排除する特約は無効である。","有益費の償還請求権は、特約で排除することができない。","賃借人が賃貸人の同意を得て建物に付加した造作は、賃貸借が期間満了又は解約申入れにより終了するとき、時価で買い取るよう請求できる。","賃借人の債務不履行により賃貸借が解除された場合でも、造作買取請求をすることができる。"],"exp":[{"ok":false,"r":"借地借家法37条により33条は強行規定ではなく、排除特約は有効。"},{"ok":false,"r":"有益費・必要費の償還請求権は特約で排除できる（任意規定）。"},{"ok":true,"r":"借地借家法33条。"},{"ok":false,"r":"判例上、債務不履行解除の場合は造作買取請求は認められない。"}],"ans":3},{"no":28,"f":"賃貸借契約","pt":"無断譲渡・転貸の解除は「第三者に使用収益させた」ことが必要＋背信性。","stem":"賃借権の無断譲渡・無断転貸に関する次の記述のうち、最も不適切なものはどれか。","c":["賃借人である法人の代表者や株主構成が変わっても、原則として賃借権の譲渡には当たらない。","賃借人の配偶者や子が同居することは、転貸に当たらない。","個人事業者の賃借人が法人化し、実態が変わらないまま法人に使用させた場合、背信性がないとして解除が認められないことがある。","賃借人が無断で賃借権の譲渡契約を結べば、譲受人が使用を始める前であっても、賃貸人は直ちに賃貸借契約を解除できる。"],"exp":[{"ok":true,"r":"判例（最判平8.10.14）。法人格は同一。"},{"ok":true,"r":"家族の同居は賃借人自身の使用の範囲。"},{"ok":true,"r":"判例（信頼関係破壊の法理）。"},{"ok":false,"r":"民法612条2項。第三者に「使用又は収益をさせた」ときに解除できる。"}],"ans":4},{"no":29,"f":"賃貸借契約","pt":"共有：建物3年以内の賃貸・解除は持分過半数、3年超は全員同意。","stem":"共有物の賃貸・賃貸人側の事情に関する次の記述のうち、最も適切なものはどれか。","c":["共有建物の賃貸借契約の解除は、各共有者の持分の価格の過半数で決することができる。","賃借人が破産手続開始の決定を受けた場合、賃貸人はそのことを理由に賃貸借契約を解除できる。","共有建物を5年の期間で賃貸するには、持分の価格の過半数の同意で足りる。","賃貸人が死亡した場合、賃貸借契約は終了する。"],"exp":[{"ok":true,"r":"判例・民法252条（管理行為）。"},{"ok":false,"r":"民法改正で賃借人の破産を理由とする解約の規定は削除された。"},{"ok":false,"r":"持分の過半数でできるのは建物については3年以内の賃貸借。それを超える場合は全員の同意が必要（民法252条4項）。"},{"ok":false,"r":"賃貸人の地位は相続人に相続される。"}],"ans":1},{"no":30,"f":"賃貸借契約","pt":"使用貸借：無償、借地借家法なし、借主死亡で終了、対抗力なし。","stem":"使用貸借に関する次の記述のうち、最も不適切なものはどれか。","c":["使用貸借の借主は、建物の引渡しを受けていれば、その建物の新所有者に借主の権利を対抗できる。","借主が固定資産税相当額を負担している程度では、通常は賃貸借ではなく使用貸借と評価される。","使用貸借は無償で物を使用させる契約であり、借地借家法は適用されない。","使用貸借は、借主の死亡によって終了する。"],"exp":[{"ok":false,"r":"使用借権には対抗力がなく、新所有者に対抗できない。"},{"ok":true,"r":"判例。使用の対価とはいえない程度の負担。"},{"ok":true,"r":"借地借家法は賃貸借（有償）にのみ適用される。"},{"ok":true,"r":"民法597条3項。貸主の死亡では終了しない。"}],"ans":1},{"no":31,"f":"賃貸借契約","pt":"標準契約書：賃借人の解約は30日前（又は30日分支払で即時）。立入りは原則承諾が必要。","stem":"国土交通省の「賃貸住宅標準契約書」に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅標準契約書の使用は、宅建業者が媒介する場合には法律上義務付けられている。","賃借人は、少なくとも30日前に賃貸人に対して解約の申入れを行うことにより、契約を解約することができる。","賃貸人は、建物の防火・構造の保全その他管理上必要があるときは、あらかじめ賃借人の承諾を得ることなく、いつでも立ち入ることができる。","賃貸住宅標準契約書では、ペットの飼育はいかなる場合も禁止されている。"],"exp":[{"ok":false,"r":"標準契約書はひな形であり、使用は任意。"},{"ok":true,"r":"30日分の賃料相当額を支払えば、即時に解約することもできる。"},{"ok":false,"r":"あらかじめ賃借人の承諾を得て立ち入る。火災等の緊急時は承諾なしで可（事後に通知）。"},{"ok":false,"r":"別表で、賃貸人の承諾を得て行う行為として定める形式になっている。"}],"ans":2},{"no":32,"f":"賃貸住宅管理業法","pt":"登録事項（商号・役員・営業所等）に変更があれば30日以内に届出。","stem":"賃貸住宅管理業の登録申請・登録事項に関する次の記述のうち、最も不適切なものはどれか。","c":["法人が申請する場合、役員の氏名も登録事項となる。","登録申請書には、営業所又は事務所の名称及び所在地を記載しなければならない。","国土交通大臣は、登録をしたときは、遅滞なくその旨を申請者に通知しなければならない。","法人である賃貸住宅管理業者の役員が交代しても、届出をする必要はない。"],"exp":[{"ok":true,"r":"登録事項。"},{"ok":true,"r":"登録事項。"},{"ok":true,"r":"登録の通知。"},{"ok":false,"r":"役員の氏名は登録事項であり、変更があれば30日以内に届け出る。"}],"ans":4},{"no":33,"f":"賃貸住宅管理業法","pt":"帳簿：営業所ごと、契約ごとに記載、事業年度末で閉鎖、5年保存、電子保存可。","stem":"賃貸住宅管理業者の帳簿に関する次の記述のうち、最も適切なものはどれか。","c":["帳簿は紙で作成しなければならず、電子データで保存することは認められない。","帳簿には、委託者の商号又は氏名、契約締結日、対象となる賃貸住宅、受託した管理業務の内容、報酬の額などを記載する。","帳簿は、本店に一括して備え付ければ足り、営業所ごとに備え付ける必要はない。","帳簿の保存期間は、閉鎖後3年間である。"],"exp":[{"ok":false,"r":"パソコン等の電子データで保存し、必要に応じて表示できればよい。"},{"ok":true,"r":"管理受託契約ごとに記載する。"},{"ok":false,"r":"営業所又は事務所ごとに備え付ける。"},{"ok":false,"r":"閉鎖後5年間。"}],"ans":2},{"no":34,"f":"賃貸住宅管理業法","pt":"秘密保持：管理業者・従業者（派遣含む）とも、退職後も。正当な理由があれば開示可。","stem":"秘密保持義務・名義貸しの禁止に関する次の記述のうち、最も不適切なものはどれか。","c":["法令に基づく場合など正当な理由があるときは、業務上知り得た秘密を開示することが許される。","賃貸住宅管理業者が秘密保持義務に違反した場合、罰則（罰金）の対象となる。","名義貸しの禁止に違反した場合、罰則の対象となる。","賃貸住宅管理業者と雇用関係のない派遣社員は「従業者」に当たらないため、秘密保持義務を負わない。"],"exp":[{"ok":true,"r":"「正当な理由がある場合でなければ」漏らしてはならない、という義務。"},{"ok":true,"r":"罰則がある。"},{"ok":true,"r":"無登録営業と同等の罰則。"},{"ok":false,"r":"派遣社員も管理業務に従事する以上、従業者として秘密保持義務を負う。"}],"ans":4},{"no":35,"f":"賃貸住宅管理業法","pt":"登録取消：1年以内に業務開始しない・1年以上休業・所在不明（公告後30日）など。処分は公告される。","stem":"賃貸住宅管理業者に対する監督処分に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅管理業者の所在が確知できない場合でも、登録を取り消すことはできない。","登録を受けてから1年以内に業務を開始しないとき、又は引き続き1年以上業務を行っていないときは、登録を取り消されることがある。","国土交通大臣は、登録の取消し等の監督処分をしても、その旨を公告する必要はない。","業務停止命令に違反して業務を行っても、罰則の対象とはならない。"],"exp":[{"ok":false,"r":"公告をして30日を経過しても申出がない場合などは登録を取り消すことができる。"},{"ok":true,"r":"登録取消事由。"},{"ok":false,"r":"監督処分をしたときは公告する。"},{"ok":false,"r":"業務停止命令違反は罰則の対象。"}],"ans":2},{"no":36,"f":"賃貸住宅管理業法","pt":"重説は「締結前」なら前日でも違反ではない（望ましいのは1週間程度）。","stem":"賃貸住宅管理業者の次の行為のうち、賃貸住宅管理業法に違反するものはいくつあるか。","items":["管理受託契約の締結の前日に、管理受託契約重要事項説明を行った","受託した管理業務の全部を、子会社に再委託した","委託者への定期報告を、契約締結から1年6か月後に初めて行った","受領した家賃等を、自己の固有財産と同一の口座で管理した"],"itemExp":[{"ok":false,"r":"締結前であれば違反ではない（1週間程度空けるのが「望ましい」にとどまる）。"},{"ok":true,"r":"全部の再委託は禁止（子会社でも同じ）。違反。"},{"ok":true,"r":"1年を超えない期間ごとに報告が必要。違反。"},{"ok":true,"r":"分別管理義務違反。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":37,"f":"賃貸住宅管理業法","pt":"法の目的＝入居者の居住の安定＋賃貸事業の公正・円滑な実施。","stem":"賃貸住宅管理業法に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅管理業法は、事業用の店舗や事務所の管理にも全面的に適用される。","賃貸住宅管理業法は、賃貸住宅管理業者に、入居者との賃貸借契約の媒介を業務として義務付けている。","賃貸住宅管理業法は、賃貸住宅の入居者の居住の安定の確保及び賃貸住宅の賃貸に係る事業の公正かつ円滑な実施を図ることを目的としている。","賃貸住宅管理業の登録は、営業所がある都道府県ごとに受ける必要がある。"],"exp":[{"ok":false,"r":"対象は「賃貸住宅」（人の居住の用に供する部分）。"},{"ok":false,"r":"賃貸借の媒介は宅建業法の規制分野。管理業法は管理業務とサブリースを規制する。"},{"ok":true,"r":"法1条。"},{"ok":false,"r":"国土交通大臣の登録のみ。"}],"ans":3},{"no":38,"f":"賃貸住宅管理業法","pt":"業務管理者は役員でなくてよい。経営管理士（登録）or 宅建士＋指定講習。","stem":"業務管理者の要件等に関する次の記述のうち、最も不適切なものはどれか。","c":["業務管理者は、賃貸住宅管理業者の役員でなければならない。","賃貸不動産経営管理士として登録するには、管理業務に関する2年以上の実務経験又はこれに代わる講習の修了が必要である。","破産者で復権を得ない者など、登録拒否事由に該当する者は業務管理者になれない。","宅地建物取引士が業務管理者となるには、国土交通大臣が指定する講習を修了する必要がある。"],"exp":[{"ok":false,"r":"役員である必要はない。従業者でもよい。"},{"ok":true,"r":"実務経験2年以上（講習で代替可）。"},{"ok":true,"r":"業務管理者の欠格事由。"},{"ok":true,"r":"宅建士＋指定講習（業務管理者移行講習）。"}],"ans":1},{"no":39,"f":"サブリース（特定賃貸借）","pt":"サブリース重説：建設前でも必要。家賃は額だけでなく設定根拠も説明。","stem":"特定賃貸借契約重要事項説明に関する次の記述のうち、最も不適切なものはどれか。","c":["重要事項説明書には家賃の額を記載すれば足り、家賃の設定根拠を示す必要はない。","特定賃貸借契約重要事項説明は、一定の要件を満たせばITを活用して行うことができる。","これから賃貸住宅を建設する計画段階のオーナーと特定賃貸借契約を締結する場合でも、契約締結前に重要事項説明が必要である。","契約期間中に家賃を減額する変更契約を締結する場合、変更する事項について改めて説明が必要である。"],"exp":[{"ok":false,"r":"家賃の設定根拠（近傍同種の家賃等）も説明事項。"},{"ok":true,"r":"IT重説は可能。"},{"ok":true,"r":"建設前でも、特定賃貸借契約を締結するなら説明が必要。"},{"ok":true,"r":"重要事項に変更があれば、変更部分の説明が必要。"}],"ans":1},{"no":40,"f":"サブリース（特定賃貸借）","pt":"オーナーの更新拒絶・解約には正当事由が必要（特約で排除不可）。","stem":"特定賃貸借契約の更新・解約に関する次の記述のうち、最も適切なものはどれか。","c":["特定賃貸借契約に、特定転貸事業者からの中途解約を認める条項を設けることは禁止されている。","特定賃貸借契約の契約期間は、法律で最長30年と定められている。","オーナーからの解約申入れの正当事由の判断では、オーナーの自己使用の必要性等が考慮され、「サブリース業者と方針が合わない」というだけでは認められにくい。","特定賃貸借契約で定めれば、オーナーは正当事由がなくても自由に更新を拒絶できる。"],"exp":[{"ok":false,"r":"禁止されていない。ただし、そのような条項がある場合は重要事項として説明が必要。"},{"ok":false,"r":"法律上の上限はない（建物賃貸借に50年の上限は適用されない）。"},{"ok":true,"r":"正当事由は総合的に判断される。"},{"ok":false,"r":"正当事由を不要とする特約は、借主（サブリース業者）に不利なため無効。"}],"ans":3},{"no":41,"f":"サブリース（特定賃貸借）","pt":"誇大広告＝事実と異なる表示・リスクを隠す表示。リスクを明示するのは適切。","stem":"特定転貸事業者が行う次の広告表示のうち、誇大広告等に該当するおそれがあるものはいくつあるか。","items":["「30年家賃保証」とのみ表示し、借地借家法32条により家賃が減額され得ることを表示しない","「入居者退去後の原状回復費用は当社負担」と表示したが、実際はオーナー負担となる契約内容である","「家賃は定期的に見直しがあり、減額される可能性があります」と大きく明示した","「契約期間中に当社から解約することはありません」と表示したが、実際は特定転貸事業者からの解約条項がある"],"itemExp":[{"ok":true,"r":"減額リスクを隣接して表示しなければ該当し得る。"},{"ok":true,"r":"事実と異なる表示。"},{"ok":false,"r":"リスクを正しく表示しており、誇大広告には当たらない。"},{"ok":true,"r":"事実と異なる表示。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":42,"f":"サブリース（特定賃貸借）","pt":"サブリースでもオーナー負担の修繕費は発生し得る。免責期間・費用分担は重要事項。","stem":"特定賃貸借契約における家賃・費用負担に関する次の記述のうち、最も不適切なものはどれか。","c":["維持保全の費用分担について、オーナーが負担する修繕の内容を説明する必要がある。","入居者募集期間等を考慮した家賃支払の免責期間を設ける場合は、重要事項として説明が必要である。","特定転貸事業者が行う維持保全の実施方法（回数・頻度など）を説明する必要がある。","特定賃貸借契約では、オーナーが負担する修繕費が発生しないことが法律で保障されている。"],"exp":[{"ok":true,"r":"費用分担は重要事項。"},{"ok":true,"r":"免責期間は家賃に関わる重要事項。"},{"ok":true,"r":"維持保全の内容は重要事項。"},{"ok":false,"r":"そのような保障はない。費用分担は契約で定め、オーナー負担が生じ得る。"}],"ans":4},{"no":43,"f":"サブリース（特定賃貸借）","pt":"勧誘者の規制＝誇大広告・不当勧誘の禁止のみ。重説・書面交付は特定転貸事業者の義務。","stem":"勧誘者・特定転貸事業者の義務に関する次の記述のうち、最も適切なものはどれか。","c":["勧誘者に対する規制は、勧誘者が特定転貸事業者から報酬を受けている場合に限り適用される。","特定転貸事業者から勧誘を委託された者が、自社のホームページで当該サブリース事業の広告をする場合、誇大広告等の規制を受ける。","既に特定賃貸借契約を締結しているオーナーに対する更新の勧誘には、不当な勧誘等の禁止は及ばない。","勧誘者は、特定賃貸借契約重要事項説明を行う義務を負う。"],"exp":[{"ok":false,"r":"報酬の有無を問わない。"},{"ok":true,"r":"勧誘者にも誇大広告の禁止が適用される。"},{"ok":false,"r":"更新の勧誘にも及ぶ。"},{"ok":false,"r":"重要事項説明の義務を負うのは特定転貸事業者。勧誘者に課されるのは誇大広告・不当勧誘の禁止。"}],"ans":2},{"no":44,"f":"サブリース（特定賃貸借）","pt":"サブリースの重説・締結時書面の違反は罰則あり。","stem":"特定賃貸借契約締結時書面に関する次の記述のうち、最も不適切なものはどれか。","c":["特定賃貸借契約締結時書面は、契約を締結したときに遅滞なく交付しなければならない。","相手方の承諾があれば、締結時書面を電磁的方法で提供することができる。","締結時書面には、契約期間、家賃の額・支払時期・方法、維持保全の内容などを記載する。","締結時書面の交付義務に違反しても、罰則の対象とはならない。"],"exp":[{"ok":true,"r":"法31条。"},{"ok":true,"r":"承諾が必要。"},{"ok":true,"r":"主な記載事項。"},{"ok":false,"r":"交付義務違反は罰則（罰金）の対象。"}],"ans":4},{"no":45,"f":"サブリース（特定賃貸借）","pt":"標準契約書ではマスターリース終了時、オーナーが転貸人の地位（敷金返還債務を含む）を承継。","stem":"マスターリース契約の終了と転借人（入居者）に関する次の記述のうち、最も適切なものはどれか。","c":["特定賃貸借標準契約書では、マスターリース契約が終了すると転貸借契約も当然に終了するとされている。","オーナーが転貸人の地位を承継しても、転借人から敷金の返還を請求される余地はない。","マスターリース契約が特定転貸事業者の債務不履行により解除された場合、転借人は原則としてオーナーからの明渡し請求を拒めない。","マスターリース契約が終了すると、転借人との転貸借契約は当然に解除されたものとみなされる。"],"exp":[{"ok":false,"r":"標準契約書では、オーナーが転貸人の地位を承継し、入居者は住み続けられる。"},{"ok":false,"r":"地位を承継すれば、敷金返還債務も引き継ぐ。"},{"ok":true,"r":"債務不履行解除は転借人に対抗できる。"},{"ok":false,"r":"当然に解除されるわけではない。終了原因によって扱いが異なる。"}],"ans":3},{"no":46,"f":"実務・税金・保険","pt":"敷金（返還要）は収入でない、礼金・更新料は収入。土地の借入金利子の赤字は損益通算不可。","stem":"不動産所得に関する次の記述のうち、最も不適切なものはどれか。","c":["礼金や更新料は、受け取った年の不動産所得の総収入金額に算入する。","不動産所得の赤字のうち、土地を取得するための借入金利子に相当する部分は、他の所得と損益通算できない。","固定資産税、損害保険料、減価償却費、建物部分の借入金利子は、不動産所得の必要経費となる。","返還を要する敷金は、受け取った年の総収入金額に算入する。"],"exp":[{"ok":true,"r":"返還不要の一時金は収入。"},{"ok":true,"r":"土地の借入金利子部分は損益通算の対象外。"},{"ok":true,"r":"代表的な必要経費。"},{"ok":false,"r":"返還を要する部分は預り金で、収入にならない（返還不要が確定した部分は確定時に収入）。"}],"ans":4},{"no":47,"f":"実務・税金・保険","pt":"相続登記3年以内（過料10万円以下）、住所等変更登記2年以内（2026年4月〜、過料5万円以下）、相続人申告登記。","stem":"不動産登記に関する次の記述のうち、最も適切なものはどれか。","c":["正当な理由なく相続登記の申請を怠った場合の過料は、100万円以下である。","相続登記の申請義務は、相続により所有権を取得したことを知った日から3年以内に履行しなければならない。","遺産分割協議が成立しない限り、相続人が相続登記の申請義務を履行する方法はない。","住所等の変更登記の申請義務は2026年4月から施行され、期限は変更日から5年以内である。"],"exp":[{"ok":false,"r":"10万円以下の過料（住所等変更登記は5万円以下）。"},{"ok":true,"r":"2024年4月施行。施行前の相続も対象。"},{"ok":false,"r":"「相続人申告登記」をすれば申請義務を履行したものとみなされる。"},{"ok":false,"r":"期限は変更日から2年以内。"}],"ans":2},{"no":48,"f":"実務・税金・保険","pt":"地震による火災は地震保険で。施設賠償責任保険＝建物の管理不備による第三者への賠償。","stem":"賃貸住宅に関する保険に関する次の記述のうち、最も適切なものはどれか。","c":["地震保険の保険料は、建物の構造や所在地にかかわらず全国一律である。","地震を原因とする火災による損害は、火災保険で補償される。","施設賠償責任保険は、建物の管理不備等により第三者に損害を与えた場合の賠償責任を補償する保険である。","火災保険の保険金額を建物の時価より高く設定すれば、その分多くの保険金を受け取ることができる。"],"exp":[{"ok":false,"r":"構造と所在地（都道府県）によって異なる。"},{"ok":false,"r":"地震による火災は火災保険では補償されず、地震保険の対象。"},{"ok":true,"r":"例：外壁の落下で通行人がけがをした場合など。"},{"ok":false,"r":"超過保険となり、損害額（保険価額）を超えて支払われることはない。"}],"ans":3},{"no":49,"f":"実務・税金・保険","pt":"件数を問わず個人情報取扱事業者。目的外利用・第三者提供は原則本人の同意。","stem":"個人情報保護法に関する次の記述のうち、最も不適切なものはどれか。","c":["入居者の緊急連絡先として取得した個人情報は、本人の同意がなくても、管理業者が自社の営業目的に自由に利用できる。","取り扱う個人情報の数にかかわらず、個人情報データベース等を事業に用いている者は、個人情報取扱事業者に該当する。","個人情報を取り扱うに当たっては、利用目的をできる限り特定しなければならない。","個人データを第三者に提供するには、原則として、あらかじめ本人の同意を得なければならない。"],"exp":[{"ok":false,"r":"利用目的の範囲を超えて利用するには、原則として本人の同意が必要。"},{"ok":true,"r":"2017年改正で5,000件要件は撤廃された。"},{"ok":true,"r":"利用目的の特定。"},{"ok":true,"r":"法令に基づく場合などの例外あり。"}],"ans":1},{"no":50,"f":"実務・税金・保険","pt":"収益価格＝NOI÷キャップレート。NOIは借入返済前。DCF法は将来キャッシュフローの現在価値。","stem":"不動産投資の指標に関する次の記述のうち、最も適切なものはどれか。","c":["表面利回りは、年間の満室想定賃料収入を物件価格で割って求める。","DCF法は、過去の収益実績だけから価格を求める方法である。","キャップレート（還元利回り）が低いほど、同じNOIから求める収益価格は低くなる。","NOI（純収益）は、賃料収入から借入金の返済額を差し引いた額である。"],"exp":[{"ok":true,"r":"経費を考慮しない簡易な指標。"},{"ok":false,"r":"DCF法は、将来の収益と売却価格を現在価値に割り引いて合計する方法。"},{"ok":false,"r":"収益価格＝NOI÷キャップレートなので、キャップレートが低いほど価格は高くなる。"},{"ok":false,"r":"NOIは賃料収入から運営費用（管理費・固定資産税等）を差し引いたもの。借入金の返済は含まない。"}],"ans":1}],"review":[{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"管理受託契約重要事項説明は、管理業者の従業者であれば、宅地建物取引士でなくても行うことができる。","a":true,"fact":"説明者の資格は法定されていない（業務管理者の管理・監督の下で行う）。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"重要事項説明をしないで締結した管理受託契約は、民事上当然に無効となる。","a":false,"fact":"契約自体は当然には無効にならない。業法違反として監督処分の対象となる。","trap":""},{"f":"賃貸住宅管理業法","k":"定義","q":"賃貸住宅管理業とは、賃貸住宅の賃貸人から委託を受けて管理業務を行う事業をいう。","a":true,"fact":"委託を受けて行うことが要件。自己所有物件の管理は該当しない。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"更新の申請をせずに有効期間（5年）が満了すると、登録は効力を失う。","a":true,"fact":"更新申請は満了の90日前〜30日前。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"法人の役員に登録拒否事由に該当する者がいる場合、その法人は登録を拒否される。","a":true,"fact":"役員の欠格は法人の登録拒否事由。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"拘禁刑に処せられた者は、刑の執行を終えた日から3年を経過すれば登録を受けることができる。","a":false,"fact":"5年を経過しなければ登録を受けられない。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者は登録申請時に選任すれば足り、その後欠けても新たに選任する必要はない。","a":false,"fact":"欠けた場合は新たに選任するまで管理受託契約を締結できない。常に営業所ごとに1人以上必要。","trap":""},{"f":"賃貸住宅管理業法","k":"書面","q":"管理受託契約締結時書面は、委託者の承諾があっても、電子メールで提供することはできない。","a":false,"fact":"委託者の承諾があれば電磁的方法で提供できる。","trap":""},{"f":"賃貸住宅管理業法","k":"再委託","q":"管理業務の一部を再委託する場合、再委託先は賃貸住宅管理業の登録を受けた者でなければならない。","a":false,"fact":"再委託先が登録業者である必要はない。ただし全部の再委託は禁止で、責任は委託を受けた管理業者が負う。","trap":""},{"f":"賃貸住宅管理業法","k":"分別管理","q":"家賃等を管理する口座は、管理受託契約ごとに必ず別々に設けなければならない。","a":false,"fact":"口座は1つでもよい。帳簿等で委託者ごとに区分して管理する。","trap":""},{"f":"賃貸住宅管理業法","k":"従業者証明書","q":"従業者証明書は、取引の関係者から請求があっても提示する義務はない。","a":false,"fact":"関係者から請求があれば提示しなければならない。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"管理業務報告書の説明は、一定の要件を満たせばテレビ会議等のITを活用して行うことができる。","a":true,"fact":"書面（又は電磁的方法）を交付したうえで、ITによる説明も可能。","trap":""},{"f":"賃貸住宅管理業法","k":"秘密保持","q":"賃貸住宅管理業者は、管理業を営まなくなった後は、秘密保持義務を負わない。","a":false,"fact":"管理業者でなくなった後も、従業者でなくなった後も秘密保持義務を負う。","trap":""},{"f":"賃貸住宅管理業法","k":"監督","q":"国土交通大臣は、賃貸住宅管理業者に報告を求め、営業所に立ち入って検査させることができる。","a":true,"fact":"報告徴収・立入検査の権限がある。","trap":""},{"f":"賃貸住宅管理業法","k":"罰則","q":"従業者が業務に関して違反行為をした場合、行為者のほか法人にも罰金刑が科されることがある。","a":true,"fact":"両罰規定。","trap":""},{"f":"賃貸住宅管理業法","k":"定義","q":"賃貸人のために維持保全に係る契約の締結の媒介・取次ぎ・代理を行う業務も、維持保全を行う業務に含まれる。","a":true,"fact":"修繕業者の手配などが該当する。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"説明から契約締結まで1週間程度空けられない場合は、事前に書面を送付するなど、相手方が十分に理解できるよう配慮することが望ましい。","a":true,"fact":"相手方が内容を理解したうえで契約できるようにするため。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"定期報告は委託者（賃貸人）に対して行うもので、入居者に報告する義務はない。","a":true,"fact":"報告の相手方は委託者。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"自ら所有する賃貸住宅を自ら管理している戸数も、登録義務の判定（200戸）に含める。","a":false,"fact":"委託を受けて管理する戸数で判定する。自己所有物件の管理は賃貸住宅管理業に当たらない。","trap":""},{"f":"賃貸住宅管理業法","k":"名義貸し","q":"名義貸しの禁止には、他人に自己の名義で賃貸住宅管理業を営む旨の表示や広告をさせることも含まれる。","a":true,"fact":"法11条2項。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定転貸事業者が入居者（転借人）と締結する転貸借契約にも、特定賃貸借契約重要事項説明が必要である。","a":false,"fact":"特定賃貸借契約重要事項説明はオーナーとの契約が対象。入居者との転貸借は宅建業法等の問題。","trap":""},{"f":"サブリース（特定賃貸借）","k":"勧誘","q":"勧誘時に用いる資料に家賃減額のリスクを記載しないことは、誇大広告等や不当勧誘に当たり得る。","a":true,"fact":"重要なリスクの不表示・不告知は規制対象になり得る。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"相手方のオーナーが不動産賃貸の経験が豊富な個人であれば、重要事項説明を省略できる。","a":false,"fact":"省略できるのは管理業者・宅建業者等の一定のプロのみ。個人オーナーは経験を問わず必要。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定賃貸借契約重要事項説明は、締結時書面の交付と同時に行えば足りる。","a":false,"fact":"契約締結「前」に行う必要がある。","trap":""},{"f":"サブリース（特定賃貸借）","k":"書類閲覧","q":"特定転貸事業者は、業務及び財産の状況を記載した書類を営業所に備え置き、相手方等の求めに応じて閲覧させなければならない。","a":true,"fact":"法32条。","trap":""},{"f":"サブリース（特定賃貸借）","k":"不当勧誘","q":"相手方を長時間拘束するなど、迷惑を覚えさせるような方法で勧誘することは禁止されている。","a":true,"fact":"迷惑を覚えさせる勧誘の禁止。","trap":""},{"f":"サブリース（特定賃貸借）","k":"不当勧誘","q":"「家賃が減額されることは一切ない」と告げて勧誘することは、不実告知に当たり得る。","a":true,"fact":"借地借家法32条により減額はあり得るため。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"サブリース業者の家賃減額請求は、オーナーが承諾しなければ効力を生じない。","a":false,"fact":"増減額請求は形成権。相当な額の範囲で請求時から効力が生じる（争いは調停・裁判で確定）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"サブリース業者から減額請求を受けたオーナーは、裁判確定までは相当と認める額の家賃を請求できる。","a":true,"fact":"借地借家法32条3項。","trap":""},{"f":"サブリース（特定賃貸借）","k":"誇大広告","q":"「空室保証」と表示する場合、家賃支払の免責期間があるなら、その旨も表示しないと誇大広告となり得る。","a":true,"fact":"免責期間を隠すと誤認を招く。","trap":""},{"f":"サブリース（特定賃貸借）","k":"監督","q":"特定転貸事業者が業務停止命令に違反した場合、罰則の対象となる。","a":true,"fact":"業務停止命令違反には罰則がある。","trap":""},{"f":"サブリース（特定賃貸借）","k":"監督","q":"国土交通大臣は、勧誘者に対しても指示や勧誘停止の命令をすることができる。","a":true,"fact":"勧誘者も監督処分の対象。","trap":""},{"f":"サブリース（特定賃貸借）","k":"書面","q":"特定賃貸借契約の重要事項説明書と締結時書面は、別個の書面として交付する必要がある。","a":true,"fact":"一体化は不可（締結時書面は契約書との兼用は可）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"特定賃貸借契約は、オーナー（賃貸人）と特定転貸事業者（賃借人）との間の賃貸借契約である。","a":true,"fact":"いわゆるマスターリース契約。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"維持保全をオーナー自らが行う内容の契約は、特定賃貸借契約に該当しない。","a":false,"fact":"転貸事業を目的とする賃貸借であれば、維持保全を誰が行うかに関係なく該当する。","trap":""},{"f":"サブリース（特定賃貸借）","k":"施行時期","q":"サブリース規制は、賃貸住宅管理業の登録制度よりも後に施行された。","a":false,"fact":"サブリース規制は2020年12月、登録制度は2021年6月の施行。サブリース規制が先。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃貸人の義務","q":"賃貸人は、賃借人が賃借物を使用収益できる状態に置く義務までは負わない。"," }
function noteList() {
  const q = ui.noteQ.trim(), f = ui.noteF, sg = ui.noteSeg;
  const hit = (...s) => !q || s.join(' ').includes(q);
  let rows = [];
  const fv = ui.fillView;
  if (sg === 'pt') rows = POINTS.map((p, i) => ({ id: 'p' + i, f: p[0], k: p[1], body: fv ? `<span class="fill">${fillHTML('p' + i)}</span>` : esc(p[2]), tag: `<span class="badge warn">${p[3]}</span>`, ok: (!f || p[0] === f) && (!ui.star3 || p[3] === '★★★') && hit(...p) }));
  if (sg === 'det') rows = DETAILS.map((d, i) => ({ id: 'd' + i, f: d.f, k: d.k, body: (fv ? `<span class="fill">${fillHTML('d' + i)}</span>` : esc(d.fact)) + (d.trap && !fv ? `<div class="trap">⚠ ${esc(d.trap)}</div>` : ''), tag: '', ok: (!f || d.f === f) && hit(d.f, d.k, d.fact, d.trap) }));
  if (sg === 'num') rows = NUMS.map((n, i) => ({ id: 'n' + i, f: n[0], k: n[1], body: `<span class="num ${S.hideNum && !ui.shown?.[i] ? 'hide' : ''}" data-a="nShow" data-v="${i}">${esc(n[2])}</span>`, tag: '', ok: (!f || n[0] === f) && hit(...n) }));
  rows = rows.filter(r => r.ok);
  if (!rows.length) return '<div class="empty">該当する項目がありません</div>';
  let prev = '';
  return `<div class="s" style="margin-bottom:6px">${rows.length}件　✔＝覚えた</div>` + rows.map(r => {
    const head = r.f !== prev ? `<h2>${esc(r.f)}</h2>` : ''; prev = r.f;
    return `${head}<div class="card ${S.chk[r.id] ? 'done' : ''}"><div class="row" style="align-items:flex-start"><div class="grow"><div class="t">${esc(r.k)} ${r.tag}</div><div style="margin-top:2px">${r.body}</div></div><button class="chk ${S.chk[r.id] ? 'on' : ''}" data-a="nChk" data-v="${r.id}">${S.chk[r.id] ? '✔' : ''}</button></div></div>`;
  }).join('');
}

/* 穴埋めテスト */
function startFill(mode, pool) {
  let q = pool;
  if (mode === 'unchk') q = q.filter(id => !S.chk[id]);
  if (mode === 'weak') q = q.filter(id => S.fill[id]?.l === 0);
  if (mode !== 'order') q = shuffle(q);
  if (mode === 'random10') q = q.slice(0, 10);
  if (!q.length) return toast('対象の項目がありません');
  ui.fq = q; ui.fi = 0; ui.fAll = false; ui.fRes = []; ui.rev = new Set(); tab = 'notes'; render(); scrollTo(0, 0);
}
function vFillQ() {
  const id = ui.fq[ui.fi], m = fmeta(id), n = fcount(id);
  const opened = ui.fAll || [...Array(n).keys()].every(k => ui.rev.has(id + ':' + k));
  return `
  <div class="row" style="margin:4px 0 8px"><button class="btn ghost sm" data-a="fExit">← 終了</button><div class="grow"></div><span class="badge">${ui.fi + 1} / ${ui.fq.length}</span></div>
  <div class="card">
    <div class="row" style="flex-wrap:wrap;gap:6px"><span class="badge">${esc(m.f)}</span><span class="badge warn">${id[0] === 'p' ? '重要ポイント ' + m.star : '★★★詳細'}</span>${S.chk[id] ? '<span class="badge ok">覚えた</span>' : S.fill[id]?.l === 0 ? '<span class="badge ng">前回まだ</span>' : ''}</div>
    <div class="t" style="margin:10px 0 4px">${esc(m.k)}</div>
    <div class="fill">${fillHTML(id, ui.fAll)}</div>
    ${opened && m.trap ? `<div class="pt"><b>⚠ ひっかけ注意</b>${esc(m.trap)}</div>` : ''}
    <div class="s" style="margin-top:6px">空欄（${n}か所）をタップすると1つずつ答えが出ます</div>
  </div>
  ${opened ? `<div class="grid2"><button class="btn ng" data-a="fGrade" data-v="0">✖ まだ</button><button class="btn" data-a="fGrade" data-v="1">✔ 覚えた</button></div>`
    : `<button class="btn wide sec" data-a="fAllOpen">答えを全部見る</button>`}`;
}
function vFillEnd() {
  const ok = ui.fRes.filter(x => x.ok).length, ng = ui.fRes.filter(x => !x.ok).map(x => x.id);
  return `
  <div class="card hero"><div class="s">穴埋めテストの結果</div><div class="big">覚えた ${ok} / ${ui.fRes.length}</div><div class="s">「まだ」は ${ng.length} 項目</div></div>
  ${ng.length ? `<h2>「まだ」の項目（答え）</h2>${ng.map(id => `<div class="card"><div class="t">${esc(fmeta(id).k)}</div><div class="fill">${fillHTML(id, true)}</div></div>`).join('')}` : ''}
  <div class="grid2">${ng.length ? `<button class="btn" data-a="fRetry">「まだ」をもう一度</button>` : ''}<button class="btn ghost" data-a="fExit">終了</button></div>`;
}

/* ===== 記録 ===== */
function vRec() {
  const mockTable = set => { const m = mockStats(set); return `<h2>予想模試 第${set}回（${m.n}/50問・正解${m.ok}問・${pct(m.ok, m.n)}%）</h2><div class="card"><table class="ftab">${MFIELDS.map(f => { const qs = MOCKS[set - 1].filter(q => q.f === f), a = qs.filter(q => mrec(q.no, set)), o = a.filter(q => mrec(q.no, set).ok);
    return `<tr><td>${esc(f)}</td><td>${o.length}/${a.length}（全${qs.length}問）</td></tr>`; }).join('')}</table></div>`; };
  const drillTable = set => { const D = DRILLS[set]; return `<h2>${DSET_NAME[set]}</h2><div class="card"><table class="ftab">${uniq(D.map(d => d.f)).map(f => { const ids = D.map((_, i) => i).filter(i => D[i].f === f), a = ids.filter(i => drec(i, set)), c = a.reduce((s, i) => s + drec(i, set).c, 0), n = a.reduce((s, i) => s + drec(i, set).n, 0);
    return `<tr><td>${esc(f)}</td><td>覚えた${ids.filter(i => masteredS(set, i)).length}/${ids.length}・正答率${pct(c, n)}%</td></tr>`; }).join('')}</table></div>`; };
  return `
  ${mockTable(1)}${mockTable(2)}
  <h2>本番モードの履歴</h2>
  ${S.hist.length ? `<div class="card"><table class="ftab">${S.hist.slice().reverse().map(h => `<tr><td>第${h.set || 1}回　${esc(h.date)}（${h.min}分）</td><td><b>${h.score}点</b>${h.exempt ? '（免除込）' : `／免除${h.ex}点`}</td></tr>`).join('')}</table></div>` : '<div class="card s">まだ記録がありません</div>'}
  ${drillTable(0)}${drillTable(1)}
  <h2>リセット</h2>
  <div class="grid2"><button class="btn ghost" data-a="reset" data-v="mock">模試の記録</button><button class="btn ghost" data-a="reset" data-v="drill">○×の記録</button>
  <button class="btn ghost" data-a="reset" data-v="chk">要点のチェック</button><button class="btn ng" data-a="reset" data-v="all">すべて消去</button></div>
  <div class="s" style="margin-top:12px">記録はこの端末のブラウザ内に保存されます。ブラウザのデータを消去すると記録も消えます。</div>`;
}

/* ===== 操作 ===== */
const H = {
  tab: v => { tab = v; render(); scrollTo(0, 0); },
  go: v => H.tab(v),
  exSet: v => { S.exempt = v === '1'; save(); render(); },
  mSet: v => { S.mset = +v; ui.mq = null; ui.result = null; save(); render(); },
  homeMock: v => {
    const [set, mode] = v.split(':');
    if (S.exam) return startMock([1]);
    S.mset = +set; save();
    if (mode === 'exam') { tab = 'mock'; return H.exStart(); }
    H.mStart(mode);
  },
  mStart: v => {
    const all = MOCK().map(q => q.no).filter(inScope);
    if (v === 'first') startMock(all);
    if (v === 'next') { const i = all.findIndex(n => !mrec(n)); startMock(all, i < 0 ? 0 : i); }
    if (v === 'wrong') startMock(all.filter(n => mrec(n) && !mrec(n).ok));
    if (v === 'shuffle') startMock(shuffle(all));
  },
  mOpen: v => startMock(MOCK().map(q => q.no), +v - 1),
  mAns: v => { const q = MOCK().find(x => x.no === ui.mq[ui.mi]); if (ui.mRev) return; S.mock[mk(q.no)] = { c: +v, ok: +v === q.ans }; ui.mRev = true; save(); render(); },
  mMove: v => { ui.mi += +v; ui.mRev = false; if (ui.mi >= ui.mq.length) { ui.mq = null; toast('おつかれさまでした'); } else if (mrec(ui.mq[ui.mi])) ui.mRev = true; render(); scrollTo(0, 0); },
  mExit: () => { ui.mq = null; ui.mRev = false; render(); },
  exStart: () => { if (!confirm(`第${S.mset}回の本番モード（${S.exempt ? '45問・110分' : '50問・120分'}）を開始しますか？`)) { render(); return; } S.exam = { set: S.mset, exempt: S.exempt, start: Date.now(), ans: {} }; ui.ei = 0; ui.mq = null; ui.result = null; save(); render(); scrollTo(0, 0); },
  eMove: v => { ui.ei = Math.max(0, Math.min(examQs().length - 1, (ui.ei || 0) + +v)); render(); scrollTo(0, 0); },
  eJump: v => { ui.ei = +v; render(); scrollTo(0, 0); },
  exQuit: () => { if (confirm('本番モードを中止します。解答は保存されません。')) { S.exam = null; save(); render(); } },
  exGrade: () => { const n = Object.keys(S.exam.ans).length, t = examQs().length; if (!confirm(n < t ? `未解答が${t - n}問あります。採点しますか？` : '採点しますか？')) return; grade(); render(); scrollTo(0, 0); },
  rReview: () => { const r = ui.result, w = MOCK().filter(q => (!r.exempt || q.no <= 45) && r.ans[q.no] !== q.ans).map(q => q.no); ui.result = null; if (w.length) startMock(w); else { toast('全問正解です！'); render(); } },
  rClose: () => { ui.result = null; render(); },
  dSet: v => { S.dset = +v; ui.dF = []; save(); render(); },
  dField: v => { ui.dF = ui.dF.includes(v) ? ui.dF.filter(x => x !== v) : [...ui.dF, v]; render(); },
  dOne: v => startDrill('order', [v]),
  dStart: v => startDrill(v, ui.dF),
  homeDrill: v => { const [set, mode] = v.split(':'); S.dset = +set; ui.dF = []; save(); startDrill(mode, [], +set); },
  mixWeak: () => runDrill(shuffle([0, 1].flatMap(set => DRILLS[set].map((_, i) => [set, i]).filter(([s, i]) => weakS(s, i) && !outScopeF(DRILLS[s][i].f))))),
  dAns: v => {
    const [set, i] = ui.dq[ui.di], ok = (+v === 1) === DRILLS[set][i].a, r = drec(i, set) || { n: 0, c: 0, s: 0 };
    r.n++; if (ok) { r.c++; r.s++; } else r.s = 0; r.l = ok ? 1 : 0; S.drill[dk(i, set)] = r;
    ui.dAns = +v; ui.dRes.push({ set, i, ok }); save(); render();
  },
  dNext: () => { ui.di++; ui.dAns = null; render(); scrollTo(0, 0); },
  dRetry: () => runDrill(shuffle(ui.dRes.filter(x => !x.ok).map(x => [x.set, x.i]))),
  dExit: () => { ui.dq = null; render(); scrollTo(0, 0); },
  nSeg: v => { ui.noteSeg = v; ui.noteF = ''; ui.noteQ = ''; render(); },
  nMode: v => { ui.fillView = v === 'fill'; ui.rev = new Set(); render(); },
  fRev: v => { ui.rev.has(v) ? ui.rev.delete(v) : ui.rev.add(v); if (ui.fq) render(); else $('#nlist').innerHTML = noteList(); },
  fStart: v => startFill(v, fillPool()),
  homeFill: v => { ui.noteF = ''; startFill(v, fillPool('all')); },
  fAllOpen: () => { ui.fAll = true; render(); },
  fGrade: v => {
    const id = ui.fq[ui.fi], ok = v === '1', r = S.fill[id] || { n: 0, c: 0 };
    r.n++; if (ok) r.c++; r.l = ok ? 1 : 0; S.fill[id] = r;
    if (ok) S.chk[id] = true; else delete S.chk[id];
    ui.fRes.push({ id, ok }); ui.fi++; ui.fAll = false; save(); render(); scrollTo(0, 0);
  },
  fRetry: () => startFill('random', ui.fRes.filter(x => !x.ok).map(x => x.id)),
  fExit: () => { ui.fq = null; ui.rev = new Set(); render(); scrollTo(0, 0); },
  nStar: () => { ui.star3 = !ui.star3; render(); },
  nHide: () => { S.hideNum = !S.hideNum; ui.shown = {}; save(); render(); },
  nShow: v => { if (!S.hideNum) return; ui.shown = ui.shown || {}; ui.shown[v] = !ui.shown[v]; $('#nlist').innerHTML = noteList(); },
  nChk: v => { S.chk[v] = !S.chk[v]; if (!S.chk[v]) delete S.chk[v]; save(); $('#nlist').innerHTML = noteList(); },
  reset: v => {
    const names = { mock: '模試の記録（第1回・第2回）', drill: '○×の記録（両セット）', chk: '要点のチェックと穴埋めの記録', all: 'すべての記録' };
    if (!confirm(`${names[v]}を消去します。元に戻せません。よろしいですか？`)) return;
    if (v === 'mock' || v === 'all') { S.mock = {}; S.hist = []; S.exam = null; }
    if (v === 'drill' || v === 'all') S.drill = {};
    if (v === 'chk' || v === 'all') { S.chk = {}; S.fill = {}; }
    save(); render(); toast('消去しました');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT') return;
  if (el.dataset.a === 'mAns' && S.exam && tab === 'mock') { S.exam.ans[examQs()[ui.ei || 0].no] = +el.dataset.v; save(); render(); return; }
  const f = H[el.dataset.a]; if (f) f(el.dataset.v);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'mField' && el.value) startMock(MOCK().filter(q => q.f === el.value).map(q => q.no));
  if (el.dataset.a === 'nField') { ui.noteF = el.value; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'nq') { ui.noteQ = e.target.value; $('#nlist').innerHTML = noteList(); } });

if (S.exam) ui.ei = 0;
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
