<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="賃貸管理士">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>賃貸管理士 合格ドリル</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#1b2433;--sub:#667085;--line:#e3e8e7;--pri:#0f766e;--pri-soft:#e0f2ef;--ok:#16a34a;--ok-soft:#dcfce7;--ng:#dc2626;--ng-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17201f;--text:#e7eeec;--sub:#93a3a0;--line:#283432;--pri:#2dd4bf;--pri-soft:#123532;--ok:#4ade80;--ok-soft:#123a22;--ng:#f87171;--ng-soft:#3d1818;--warn:#fbbf24;--warn-soft:#3a2e10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:20px;margin:0}
#hd{font-size:12px;color:var(--sub);text-align:right}
#hd.alert{color:var(--ng);font-weight:700}
main{padding:0 16px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.click{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t{font-weight:700;word-break:break-word}
.s{color:var(--sub);font-size:13px;word-break:break-word}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.ng{background:var(--ng-soft);color:var(--ng)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.gray{background:var(--line);color:var(--sub)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--pri);color:#fff;font-family:inherit}
.btn.sec{background:var(--pri-soft);color:var(--pri)}.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line)}.btn.ng{background:var(--ng-soft);color:var(--ng)}.btn.sm{padding:6px 10px;font-size:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;color:var(--sub);font-weight:700;font-size:13px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--pri)}
.prog.ok i{background:var(--ok)}
.big{font-size:34px;font-weight:800;line-height:1.1}
.hero{background:var(--pri);color:#fff;border:0}
.hero .s{color:rgba(255,255,255,.85)}
.stem{font-weight:700;font-size:16px;margin:4px 0 12px;white-space:pre-wrap}
.items{background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.items div{padding:4px 0;border-bottom:1px dashed var(--line)}.items div:last-child{border:0}
.ch{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font:inherit;color:var(--text)}
.ch .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ch.sel{border-color:var(--pri);background:var(--pri-soft)}.ch.sel .n{background:var(--pri);color:#fff}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}.ch.right .n{background:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}.ch.wrong .n{background:var(--ng);color:#fff}
.ch .why{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.res{border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-weight:800;font-size:17px}
.res.ok{background:var(--ok-soft);color:var(--ok)}.res.ng{background:var(--ng-soft);color:var(--ng)}
.pt{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.pt b{display:block;font-size:12px;margin-bottom:2px}
.qnav{display:flex;gap:8px;margin-top:12px}.qnav .btn{flex:1}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cells button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-weight:700;padding:0;font-family:inherit}
.cells button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cells button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.cells button.sel{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.cells button.cur{outline:2px solid var(--text)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ox button{border:0;border-radius:16px;padding:18px 0;font-size:34px;font-weight:800;font-family:inherit}
.ox .o{background:var(--ok-soft);color:var(--ok)}.ox .x{background:var(--ng-soft);color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;font-family:inherit}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:14px;line-height:22px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{color:var(--sub)}
.trap{color:var(--ng);font-size:13px;margin-top:4px}
.num{font-weight:800;color:var(--ng)}
.num.hide{background:var(--line);color:transparent;border-radius:6px;user-select:none}
.empty{text-align:center;color:var(--sub);padding:28px 0}
.stat{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2433;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.ftab{width:100%;border-collapse:collapse;font-size:13px}.ftab td{padding:6px 0;border-bottom:1px solid var(--line)}.ftab td:last-child{text-align:right;white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="title">ホーム</h1><span id="hd"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
'use strict';
const DATA = {"mock":[{"no":1,"f":"管理受託契約","stem":"管理受託契約重要事項説明（賃貸住宅管理業法第13条）に関する次の記述のうち、最も不適切なものはどれか。","c":["管理受託契約重要事項説明は、管理受託契約の締結前に行わなければならず、説明から契約締結までに1週間程度の期間をおくことが望ましい。","テレビ会議等のITを活用した説明は、相手方の承諾を得たうえで、書面を事前に送付し、映像・音声を双方向でやりとりできる環境であれば行うことができる。","委託者となろうとする者が宅地建物取引業者である場合、管理受託契約重要事項説明は不要である。","管理受託契約重要事項説明は、業務管理者が自ら行わなければならない。"],"ans":4,"pt":"重説は「締結前」「説明者の資格制限なし」「プロ相手は不要」の3点セットで覚える。","exp":[{"ok":true,"r":"契約締結前に行う義務があり、相手方が内容を理解する時間として1週間程度おくことが望ましいとされる。"},{"ok":true,"r":"IT重説は一定の要件（相手方の承諾、事前送付、双方向でのやりとり等）を満たせば可能。"},{"ok":true,"r":"相手方が賃貸住宅管理業者・特定転貸事業者・宅建業者等のプロである場合は説明不要。"},{"ok":false,"r":"説明者の資格は法定されていない。業務管理者の管理・監督の下で行えばよく、業務管理者や一定の実務経験者等が行うことが「望ましい」にとどまる。"}]},{"no":2,"f":"管理受託契約","stem":"管理受託契約の変更・更新時の重要事項説明に関する次の記述のうち、最も適切なものはどれか。","c":["契約の同一性を保ったまま管理業務の内容を変更する場合であれば、重要事項説明は一切不要である。","契約期間のみを延長する更新で、従前の契約と異なる内容がない場合は、改めて重要事項説明を行う必要はない。","法施行前に締結された管理受託契約は、法施行後に契約内容を変更する場合であっても、重要事項説明は不要である。","管理受託契約重要事項説明書は、相手方の承諾を得たとしても、電磁的方法により提供することはできない。"],"ans":2,"pt":"「期間のみ延長」は不要、「重要事項に変更」は変更部分の説明が必要。","exp":[{"ok":false,"r":"重要事項に変更がある場合は、変更のあった事項について説明が必要。"},{"ok":true,"r":"契約の同一性を保ったまま契約期間のみを延長する場合等は、改めての説明は不要とされる。"},{"ok":false,"r":"法施行前の契約でも、施行後に変更契約を締結する場合は重要事項説明が必要。"},{"ok":false,"r":"相手方の承諾があれば電磁的方法による提供が可能。"}]},{"no":3,"f":"管理受託契約","stem":"管理受託契約締結時の書面（賃貸住宅管理業法第14条）に関する次の記述のうち、最も適切なものはどれか。","c":["管理受託契約締結時書面は、管理受託契約重要事項説明書と一体の書面として交付することができる。","法定の記載事項をすべて記載した管理受託契約書を交付すれば、これをもって管理受託契約締結時書面に代えることができる。","管理受託契約締結時書面を電磁的方法で提供する場合、相手方の承諾は不要である。","管理受託契約において管理業務の全部を再委託できる旨を定めれば、管理業務の全部を他の者に再委託することができる。"],"ans":2,"pt":"重説書面と契約締結時書面は一体化NG、契約書と締結時書面の兼用はOK。","exp":[{"ok":false,"r":"締結前の重説書面と締結時書面は、交付時期・目的が異なるため別個の書面で交付する必要がある。"},{"ok":true,"r":"契約書に法定事項が記載されていれば、契約締結時書面を兼ねることができる。"},{"ok":false,"r":"電磁的方法での提供には相手方の承諾が必要。"},{"ok":false,"r":"管理業務の全部の再委託は禁止（法15条）。一部の再委託のみ可能。"}]},{"no":4,"f":"管理受託契約","stem":"業務管理者に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸住宅管理業者は、営業所又は事務所ごとに、1人以上の業務管理者を選任しなければならない。","業務管理者が欠けた営業所では、新たに業務管理者を選任するまでの間、管理受託契約を締結してはならない。","業務管理者は、他の営業所又は事務所の業務管理者を兼ねることはできない。","業務管理者は、同じ営業所の宅地建物取引業における専任の宅地建物取引士を兼務することはできない。"],"ans":4,"pt":"業務管理者：営業所ごと1人以上・他営業所との兼任不可・欠けたら新規契約締結不可。","exp":[{"ok":true,"r":"法12条1項。営業所・事務所ごとに1人以上。"},{"ok":true,"r":"法12条2項。新規の管理受託契約の締結が禁止される。"},{"ok":true,"r":"複数の営業所の業務管理者の兼任は不可。"},{"ok":false,"r":"業務に支障がない限り、業務管理者が宅建士（専任の宅建士を含む）を兼務することは可能。"}]},{"no":5,"f":"管理受託契約","stem":"賃貸住宅管理業法上の「管理業務」に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸人から委託を受けて、家賃の収納業務のみを行うことは、管理業務に該当する。","入居者からの苦情対応のみを行う業務は、管理業務に該当する。","居室及び共用部分の点検・清掃その他の維持を行い、必要な修繕を行うことを一貫して行う業務は、管理業務（維持保全）に該当する。","定期清掃業者が共用部分の清掃のみを請け負う業務は、管理業務に該当する。"],"ans":3,"pt":"管理業務＝①維持保全（点検等＋修繕を一貫）②金銭管理（①と併せる場合のみ）。","exp":[{"ok":false,"r":"金銭管理業務は、維持保全業務と併せて行う場合に限り管理業務に該当。収納のみは該当しない。"},{"ok":false,"r":"苦情対応のみでは維持保全に該当しない。"},{"ok":true,"r":"点検・清掃等と修繕を一貫して行うことが「維持保全」。修繕の手配を含む。"},{"ok":false,"r":"清掃のみ・点検のみ等、維持又は修繕の一方のみを行う業務は該当しない。"}]},{"no":6,"f":"管理受託契約","stem":"賃貸住宅管理業法上の「賃貸住宅」に関する次の記述のうち、最も不適切なものはどれか。","c":["建設工事完了前の建物であっても、完了後に賃借人の募集が予定され、居住の用に供することが明らかな場合は、賃貸住宅に該当する。","事業者が社宅として借り上げ、従業員を居住させる住宅は、賃貸住宅に該当する。","1つの賃貸借契約で住宅部分と事務所部分を一括して賃貸する場合、事務所部分を含め全体が賃貸住宅に該当する。","旅館業法の許可を受けて営業するウィークリーマンションは、賃貸住宅に該当しない。"],"ans":3,"pt":"賃貸住宅は「人の居住の用」に供する部分のみ。旅館業・民泊（宿泊中）等は除外。","exp":[{"ok":true,"r":"竣工前でも居住用として賃貸されることが明らかなら該当する。"},{"ok":true,"r":"人の居住の用に供する家屋の賃貸借であり該当する。"},{"ok":false,"r":"住宅として使用するために賃借されている部分のみが賃貸住宅に該当する。"},{"ok":true,"r":"旅館業法の営業に該当するものは賃貸住宅から除外される。"}]},{"no":7,"f":"管理受託契約","stem":"賃貸住宅標準管理受託契約書に関する次の記述のうち、最も不適切なものはどれか。","c":["管理業者は管理業務の一部を再委託できるが、再委託先の行為については、自らなしたと同等の責任を委託者に対して負う。","管理業者は、管理業務を行うため必要があるときは、あらかじめ入居者に通知して承諾を得ることなく、いつでも住戸に立ち入ることができる。","管理業者は、入居者に対し、管理業務の内容・実施方法及び連絡先を周知しなければならない。","災害又は事故等の緊急時で委託者の承認を受ける時間的余裕がないときは、管理業者は承認を受けずに業務を実施でき、事後速やかに委託者に通知しなければならない。"],"ans":2,"pt":"住戸への立入りは原則「入居者への事前通知＋承諾」。緊急時は例外。","exp":[{"ok":true,"r":"再委託先の行為について管理業者が責任を負う。"},{"ok":false,"r":"原則として、あらかじめ入居者に通知し承諾を得なければならない（緊急時は例外）。"},{"ok":true,"r":"入居者への対応に関する規定。"},{"ok":true,"r":"緊急時の業務の規定。事後の通知が必要。"}]},{"no":8,"f":"維持保全・原状回復","stem":"「原状回復をめぐるトラブルとガイドライン（再改訂版）」に関する次の記述のうち、最も不適切なものはどれか。","c":["畳表は消耗品的な性格が強いため、経過年数を考慮しない。","喫煙によりクロスが変色したり臭いが付着した場合は、通常の使用による損耗を超えるものとして賃借人の負担となり得る。","入居者の入れ替わりに伴う鍵の交換費用は、原則として賃借人の負担とされる。","壁クロスの耐用年数は6年とされ、6年経過すると残存価値は1円となる。"],"ans":3,"pt":"クロス6年で1円、畳表・襖紙は経過年数考慮なし、鍵交換（入替時）は賃貸人負担。","exp":[{"ok":true,"r":"畳表・襖紙・障子紙等は経過年数を考慮しない。"},{"ok":true,"r":"タバコのヤニ・臭いは賃借人負担となり得る。"},{"ok":false,"r":"入居者入れ替わり時の鍵交換は物件管理上の問題であり、賃貸人負担が妥当とされる（紛失・破損の場合は賃借人負担）。"},{"ok":true,"r":"経過年数を考慮し、6年で残存価値1円となるよう賃借人負担割合を算定する。"}]},{"no":9,"f":"維持保全・原状回復","stem":"「原状回復をめぐるトラブルとガイドライン（再改訂版）」において、通常損耗・経年変化として賃貸人が負担すべきものとされているものはいくつあるか。","c":["１つ","２つ","３つ","４つ"],"items":["家具の設置による床・カーペットのへこみ、設置跡","冷蔵庫等の後部壁面の黒ずみ（いわゆる電気ヤケ）","引越作業で生じたひっかきキズ","ポスターやカレンダー等の掲示のための壁等の画鋲・ピンの穴（下地ボードの張替えが不要な程度）"],"ans":3,"pt":"画鋲穴＝賃貸人、釘・ネジ穴（下地張替え）＝賃借人。電気ヤケ・家具跡＝賃貸人。","itemExp":[{"ok":true,"r":"通常損耗（賃貸人負担）。"},{"ok":true,"r":"通常損耗（賃貸人負担）。"},{"ok":false,"r":"賃借人の善管注意義務違反・過失によるもので賃借人負担。"},{"ok":true,"r":"通常損耗（賃貸人負担）。釘穴・ネジ穴で下地ボード張替えが必要なものは賃借人負担。"}],"note":"→ 該当するものは3つ。正解は肢3。"},{"no":10,"f":"建物・設備","stem":"給水設備に関する次の記述のうち、最も不適切なものはどれか。","c":["高置水槽方式は、受水槽の水をポンプで屋上の高置水槽に揚水し、重力により各住戸に給水する方式である。","受水槽は、上部のみ点検できれば足り、周囲及び下部から点検できるように設置する必要はない。","受水槽の有効容量が10㎥を超える簡易専用水道の設置者は、1年以内ごとに1回、登録検査機関による検査を受けなければならない。","水道直結増圧方式は、水道本管から分岐した給水管に増圧給水ポンプを設けて圧力を上げて給水する方式で、受水槽を必要としない。"],"ans":2,"pt":"簡易専用水道＝10㎥超・年1回検査。受水槽は六面点検。","exp":[{"ok":true,"r":"高置水槽方式の説明として正しい。"},{"ok":false,"r":"受水槽は六面点検ができるよう設置する（上部100cm以上、周囲・下部60cm以上の空間）。"},{"ok":true,"r":"簡易専用水道は年1回以上の定期検査と水槽清掃が必要。"},{"ok":true,"r":"直結増圧方式は受水槽不要。"}]},{"no":11,"f":"建物・設備","stem":"排水設備に関する次の記述のうち、最も適切なものはどれか。","c":["通気管は、排水管内の臭気を室内に導くために設けられる。","排水トラップの封水深は、一般に5cm以上10cm以下とされている。","建物の雨水排水管は、汚水排水管に接続して一本化することが原則である。","1つの排水系統に排水トラップを直列に2つ設ける二重トラップは、排水性能を高めるため推奨されている。"],"ans":2,"pt":"封水深5〜10cm、二重トラップ禁止、通気管は封水保護。","exp":[{"ok":false,"r":"通気管は排水管内の気圧変動を緩和し、トラップの封水を保護するために設ける。"},{"ok":true,"r":"封水深は5〜10cm。浅いと破封しやすく、深いと自浄作用が低下する。"},{"ok":false,"r":"雨水は単独の系統で排水するのが原則。"},{"ok":false,"r":"二重トラップは排水の流れを悪くするため禁止。"}]},{"no":12,"f":"建物・設備","stem":"換気設備に関する次の記述のうち、最も不適切なものはどれか。","c":["シックハウス対策として、平成15年（2003年）の建築基準法改正により、居室には原則として24時間換気設備の設置が義務付けられた。","第1種換気は、給気・排気ともに機械で行う方式である。","第2種換気は、給気を機械、排気を自然換気で行う方式で、室内は正圧となる。","第3種換気は、給気を機械で行い、排気を自然換気で行う方式である。"],"ans":4,"pt":"第1種＝機械＋機械、第2種＝機械給気（正圧）、第3種＝機械排気（負圧・住宅に多い）。","exp":[{"ok":true,"r":"機械換気設備の設置義務。"},{"ok":true,"r":"熱交換型換気扇などが代表例。"},{"ok":true,"r":"クリーンルーム等で用いられる。"},{"ok":false,"r":"第3種換気は「自然給気＋機械排気」。住宅で最も多く採用され、室内は負圧になる。"}]},{"no":13,"f":"建物・設備","stem":"消防用設備等に関する次の記述のうち、最も適切なものはどれか。","c":["住宅用火災警報器の設置義務は新築住宅に限られ、既存住宅には適用されない。","消防用設備等の点検は、機器点検を6か月に1回、総合点検を1年に1回行う。","共同住宅では、収容人員が30人以上の場合に防火管理者を選任しなければならない。","共同住宅（非特定防火対象物）の関係者は、点検結果を1年に1回、消防長又は消防署長に報告しなければならない。"],"ans":2,"pt":"機器6か月・総合1年、共同住宅の報告は3年ごと、防火管理者は50人以上。","exp":[{"ok":false,"r":"既存住宅も含めすべての住宅に設置義務がある。"},{"ok":true,"r":"点検周期として正しい。"},{"ok":false,"r":"共同住宅（非特定防火対象物）は収容人員50人以上で防火管理者の選任が必要。"},{"ok":false,"r":"非特定防火対象物（共同住宅）は3年に1回。特定防火対象物は1年に1回。"}]},{"no":14,"f":"建物・設備","stem":"建築基準法に基づく定期調査・検査に関する次の記述のうち、最も不適切なものはどれか。","c":["外壁タイル等の全面打診等による調査は、竣工後、外壁改修後又は全面打診等の調査後10年を超えて最初に実施する定期調査の際に行う。","特定建築物の定期調査の報告義務を負うのは、原則として所有者（所有者と管理者が異なる場合は管理者）である。","防火設備の定期検査は、3年に1回行えば足りる。","昇降機（エレベーター）の定期検査は、原則として1年に1回行わなければならない。"],"ans":3,"pt":"昇降機・建築設備・防火設備＝毎年、特定建築物＝6か月〜3年、外壁打診＝10年。","exp":[{"ok":true,"r":"外壁の全面打診調査は10年が目安。"},{"ok":true,"r":"報告義務者は所有者（管理者）。"},{"ok":false,"r":"防火設備・建築設備の定期検査は6か月〜1年ごと（おおむね1年ごと）。3年ごと（6か月〜3年）は特定建築物の定期調査。"},{"ok":true,"r":"昇降機は年1回の定期検査・報告が必要。"}]},{"no":15,"f":"建物・設備","stem":"建物の構造・耐震に関する次の記述のうち、最も不適切なものはどれか。","c":["鉄筋コンクリート造では、コンクリートの中性化が進むほど、内部の鉄筋は錆びにくくなる。","昭和56年（1981年）6月1日以降に建築確認を受けた建物には、いわゆる新耐震基準が適用されている。","制震（制振）構造は、建物内部にダンパー等を設置し、地震の揺れを吸収する構造である。","免震構造は、建物と基礎の間に積層ゴム等の免震装置を設け、地震の揺れを建物に伝わりにくくする構造である。"],"ans":1,"pt":"新耐震＝1981年6月1日。中性化→鉄筋の錆→爆裂。","exp":[{"ok":false,"r":"コンクリートはアルカリ性で鉄筋を保護している。中性化が進むと鉄筋が錆びやすくなり、膨張して爆裂の原因となる。"},{"ok":true,"r":"新耐震基準の基準日。"},{"ok":true,"r":"制震構造の説明として正しい。"},{"ok":true,"r":"免震構造の説明として正しい。"}]},{"no":16,"f":"建物・設備","stem":"近年の法改正等に関する次の記述のうち、最も不適切なものはどれか。","c":["建築物の解体・改修工事前に行う石綿（アスベスト）の事前調査は、令和5年（2023年）10月以降、一定の資格者が行わなければならない。","令和7年（2025年）4月施行の改正建築基準法により、いわゆる4号特例が縮小され、木造2階建て住宅等も建築確認の際に構造等の審査対象となった。","令和7年（2025年）4月以降、原則としてすべての新築住宅・非住宅に省エネ基準への適合が義務付けられた。","石綿の事前調査の結果は、工事の規模にかかわらず行政への報告は一切不要である。"],"ans":4,"pt":"2025年4月：4号特例縮小・省エネ適合義務化。石綿：有資格者調査＋一定規模で報告義務。","exp":[{"ok":true,"r":"有資格者による事前調査が義務化された。"},{"ok":true,"r":"新2号建築物として審査省略制度の対象外となった。"},{"ok":true,"r":"建築物省エネ法の改正による。"},{"ok":false,"r":"一定規模以上（解体：床面積80㎡以上、改修：請負金額100万円以上等）の工事では、結果の報告が義務付けられている。"}]},{"no":17,"f":"維持保全・原状回復","stem":"賃貸住宅の維持保全・計画修繕に関する次の記述のうち、最も適切なものはどれか。","c":["長期修繕計画は、一度作成すれば見直す必要はない。","建物の価値を高め耐用年数を延ばす大規模な改修費用であっても、すべて修繕費として支出年度に一括して必要経費に算入できる。","修繕履歴を記録・保存しておくことは、将来の修繕計画の策定や売却時の建物評価に役立つ。","予防保全とは、損傷や故障が発生した後に修繕を行うことをいう。"],"ans":3,"pt":"長期修繕計画は5年程度で見直し。予防保全＞事後保全。資本的支出は減価償却。","exp":[{"ok":false,"r":"建物の劣化状況や社会情勢に応じ、5年程度ごとに見直すことが望ましい。"},{"ok":false,"r":"価値を高め耐用年数を延ばす支出は「資本的支出」として減価償却の対象となる。"},{"ok":true,"r":"修繕履歴は建物の資産価値の維持・向上に役立つ。"},{"ok":false,"r":"それは事後保全。予防保全は、損傷が軽微なうちに計画的に修繕すること。"}]},{"no":18,"f":"金銭管理・会計","stem":"賃貸住宅管理業者の家賃等の分別管理に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸住宅管理業の登録を受けていない事業者（管理戸数200戸未満）にも、賃貸住宅管理業法上の分別管理義務が課される。","賃貸住宅管理業者は、家賃等を管理する口座を、自己の固有財産を管理する口座と分けて管理しなければならない。","管理口座に入金された家賃等のうち、管理受託契約に基づく管理報酬相当額を自己の口座に移すことは可能である。","家賃等を管理する口座は、管理受託契約ごとに分ける必要まではないが、帳簿等により委託者ごとに金銭の出入りを明確に区分しなければならない。"],"ans":1,"pt":"分別管理＝口座を分ける＋委託者ごとに帳簿で区分。","exp":[{"ok":false,"r":"分別管理義務は登録を受けた賃貸住宅管理業者に課される義務。"},{"ok":true,"r":"法16条。口座を分けることが必要。"},{"ok":true,"r":"契約に基づき報酬として受領することは可能。"},{"ok":true,"r":"口座は1つでもよいが、帳簿等で委託者ごとに区分する。"}]},{"no":19,"f":"金銭管理・会計","stem":"家賃の滞納と法的手続に関する次の記述のうち、最も適切なものはどれか。","c":["賃借人が長期間不在で家賃を滞納している場合、管理業者は鍵を交換し、残置物を処分することができる。","少額訴訟は、訴額が60万円以下の金銭の支払請求に限られ、建物明渡請求に利用することはできない。","内容証明郵便による督促には、時効の完成を確定的に阻止する（時効を更新する）効力がある。","支払督促に対して債務者が適法な異議を申し立てても、手続はそのまま進み、仮執行宣言が付される。"],"ans":2,"pt":"少額訴訟60万円以下（金銭のみ）、支払督促は異議で訴訟へ、自力救済禁止、催告は6か月猶予のみ。","exp":[{"ok":false,"r":"自力救済の禁止。法的手続によらない明渡しは不法行為となり得る。"},{"ok":true,"r":"少額訴訟は60万円以下の金銭請求のみ。原則1回の期日で審理を終える。"},{"ok":false,"r":"催告にすぎず、6か月間の時効の完成猶予の効力のみ。"},{"ok":false,"r":"適法な異議があれば通常の訴訟手続に移行する。"}]},{"no":20,"f":"金銭管理・会計","stem":"家賃の回収・家賃債務保証に関する次の記述のうち、最も不適切なものはどれか。","c":["管理業者が報酬を得る目的で、業として賃貸人に代わり賃借人と明渡しの交渉を行うことは、弁護士法72条に違反するおそれがある。","平成29年（2017年）に創設された国土交通省の家賃債務保証業者登録制度は、任意の登録制度である。","管理業者は、賃借人の承諾がなくても、賃借人の勤務先に滞納の事実を告げて督促することができる。","令和7年（2025年）10月施行の改正住宅セーフティネット法により、住宅確保要配慮者が利用しやすい一定の家賃債務保証業者を国土交通大臣が認定する制度が創設された。"],"ans":3,"pt":"明渡し交渉の代行は非弁のおそれ。2025年10月：認定家賃債務保証業者制度。","exp":[{"ok":true,"r":"非弁行為となるおそれがある。"},{"ok":true,"r":"告示による任意登録制度。"},{"ok":false,"r":"プライバシーの侵害となり、違法な取立てとして不法行為責任を問われるおそれがある。"},{"ok":true,"r":"認定家賃債務保証業者制度。"}]},{"no":21,"f":"金銭管理・会計","stem":"会計に関する次の記述のうち、最も適切なものはどれか。","c":["翌月分として前月に受領した家賃（前受家賃）は、受領した月の収益として計上する。","複式簿記は、1つの取引を借方と貸方の両面から記録する方法である。","賃借人から預かった敷金は、管理業者の収益として計上する。","企業会計原則では、収益・費用は現金の受払いの時点で計上する現金主義が原則とされている。"],"ans":2,"pt":"発生主義・複式簿記。前受家賃・敷金は負債。","exp":[{"ok":false,"r":"前受家賃は負債（前受金）として計上し、対象月に収益とする。"},{"ok":true,"r":"複式簿記の説明として正しい。"},{"ok":false,"r":"敷金は預り金（負債）であり、収益ではない。"},{"ok":false,"r":"企業会計原則は発生主義が原則。"}]},{"no":22,"f":"賃貸借契約","stem":"敷金に関する次の記述のうち、最も不適切なものはどれか。","c":["敷金返還債務は、賃貸借が終了し、かつ賃貸物の返還（明渡し）を受けたときに発生し、明渡しが先履行となる。","賃借人は、賃貸人に対し、敷金を未払賃料の弁済に充てるよう請求することはできない。","賃借人が賃貸人の承諾を得て賃借権を第三者に譲渡した場合、敷金に関する権利義務は新賃借人に承継される。","賃貸建物が譲渡され賃貸人たる地位が譲受人に移転した場合、敷金返還債務は譲受人に承継される。"],"ans":3,"pt":"賃貸人交代→敷金承継する／賃借人交代→承継しない。明渡しが先。","exp":[{"ok":true,"r":"民法622条の2。明渡しと敷金返還は同時履行の関係にない。"},{"ok":true,"r":"充当は賃貸人の権利。賃借人からは請求できない。"},{"ok":false,"r":"賃借権の適法な譲渡の場合、敷金は承継されず、旧賃借人に返還される（民法622条の2第1項2号）。"},{"ok":true,"r":"民法605条の2第4項。"}]},{"no":23,"f":"賃貸借契約","stem":"賃貸物の修繕に関する次の記述のうち、最も適切なものはどれか。","c":["賃借物の一部が滅失等により使用収益できなくなった場合、賃借人が減額を請求して初めて賃料が減額される。","賃貸人が賃貸物の保存に必要な行為をしようとするとき、賃借人はこれを拒むことができる。","賃借人の責めに帰すべき事由によって修繕が必要となった場合でも、賃貸人は修繕義務を負う。","賃借人が修繕が必要である旨を通知し、又は賃貸人がその旨を知ったのに、賃貸人が相当の期間内に必要な修繕をしないときは、賃借人は自ら修繕することができる。"],"ans":4,"pt":"賃借人の修繕権（607条の2）、一部滅失は「当然減額」。","exp":[{"ok":false,"r":"民法611条。賃借人に帰責事由がなければ、その割合に応じて当然に減額される。"},{"ok":false,"r":"民法606条2項。賃借人は拒むことができない。"},{"ok":false,"r":"民法606条1項ただし書。賃借人の帰責事由による場合、賃貸人は修繕義務を負わない。"},{"ok":true,"r":"民法607条の2。急迫の事情があるときも同様。"}]},{"no":24,"f":"賃貸借契約","stem":"普通建物賃貸借の期間・更新に関する次の記述のうち、最も不適切なものはどれか。","c":["期間を1年未満とする建物賃貸借は、期間の定めがないものとみなされる。","期間の定めがない場合、賃貸人が正当事由をもって解約申入れをすると、申入れの日から6か月経過で賃貸借は終了する。","賃貸人が更新拒絶をするには、期間満了の1年前から6か月前までの間に通知し、かつ正当事由が必要である。","期間満了後も賃借人が使用を継続し、賃貸人が遅滞なく異議を述べなかったときは、従前と同一の条件・同一の期間で更新したものとみなされる。"],"ans":4,"pt":"法定更新後は「期間の定めなし」。賃貸人解約6か月・賃借人解約3か月。","exp":[{"ok":true,"r":"借地借家法29条1項。"},{"ok":true,"r":"借地借家法27条。賃借人からの解約申入れは3か月（民法617条）。"},{"ok":true,"r":"借地借家法26条・28条。"},{"ok":false,"r":"従前と同一の条件で更新されるが、期間は「定めがないもの」となる（借地借家法26条）。"}]},{"no":25,"f":"賃貸借契約","stem":"定期建物賃貸借に関する次の記述のうち、最も適切なものはどれか。","c":["契約の更新がなく期間満了により終了する旨の事前説明は、契約書とは別個独立の書面を交付して行う必要がある。","定期建物賃貸借契約は、公正証書によって締結しなければならない。","床面積200㎡未満の居住用建物では、転勤等のやむを得ない事情があれば、賃貸人も中途解約をすることができる。","期間が1年以上の場合に、賃貸人が期間満了の1年前から6か月前までに終了の通知をしなかったときは、契約は当然に更新される。"],"ans":1,"pt":"定期借家：書面＋別書面での事前説明、通知は1年前〜6か月前、中途解約は200㎡未満の賃借人のみ。","exp":[{"ok":true,"r":"判例（最判平24.9.13）。賃借人の承諾があれば電磁的方法による提供も可能。"},{"ok":false,"r":"公正証書等の「書面」（又は電磁的記録）でよく、公正証書に限られない。"},{"ok":false,"r":"中途解約権は「賃借人」のみ。解約申入れから1か月経過で終了。"},{"ok":false,"r":"更新はされず、通知期間経過後に通知した場合は、その日から6か月経過後に終了を対抗できる。"}]},{"no":26,"f":"賃貸借契約","stem":"賃料増減額請求（借地借家法32条）に関する次の記述のうち、最も不適切なものはどれか。","c":["普通建物賃貸借において、一定期間賃料を減額しない旨の特約は無効である。","一定期間賃料を増額しない旨の特約は有効である。","増額請求を受けた賃借人は、裁判が確定するまでの間、賃貸人が請求する額を支払わなければならない。","減額請求を受けた賃貸人は、裁判確定までは相当と認める額の支払を請求でき、確定額を超えて受領した分は年1割の利息を付して返還しなければならない。"],"ans":3,"pt":"不増額特約＝有効、不減額特約＝無効（定期借家で賃料改定特約があれば32条排除可）。","exp":[{"ok":true,"r":"不減額特約は賃借人に不利で無効。"},{"ok":true,"r":"不増額特約は有効。"},{"ok":false,"r":"賃借人は自ら相当と認める額を支払えば足りる。不足額は年1割の利息を付して支払う。"},{"ok":true,"r":"借地借家法32条3項。"}]},{"no":27,"f":"賃貸借契約","stem":"転貸借に関する次の記述のうち、最も不適切なものはどれか。","c":["原賃貸借が賃借人の債務不履行により解除される場合、賃貸人は転借人に催告して賃料を支払う機会を与えなければ、解除を転借人に対抗することができない。","適法な転貸借の場合、転借人は賃貸人に対し、原賃貸借に基づく賃借人の債務の範囲を限度として、直接義務を負う。","無断転貸であっても、賃貸人に対する背信的行為と認めるに足りない特段の事情があるときは、賃貸人は契約を解除することができない。","原賃貸借が合意解除された場合、賃貸人は、原則として合意解除をもって転借人に対抗することができない。"],"ans":1,"pt":"合意解除→転借人に対抗不可／債務不履行解除→対抗可（転借人への催告不要）。","exp":[{"ok":false,"r":"判例上、転借人への催告は不要。債務不履行解除は転借人に対抗できる。"},{"ok":true,"r":"民法613条1項。"},{"ok":true,"r":"信頼関係破壊の法理。"},{"ok":true,"r":"民法613条3項。"}]},{"no":28,"f":"賃貸借契約","stem":"賃借人の債務の保証に関する次の記述のうち、最も適切なものはどれか。","c":["個人が賃借人の債務を保証する根保証契約は、極度額を定めなければ効力を生じない。","賃借人が破産手続開始の決定を受けたときは、個人根保証契約の元本は確定する。","賃貸人は、委託を受けた保証人から請求があっても、賃借人の賃料の支払状況について情報提供する義務を負わない。","保証人が法人である場合にも、極度額を定めなければ保証契約は無効となる。"],"ans":1,"pt":"個人根保証は極度額必須。元本確定：保証人の破産、賃借人・保証人の死亡（賃借人の破産は×）。","exp":[{"ok":true,"r":"民法465条の2。書面（電磁的記録）で極度額を定める必要がある。"},{"ok":false,"r":"賃貸借の根保証では、主債務者（賃借人）の破産は元本確定事由ではない。確定事由は保証人の破産、主債務者又は保証人の死亡等。"},{"ok":false,"r":"民法458条の2。委託を受けた保証人（個人・法人問わず）の請求があれば情報提供義務あり。"},{"ok":false,"r":"極度額の規制は個人根保証のみ。"}]},{"no":29,"f":"賃貸借契約","stem":"賃貸人たる地位の移転・賃借権の対抗力に関する次の記述のうち、最も不適切なものはどれか。","c":["建物の引渡しを受けた賃借人は、その後に建物を取得した者に対して賃借権を対抗することができる。","対抗要件を備えた賃借人がいる建物が譲渡されたときは、賃貸人たる地位は、賃借人の承諾を要しないで譲受人に移転する。","建物の譲受人は、所有権移転登記をしていなくても、賃借人に対し賃料を請求することができる。","譲渡人と譲受人が、賃貸人たる地位を譲渡人に留保し、かつ譲受人が譲渡人に建物を賃貸する旨を合意したときは、賃貸人たる地位は譲受人に移転しない。"],"ans":3,"pt":"建物賃借権の対抗要件＝引渡し。新オーナーの賃料請求には所有権移転登記が必要。","exp":[{"ok":true,"r":"借地借家法31条。"},{"ok":true,"r":"民法605条の2第1項。"},{"ok":false,"r":"民法605条の2第3項。所有権移転登記をしなければ賃貸人たる地位を賃借人に対抗できない。"},{"ok":true,"r":"民法605条の2第2項。"}]},{"no":30,"f":"賃貸借契約","stem":"賃借人の死亡に関する次の記述のうち、最も適切なものはどれか。","c":["賃借人に共同相続人がいる場合、賃料債務は各相続人の相続分に応じた分割債務となる。","「残置物の処理等に関するモデル契約条項」では、受任者として賃貸人がなることが望ましいとされている。","賃借人が死亡した場合、賃借権は相続されず、賃貸借契約は当然に終了する。","居住用建物の賃借人が相続人なしに死亡した場合、事実上の夫婦又は養親子と同様の関係にあった同居者は、賃借人の権利義務を承継する。"],"ans":4,"pt":"賃借権は相続される。内縁の同居者承継（借地借家法36条）。残置物の受任者に賃貸人は不適切。","exp":[{"ok":false,"r":"賃料債務は不可分債務とされ、各相続人が全額の支払義務を負う。"},{"ok":false,"r":"賃貸人は利益相反のおそれがあるため避けるべきとされる。推定相続人や居住支援法人・管理業者等が想定される。"},{"ok":false,"r":"賃借権は相続の対象となる。"},{"ok":true,"r":"借地借家法36条。死亡を知った後1か月以内に反対の意思表示をすれば承継しない。"}]},{"no":31,"f":"賃貸借契約","stem":"「宅地建物取引業者による人の死の告知に関するガイドライン」（賃貸借取引）に関する次の記述のうち、最も不適切なものはどれか。","c":["隣接住戸や日常生活で通常使用しない共用部分で発生した他殺・自死の事案も、概ね3年間は必ず告げなければならない。","他殺・自死等の事案は、事案の発生（発覚）から概ね3年が経過した後は、原則として告げなくてもよい。","自然死や日常生活の中での不慮の死（転倒事故、誤嚥等）は、原則として告げなくてもよい。","自然死であっても、長期間放置され特殊清掃等が行われた場合は、概ね3年間は告げる必要がある。"],"ans":1,"pt":"自然死・不慮の死＝原則告知不要、その他＝賃貸は概ね3年、隣接住戸＝原則不要。","exp":[{"ok":false,"r":"隣接住戸や通常使用しない集合住宅の共用部分での事案は、原則として告げなくてもよい。"},{"ok":true,"r":"賃貸借取引では概ね3年。ただし事件性・周知性・社会に与えた影響が特に高い事案は除く。"},{"ok":true,"r":"ガイドラインの考え方として正しい。"},{"ok":true,"r":"特殊清掃等が行われた場合は告知対象。"}]},{"no":32,"f":"賃貸住宅管理業法","stem":"賃貸住宅管理業の登録に関する次の記述のうち、最も不適切なものはどれか。","c":["管理戸数が200戸未満の事業者は、賃貸住宅管理業の登録を受けることができない。","管理戸数が200戸以上の賃貸住宅管理業を営もうとする者は、国土交通大臣の登録を受けなければならない。","登録の更新を受けようとする者は、有効期間満了の日の90日前から30日前までの間に申請しなければならない。","登録の有効期間は5年である。"],"ans":1,"pt":"200戸以上は義務・未満は任意。有効期間5年、更新は90日前〜30日前。","exp":[{"ok":false,"r":"200戸未満でも任意に登録を受けることができる（登録すれば法の義務が課される）。"},{"ok":true,"r":"法3条1項、施行規則3条。"},{"ok":true,"r":"更新申請期間。"},{"ok":true,"r":"法3条2項。"}]},{"no":33,"f":"賃貸住宅管理業法","stem":"賃貸住宅管理業の登録拒否事由に関する次の記述のうち、最も適切なものはどれか。","c":["負債の合計額が資産の合計額を超えていても、支払不能に陥っていなければ、財産的基礎を有するものとして登録を受けることができる。","破産手続開始の決定を受けた者は、復権を得た後も5年を経過しなければ登録を受けることができない。","賃貸住宅管理業の登録を取り消され、その取消しの日から5年を経過しない者は、登録を受けることができない。","道路交通法違反により罰金刑に処せられた者は、その執行を終えてから5年を経過しなければ登録を受けることができない。"],"ans":3,"pt":"破産者は復権で即OK。罰金は管理業法違反のみ欠格。拘禁刑以上は罪種問わず5年。","exp":[{"ok":false,"r":"財産的基礎は「負債の合計額が資産の合計額を超えない」かつ「支払不能に陥っていない」こと。"},{"ok":false,"r":"復権を得れば直ちに登録を受けることができる。"},{"ok":true,"r":"登録拒否事由。"},{"ok":false,"r":"罰金刑で欠格となるのは賃貸住宅管理業法違反の場合のみ。拘禁刑以上は罪種を問わない。"}]},{"no":34,"f":"賃貸住宅管理業法","stem":"登録事項の変更・廃業等の届出に関する次の記述のうち、最も不適切なものはどれか。","c":["商号、役員の氏名、営業所又は事務所の名称・所在地に変更があった場合は、その日から30日以内に届け出なければならない。","個人の賃貸住宅管理業者が死亡した場合、相続人は死亡の事実を知った日から30日以内に届け出なければならない。","法人が合併により消滅した場合、その法人を代表する役員であった者は、30日以内に届け出なければならない。","賃貸住宅管理業者が廃業の届出をした場合でも、登録は有効期間が満了するまで効力を有する。"],"ans":4,"pt":"変更届・廃業届はいずれも30日以内。死亡は「知った日から」。","exp":[{"ok":true,"r":"変更届出は30日以内。"},{"ok":true,"r":"廃業等の届出。"},{"ok":true,"r":"廃業等の届出。"},{"ok":false,"r":"廃業等の届出があったときは、登録はその効力を失う。"}]},{"no":35,"f":"賃貸住宅管理業法","stem":"賃貸住宅管理業者の業務上の義務に関する次の記述のうち、最も不適切なものはどれか。","c":["営業所又は事務所ごとに、公衆の見やすい場所に、国土交通省令で定める様式の標識を掲げなければならない。","従業者に従業者証明書を携帯させなければ、その者をその業務に従事させてはならない。","帳簿は営業所又は事務所ごとに備え付け、各事業年度の末日をもって閉鎖し、閉鎖後5年間保存しなければならない。","アルバイトとして一時的に管理業務に従事する者には、従業者証明書を携帯させる必要はない。"],"ans":4,"pt":"帳簿＝営業所ごと・閉鎖後5年保存。証明書はアルバイトも必要。","exp":[{"ok":true,"r":"法19条。"},{"ok":true,"r":"法17条。"},{"ok":true,"r":"法18条・施行規則。"},{"ok":false,"r":"一時的に業務に従事する者にも携帯させる必要がある。内部管理事務のみに従事する者は不要。"}]},{"no":36,"f":"賃貸住宅管理業法","stem":"委託者への定期報告（賃貸住宅管理業法第20条）に関する次の記述のうち、最も適切なものはどれか。","c":["定期報告は、管理受託契約を締結した日から1年を超えない期間ごと、及び契約期間の満了後遅滞なく行わなければならない。","定期報告は、口頭で行えば足り、書面を交付する必要はない。","委託者の承諾があっても、管理業務報告書を電磁的方法で提供することはできない。","定期報告の対象となる事項は、家賃等の収納状況に限られる。"],"ans":1,"pt":"定期報告：1年を超えない期間ごと＋満了後遅滞なく、書面交付＋説明。","exp":[{"ok":true,"r":"報告時期として正しい。"},{"ok":false,"r":"管理業務報告書を作成・交付して説明しなければならない。"},{"ok":false,"r":"委託者の承諾があれば電磁的方法で提供できる。"},{"ok":false,"r":"報告対象期間、管理業務の実施状況、入居者からの苦情の発生状況・対応状況等。"}]},{"no":37,"f":"賃貸住宅管理業法","stem":"賃貸住宅管理業者に対する監督・罰則に関する次の記述のうち、最も不適切なものはどれか。","c":["国土交通大臣は、業務の適正な運営を確保するため必要があると認めるときは、業務改善命令をすることができる。","国土交通大臣は、1年以内の期間を定めて、業務の全部又は一部の停止を命ずることができる。","秘密保持義務は、賃貸住宅管理業者の従業者に課されるが、従業者でなくなった後は課されない。","登録を受けずに賃貸住宅管理業を営んだ者は、1年以下の拘禁刑若しくは100万円以下の罰金に処され、又はこれを併科される。"],"ans":3,"pt":"業務停止は1年以内。秘密保持は退職後も。2025年6月〜「拘禁刑」。","exp":[{"ok":true,"r":"法22条。"},{"ok":true,"r":"法23条。"},{"ok":false,"r":"法21条。従業者でなくなった後も秘密保持義務を負う。"},{"ok":true,"r":"令和7年（2025年）6月から「懲役」は「拘禁刑」に変更。"}]},{"no":38,"f":"賃貸住宅管理業法","stem":"業務管理者の要件・名義貸しに関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅管理業者は、書面で合意すれば、自己の名義をもって他人に賃貸住宅管理業を営ませることができる。","宅地建物取引士は、指定講習を修了し、管理業務に関し2年以上の実務経験等を有していれば、業務管理者の要件を満たし得る。","業務管理者は、管理受託契約重要事項説明を自ら行わなければ、その職務を果たしたことにならない。","賃貸不動産経営管理士試験に合格すれば、登録や実務経験等の要件を満たさなくても、直ちに業務管理者となることができる。"],"ans":2,"pt":"業務管理者＝経営管理士（登録）or 宅建士＋指定講習、いずれも実務2年（講習で代替可）。","exp":[{"ok":false,"r":"名義貸しは禁止（法11条）。"},{"ok":true,"r":"宅建士＋指定講習ルート。"},{"ok":false,"r":"業務管理者の職務は、重説等を「管理・監督」すること。自ら説明する必要はない。"},{"ok":false,"r":"賃貸不動産経営管理士として登録を受けていること（実務経験2年以上又は講習修了が前提）が必要。"}]},{"no":39,"f":"サブリース（特定賃貸借）","stem":"特定賃貸借契約に関する誇大広告等の禁止（賃貸住宅管理業法第28条）に関する次の記述のうち、最も不適切なものはどれか。","c":["誇大広告等の禁止は、紙媒体の広告にのみ適用され、インターネット広告には適用されない。","「家賃保証」「空室保証」等の文言を用いる場合、隣接する箇所に、借地借家法32条に基づき家賃が減額されることがある旨を表示しなければ、誇大広告に該当し得る。","誇大広告等の禁止は、特定転貸事業者だけでなく、勧誘者にも適用される。","著しく事実に相違する表示や、実際のものよりも著しく優良・有利であると人を誤認させる表示は、実際に誤認した者がいなくても禁止される。"],"ans":1,"pt":"誇大広告禁止は勧誘者にも、媒体を問わず適用。「家賃保証」には減額リスクを隣接表示。","exp":[{"ok":false,"r":"インターネット広告、パンフレット、説明資料など媒体を問わず適用される。"},{"ok":true,"r":"ガイドラインの考え方。"},{"ok":true,"r":"勧誘者も規制対象。"},{"ok":true,"r":"実際の誤認や損害の発生は要件ではない。"}]},{"no":40,"f":"サブリース（特定賃貸借）","stem":"勧誘者及び不当な勧誘等の禁止に関する次の記述のうち、最も適切なものはどれか。","c":["勧誘者は、特定転貸事業者と資本関係のある者に限られる。","勧誘者が不当な勧誘を行っても、特定転貸事業者が監督処分の対象となることはない。","相手方が契約を締結しない旨の意思を示した後に、再度勧誘を続けることは禁止されていない。","建設会社がアパートの建築を勧める際に、特定のサブリース業者とのマスターリース契約を勧めた場合、その建設会社は勧誘者に該当し得る。"],"ans":4,"pt":"勧誘者の範囲は広い（建設会社・金融機関も）。勧誘者の違反で特定転貸事業者も処分対象。","exp":[{"ok":false,"r":"資本関係や委託契約の有無を問わず、特定の特定転貸事業者のために勧誘を行う者は勧誘者に該当し得る。"},{"ok":false,"r":"勧誘者の違反行為について、特定転貸事業者も指示・業務停止等の対象となる。"},{"ok":false,"r":"契約を締結しない旨の意思表示をした者への再勧誘は禁止されている。"},{"ok":true,"r":"建設会社・不動産業者・金融機関等も勧誘者に該当し得る。"}]},{"no":41,"f":"サブリース（特定賃貸借）","stem":"特定賃貸借契約重要事項説明（賃貸住宅管理業法第30条）に関する次の記述のうち、最も不適切なものはどれか。","c":["説明を行う者は業務管理者に限られないが、業務管理者や一定の実務経験者等が行うことが望ましい。","特定転貸事業者が賃貸人に支払う家賃の額は重要事項であるが、借地借家法32条により家賃が減額され得る旨は説明する必要がない。","特定転貸事業者は、特定賃貸借契約の締結前に、書面を交付して重要事項を説明しなければならない。","相手方が賃貸住宅管理業者や宅地建物取引業者等である場合は、重要事項説明は不要である。"],"ans":2,"pt":"サブリース重説は「家賃減額リスク」「契約期間中の解約・更新拒絶に正当事由が必要なこと」が最重要。","exp":[{"ok":true,"r":"説明者の資格は法定されていない。"},{"ok":false,"r":"借地借家法32条の減額請求のリスクは、必ず説明すべき重要事項とされている。"},{"ok":true,"r":"法30条。"},{"ok":true,"r":"プロ相手は不要。"}]},{"no":42,"f":"サブリース（特定賃貸借）","stem":"特定賃貸借契約（マスターリース契約）と借地借家法に関する次の記述のうち、最も適切なものはどれか。","c":["特定賃貸借契約にも借地借家法32条1項が適用され、特定転貸事業者は家賃の減額請求をすることができる。","特定賃貸借契約は、建物の賃貸借に該当しないため、借地借家法の適用を受けない。","賃貸人（オーナー）が特定賃貸借契約の更新を拒絶する場合、正当事由は不要である。","家賃保証特約や家賃自動増額特約がある場合、特定転貸事業者は家賃の減額請求をすることができない。"],"ans":1,"pt":"サブリースにも借地借家法が全面適用：減額請求OK、オーナーの更新拒絶に正当事由必要。","exp":[{"ok":true,"r":"判例（最判平15.10.21）。"},{"ok":false,"r":"建物賃貸借に該当し、借地借家法が適用される。"},{"ok":false,"r":"特定転貸事業者は借主として借地借家法の保護を受けるため、オーナーの更新拒絶には正当事由が必要。"},{"ok":false,"r":"保証・自動増額特約があっても32条の減額請求は排除されない。"}]},{"no":43,"f":"サブリース（特定賃貸借）","stem":"特定転貸事業者に対する規制・監督に関する次の記述のうち、最も不適切なものはどれか。","c":["特定転貸事業者には登録制度がないため、国土交通大臣が業務停止命令を出すことはない。","何人も、特定賃貸借契約の適正化を図るため必要があると認めるときは、国土交通大臣に対し、その旨を申し出て適当な措置をとるべきことを求めることができる。","特定転貸事業者は、業務及び財産の状況を記載した書類を営業所又は事務所に備え置き、特定賃貸借契約の相手方等の求めに応じ閲覧させなければならない。","特定転貸事業者であっても、管理戸数200戸以上の賃貸住宅管理業を営む場合は、賃貸住宅管理業の登録が必要である。"],"ans":1,"pt":"サブリース規制は登録・戸数に関係なく全業者に適用。指示・業務停止あり。","exp":[{"ok":false,"r":"登録制度はないが、指示や1年以内の業務停止命令の対象となる。"},{"ok":true,"r":"法35条。申出は誰でもできる。"},{"ok":true,"r":"法32条。"},{"ok":true,"r":"サブリース業者が管理業務を行う場合は管理業者としての登録も必要。"}]},{"no":44,"f":"サブリース（特定賃貸借）","stem":"特定賃貸借標準契約書に関する次の記述のうち、最も不適切なものはどれか。","c":["特定賃貸借契約が終了した場合でも、貸主は転貸借契約における転貸人の地位を承継しない。","借主は、転借人との転貸借契約において、転借人が反社会的勢力ではないこと等を確約させなければならない。","家賃の改定について、協議により家賃を改定できる旨が定められており、借地借家法32条の減額請求は排除されていない。","貸主（オーナー）は、借主（特定転貸事業者）が本物件を転貸することを承諾する旨が定められている。"],"ans":1,"pt":"マスターリース終了時、オーナーは転貸人の地位を承継（入居者保護）。","exp":[{"ok":false,"r":"標準契約書では、契約が終了した場合、貸主は転貸人の地位を当然に承継するとされている。"},{"ok":true,"r":"反社会的勢力の排除に関する規定。"},{"ok":true,"r":"32条は強行法規であり排除できない。"},{"ok":true,"r":"転貸の承諾。"}]},{"no":45,"f":"サブリース（特定賃貸借）","stem":"特定転貸事業者又は勧誘者が行う行為のうち、賃貸住宅管理業法上の不当な勧誘等の禁止に該当するものはいくつあるか。","c":["１つ","２つ","３つ","４つ"],"items":["将来の家賃減額リスクがあるにもかかわらず、「家賃は30年間絶対に下がらない」と告げて勧誘すること","深夜や早朝に電話で勧誘し、相手方を困惑させること","契約締結後、相手方が契約を解除しようとするのを妨げるため、相手方を威迫すること","相手方の判断に影響を及ぼす重要な事項について、故意に事実を告げないこと"],"ans":4,"pt":"不当勧誘：故意の不告知・不実告知、威迫、迷惑時間、再勧誘、解除妨害。","itemExp":[{"ok":true,"r":"不実告知・断定的判断。禁止行為に該当。"},{"ok":true,"r":"迷惑を覚えさせるような時間の勧誘。禁止行為に該当。"},{"ok":true,"r":"解除を妨げるための威迫。禁止行為に該当。"},{"ok":true,"r":"故意の不告知。禁止行為に該当。"}],"note":"→ 該当するものは4つ。正解は肢4。"},{"no":46,"f":"実務・税金・保険","stem":"賃貸不動産に関する税金に関する次の記述のうち、最も不適切なものはどれか。","c":["固定資産税は、毎年1月1日現在の固定資産課税台帳上の所有者に課される。","住宅の貸付け（貸付期間1か月以上）による家賃は、消費税が非課税である。","建物の賃貸借契約書は、印紙税の課税文書に該当しない。","住宅用地のうち200㎡以下の部分（小規模住宅用地）の固定資産税の課税標準は、価格の3分の1とされる。"],"ans":4,"pt":"固定資産税：200㎡以下1/6・超1/3、都市計画税：1/3・2/3。建物賃貸借契約書は印紙税非課税。","exp":[{"ok":true,"r":"賦課期日は1月1日。"},{"ok":true,"r":"居住用であることが契約等で明らかな場合は非 理業務を行う賃貸住宅が200戸以上なら登録義務。200戸未満でも任意で登録でき、登録すれば法の義務がすべて課される","trap":"「200戸未満は登録できない」は×","q":"管理戸数200戸未満の事業者でも、任意に賃貸住宅管理業の登録を受けることができる。","a":true},{"f":"賃貸住宅管理業法","k":"登録","fact":"登録先は営業所の数や地域を問わずすべて「国土交通大臣」","trap":"「1つの都道府県のみなら知事登録」は×","q":"1つの都道府県内にのみ営業所を設ける場合は、都道府県知事の登録を受ける。","a":false},{"f":"賃貸住宅管理業法","k":"登録","fact":"有効期間5年。更新申請は満了の90日前〜30日前。期間内に申請すれば、処分が出るまで従前の登録は有効。更新後の有効期間は従前の満了日の翌日から5年","trap":"","q":"期間内に更新申請をしたが処分がされないまま有効期間が満了した場合、処分がされるまで従前の登録は効力を有する。","a":true},{"f":"賃貸住宅管理業法","k":"登録","fact":"無登録営業・不正手段による登録・名義貸し → 1年以下の拘禁刑若しくは100万円以下の罰金（併科あり）","trap":"","q":"名義貸しをした場合も、1年以下の拘禁刑若しくは100万円以下の罰金の対象となる。","a":true},{"f":"賃貸住宅管理業法","k":"登録","fact":"登録簿は一般の閲覧に供される","trap":"","q":"賃貸住宅管理業者登録簿は、一般の閲覧に供されない。","a":false},{"f":"賃貸住宅管理業法","k":"管理業務の定義","fact":"維持保全＝居室及びその使用と密接な関係にある部分の「点検・清掃等（維持）」と「修繕」を一貫して行うこと。修繕を自ら行わず業者に手配するだけでも該当","trap":"「点検のみ」「修繕工事のみ」は非該当","q":"修繕を自ら行わず、修繕業者に手配するだけの場合は、維持保全に該当しない。","a":false},{"f":"賃貸住宅管理業法","k":"管理業務の定義","fact":"金銭管理（家賃・敷金・共益費等の収納）は、維持保全と併せて行う場合のみ管理業務に該当","trap":"「家賃収納のみ」は非該当","q":"家賃の収納のみを行う業務は、管理業務に該当する。","a":false},{"f":"賃貸住宅管理業法","k":"管理業務の定義","fact":"非該当の例：清掃のみ、エレベーター保守点検のみ、警備のみ、入居者の苦情対応のみ、共用部分のみの維持保全","trap":"","q":"エレベーターの保守点検のみを行う業務は、管理業務に該当しない。","a":true},{"f":"賃貸住宅管理業法","k":"業務管理者","fact":"営業所・事務所ごとに1人以上選任。他の営業所の業務管理者との兼任は不可。同じ営業所の宅建士（専任含む）との兼務は可","trap":"","q":"業務管理者は、同じ営業所の専任の宅地建物取引士を兼務することができる。","a":true},{"f":"賃貸住宅管理業法","k":"業務管理者","fact":"業務管理者が欠けた営業所 → 新たに選任するまで「管理受託契約の締結」ができない","trap":"","q":"業務管理者が欠けた営業所でも、新たな管理受託契約を締結することができる。","a":false},{"f":"賃貸住宅管理業法","k":"業務管理者","fact":"要件：①賃貸不動産経営管理士として登録 又は ②宅建士＋指定講習修了。いずれも管理業務の実務経験2年以上（実務講習の修了で代替可）","trap":"試験合格だけでは業務管理者になれない","q":"賃貸不動産経営管理士試験に合格すれば、登録をしなくても業務管理者になれる。","a":false},{"f":"賃貸住宅管理業法","k":"業務管理者","fact":"職務＝次の事項の「管理・監督」：重説・書面交付、維持保全、金銭管理、帳簿、定期報告、秘密保持、入居者からの苦情処理 等","trap":"業務管理者が自ら重説をする義務はない","q":"業務管理者は、管理受託契約重要事項説明を自ら行う義務を負う。","a":false},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"時期：契約締結「前」。説明から締結まで1週間程度空けることが望ましい","trap":"","q":"管理受託契約重要事項説明は、契約締結後遅滞なく行えばよい。","a":false},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"説明者：資格の定めなし（業務管理者の管理・監督の下で行う。業務管理者・一定の実務経験者が行うのが望ましい）","trap":"「業務管理者でなければならない」は×","q":"重要事項説明は、業務管理者の管理・監督の下であれば、業務管理者以外の従業者が行ってもよい。","a":true},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"相手方：管理業者・特定転貸事業者・宅建業者・特定目的会社・信託の受託者・UR・地方住宅供給公社等のプロなら説明不要","trap":"","q":"委託者となろうとする者が地方住宅供給公社である場合、重要事項説明は不要である。","a":true},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"IT重説：相手方の承諾、書面の事前送付、映像・音声の双方向のやりとり、説明者が相手方の書面閲覧を確認できること","trap":"","q":"IT重説は、相手方の承諾がなくても行うことができる。","a":false},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"更新・変更：期間のみ延長する更新は不要。重要事項に変更がある場合は変更部分の説明が必要。法施行前の契約も施行後に変更すれば必要","trap":"","q":"契約期間のみを延長する更新の場合、改めて重要事項説明をする必要はない。","a":true},{"f":"賃貸住宅管理業法","k":"管理受託契約重要事項説明","fact":"説明事項：業者の商号・登録番号／対象住宅／業務の内容・実施方法／報酬／報酬に含まれない通常必要な費用／分別管理の方法／定期報告／再委託先／責任・免責／契約期間／入居者への周知方法／更新・解除","trap":"","q":"「報酬に含まれない費用で通常必要とされるもの」は、重要事項説明の対象ではない。","a":false},{"f":"賃貸住宅管理業法","k":"管理受託契約締結時書面","fact":"締結時に「遅滞なく」交付。法定事項を記載した契約書で代用できる","trap":"","q":"法定事項を記載した管理受託契約書を交付すれば、契約締結時書面に代えることができる。","a":true},{"f":"賃貸住宅管理業法","k":"管理受託契約締結時書面","fact":"重説書面と締結時書面を1つの書面にまとめることはできない","trap":"一体化は×、契約書との兼用は○","q":"重要事項説明書と契約締結時書面は、1つの書面にまとめて交付することができる。","a":false},{"f":"賃貸住宅管理業法","k":"管理受託契約締結時書面","fact":"電磁的方法での提供には相手方の承諾が必要（重説書面・定期報告も同じ）","trap":"","q":"契約締結時書面を電磁的方法で提供するには、相手方の承諾が必要である。","a":true},{"f":"賃貸住宅管理業法","k":"再委託・分別管理","fact":"管理業務の「全部」の再委託は禁止。複数の業者に分けて結果的に全部を任せるのも禁止。一部の再委託は可","trap":"","q":"管理業務を複数の業者に分けて再委託し、結果として全部を委託することは認められる。","a":false},{"f":"賃貸住宅管理業法","k":"再委託・分別管理","fact":"再委託しても、委託者に対する責任は管理業者が負う","trap":"","q":"管理業務の一部を再委託した場合、委託者に対する責任は再委託先が負う。","a":false},{"f":"賃貸住宅管理業法","k":"再委託・分別管理","fact":"分別管理の対象＝家賃・敷金・共益費その他の金銭。固有財産の口座とは別の口座で管理し、帳簿で委託者ごとに区分する","trap":"敷金も分別管理の対象","q":"分別管理の対象には、家賃だけでなく敷金も含まれる。","a":true},{"f":"賃貸住宅管理業法","k":"定期報告","fact":"時期：契約締結日から1年を超えない期間ごと＋契約期間満了後遅滞なく","trap":"「半年ごと」「年度末」は×","q":"定期報告は、管理受託契約を締結した日から6か月を超えない期間ごとに行わなければならない。","a":false},{"f":"賃貸住宅管理業法","k":"定期報告","fact":"方法：管理業務報告書を作成・交付して説明（委託者の承諾があれば電磁的方法も可）","trap":"口頭のみは×","q":"委託者の承諾があれば、管理業務報告書を電磁的方法で提供できる。","a":true},{"f":"賃貸住宅管理業法","k":"定期報告","fact":"報告事項：報告の対象期間、管理業務の実施状況、入居者からの苦情の発生状況・対応状況","trap":"","q":"定期報告では、入居者からの苦情の発生状況・対応状況も報告する。","a":true},{"f":"サブリース（特定賃貸借）","k":"規制の適用範囲","fact":"特定賃貸借契約＝第三者に転貸する事業を営むことを目的とした賃貸住宅の賃貸借（マスターリース）。賃貸人の親族・子会社等、密接な関係にある者が借りる場合は除く","trap":"","q":"賃貸人の親族が賃貸住宅を借り上げて転貸する場合も、特定賃貸借契約に該当する。","a":false},{"f":"サブリース（特定賃貸借）","k":"規制の適用範囲","fact":"サブリース規制（誇大広告・不当勧誘・重説・書面・閲覧）は、戸数や登録の有無に関係なく、すべての特定転貸事業者に適用","trap":"特定転貸事業者の登録制度はない","q":"サブリース規制は、管理戸数200戸以上の特定転貸事業者にのみ適用される。","a":false},{"f":"サブリース（特定賃貸借）","k":"規制の適用範囲","fact":"勧誘者＝特定の特定転貸事業者と関係を持ち、その事業者のために勧誘する者。建設会社・不動産業者・金融機関・FP等も該当し得る。明示の委託がなくても該当し得る","trap":"「資本関係がある者に限る」は×","q":"金融機関も勧誘者に該当することがある。","a":true},{"f":"サブリース（特定賃貸借）","k":"規制の適用範囲","fact":"勧誘者が違反した場合、特定転貸事業者も指示・業務停止の対象。勧誘者自身も指示・業務停止の対象","trap":"","q":"勧誘者が不当な勧誘を行った場合でも、特定転貸事業者が監督処分を受けることはない。","a":false},{"f":"サブリース（特定賃貸借）","k":"誇大広告の禁止","fact":"対象事項：家賃の額・支払時期・方法、家賃の変更、維持保全の実施方法・費用負担、契約の解除","trap":"","q":"誇大広告等の規制対象には、契約の解除に関する事項が含まれる。","a":true},{"f":"サブリース（特定賃貸借）","k":"誇大広告の禁止","fact":"「家賃保証」「30年一括借上げ」等 → 隣接箇所に「借地借家法32条により減額があり得る」「契約期間中でも解約され得る」旨を表示","trap":"","q":"「家賃保証」と表示する場合は、隣接箇所に借地借家法32条により家賃が減額され得る旨を表示する必要がある。","a":true},{"f":"サブリース（特定賃貸借）","k":"誇大広告の禁止","fact":"「メンテナンス費用は一切不要」等、オーナーに費用負担があるのにないかのような表示は違反","trap":"","q":"オーナーに修繕費の負担があるのに「メンテナンス費用は一切不要」と表示することは、誇大広告に該当し得る。","a":true},{"f":"サブリース（特定賃貸借）","k":"誇大広告の禁止","fact":"媒体を問わない（ネット・チラシ・パンフレット・説明資料）。実際に誤認した人がいなくても違反。罰則30万円以下の罰金","trap":"","q":"誇大広告等の禁止は、実際に誤認した者がいる場合に限り違反となる。","a":false},{"f":"サブリース（特定賃貸借）","k":"不当な勧誘等の禁止","fact":"故意に事実を告げない／不実のことを告げる（不告知・不実告知）→ 罰則あり（6か月以下の拘禁刑・50万円以下の罰金）","trap":"「故意」が要件。過失は対象外","q":"過失により重要な事項を告げなかった場合も、故意の不告知と同様に禁止される。","a":false},{"f":"サブリース（特定賃貸借）","k":"不当な勧誘等の禁止","fact":"威迫して困惑させる／迷惑を覚えさせる時間の電話・訪問／契約しない意思を示した者への再勧誘／契約解除を妨げる行為","trap":"","q":"契約を締結しない意思を示した相手方に、再度勧誘することは禁止されている。","a":true},{"f":"サブリース（特定賃貸借）","k":"不当な勧誘等の禁止","fact":"規制は契約締結時だけでなく、更新時や解除を妨げる場面にも及ぶ","trap":"","q":"不当な勧誘等の禁止は契約締結時の勧誘に限られ、更新時や解除の場面には及ばない。","a":false},{"f":"サブリース（特定賃貸借）","k":"特定賃貸借契約重要事項説明","fact":"時期：契約締結「前」（1週間程度空けるのが望ましい）。説明者の資格制限なし。プロ相手は不要","trap":"","q":"特定賃貸借契約重要事項説明は、業務管理者が行わなければならない。","a":false},{"f":"サブリース（特定賃貸借）","k":"特定賃貸借契約重要事項説明","fact":"必ず説明する事項：①家賃は借地借家法32条により減額され得ること（家賃保証期間中でも）②オーナーからの更新拒絶・解約には正当事由が必要なこと","trap":"最重要の出題ポイント","q":"家賃保証期間中であっても、借地借家法32条により家賃が減額され得ることを説明しなければならない。","a":true},{"f":"サブリース（特定賃貸借）","k":"特定賃貸借契約重要事項説明","fact":"その他の説明事項：対象住宅、家賃の額・設定根拠・支払時期、維持保全の内容と費用分担、契約期間、転借人の資格等の転貸条件、契約終了時の転貸人の地位の承継","trap":"","q":"契約終了時に転貸人の地位が承継されることは、特定賃貸借契約の重要事項説明の対象ではない。","a":false},{"f":"サブリース（特定賃貸借）","k":"特定賃貸借契約重要事項説明","fact":"締結時書面は、契約書で代用できる（重説書面との一体化は不可）","trap":"","q":"特定賃貸借契約の締結時書面は、契約書で代用することができる。","a":true},{"f":"サブリース（特定賃貸借）","k":"借地借家法の適用","fact":"マスターリースも建物賃貸借 → 借地借家法が全面的に適用（最判平15.10.21）","trap":"","q":"マスターリース契約にも借地借家法が適用される。","a":true},{"f":"サブリース（特定賃貸借）","k":"借地借家法の適用","fact":"家賃保証特約・自動増額特約があっても、サブリース業者は減額請求ができる（32条は強行法規）","trap":"","q":"家賃自動増額特約がある場合、サブリース業者は家賃の減額請求をすることができない。","a":false},{"f":"サブリース（特定賃貸借）","k":"借地借家法の適用","fact":"オーナーからの更新拒絶・解約申入れには正当事由が必要（サブリース業者は「借主」として保護される）","trap":"","q":"オーナーがマスターリース契約の更新を拒絶するには、正当事由が必要である。","a":true},{"f":"サブリース（特定賃貸借）","k":"借地借家法の適用","fact":"転貸を予定したマスターリースでは、期間満了による終了をオーナーが信義則上、転借人に対抗できない場合がある（最判平14.3.28）","trap":"","q":"転貸を予定したマスターリースでは、オーナーは期間満了による終了を常に転借人に対抗できる。","a":false},{"f":"サブリース（特定賃貸借）","k":"借地借家法の適用","fact":"期間満了・解約申入れで原賃貸借が終了する場合、オーナーは転借人に通知しなければ対抗できず、通知から6か月で転貸借が終了（借地借家法34条）","trap":"","q":"原賃貸借が期間満了で終了する場合、オーナーが転借人に通知すると、通知から6か月で転貸借が終了する。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"期間と更新","fact":"普通借家で1年未満の期間 → 期間の定めのないもの。期間の上限はない（民法の50年は建物賃貸借に適用されない）","trap":"定期借家は1年未満も有効","q":"普通建物賃貸借で期間を6か月と定めた場合、期間の定めのない賃貸借となる。なお、期間の上限は50年である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"期間と更新","fact":"更新拒絶の通知は満了の1年前〜6か月前。通知しないと従前と同じ条件で法定更新（期間は定めなし）","trap":"","q":"普通建物賃貸借の更新拒絶の通知は、期間満了の6か月前から3か月前までにしなければならない。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"期間と更新","fact":"通知をしても、期間満了後に賃借人が使用を続け、賃貸人が遅滞なく異議を述べないと法定更新","trap":"転借人の使用継続も賃借人の使用継続とみなされる","q":"更新拒絶の通知をしても、期間満了後の賃借人の使用継続に賃貸人が遅滞なく異議を述べなければ、法定更新される。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"期間と更新","fact":"正当事由の判断要素：双方の建物使用の必要性、賃貸借の従前の経過、建物の利用状況・現況、立退料の申出","trap":"立退料は正当事由の「補完」要素","q":"立退料を支払えば、それだけで正当事由があると認められる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"期間と更新","fact":"更新料特約は、高額すぎるなど特段の事情がない限り有効（最判平23.7.15）","trap":"","q":"更新料特約は、高額すぎるなど特段の事情がない限り有効である。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"解約申入れ","fact":"期間の定めなし：賃貸人から → 6か月後に終了（正当事由必要）／賃借人から → 3か月後に終了（正当事由不要）","trap":"数字の入れ替えに注意","q":"期間の定めのない建物賃貸借で賃借人が解約を申し入れた場合、6か月経過で終了する。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"解約申入れ","fact":"期間の定めあり：中途解約の特約がなければ、期間中の解約はできない","trap":"","q":"期間の定めのある建物賃貸借では、中途解約の特約がなければ期間中に解約できない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"解約申入れ","fact":"賃借人に不利な特約は無効（例：賃貸人の解約予告を3か月とする特約）。賃借人に有利な特約は有効（例：賃借人の解約予告を1か月とする特約）","trap":"","q":"賃借人からの解約予告期間を1か月とする特約は無効である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"契約は書面（電磁的記録も可）で。公正証書である必要はない","trap":"「公正証書に限る」は×","q":"定期建物賃貸借契約は、公正証書で締結しなければならない。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"事前説明は契約書とは「別個独立の書面」で（最判平24.9.13）。賃借人の承諾があれば電磁的方法も可","trap":"","q":"定期建物賃貸借の事前説明は、契約書とは別個独立の書面で行わなければならない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"事前説明をしなかった場合 → 「更新がない」旨の定めが無効になり、普通借家になる（契約自体は有効）","trap":"「契約全体が無効」は×","q":"事前説明をしなかった場合、定期建物賃貸借契約全体が無効となる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"期間1年以上 → 満了の1年前〜6か月前に終了を通知。通知が遅れた場合は、通知の日から6か月経過後に終了を対抗できる","trap":"期間1年未満なら通知は不要","q":"期間1年未満の定期建物賃貸借では、終了の通知は不要である。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"中途解約：床面積200㎡未満の居住用で、転勤・療養・親族の介護等のやむを得ない事情があるとき、賃借人のみ可。申入れから1か月で終了","trap":"賃貸人からの中途解約は×","q":"床面積200㎡未満の居住用の定期借家では、賃貸人も、やむを得ない事情があれば中途解約できる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"再契約は可能（新たな契約になる）。2000年3月1日より前の居住用普通借家は、合意しても定期借家に切り替えられない（当分の間）","trap":"","q":"2000年3月1日より前に締結された居住用の普通借家は、当事者が合意すれば定期借家に切り替えることができる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"定期建物賃貸借","fact":"賃料改定の特約がある定期借家には、借地借家法32条（増減額請求）が適用されない","trap":"","q":"賃料改定の特約がある定期建物賃貸借には、借地借家法32条の増減額請求の規定は適用されない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額請求","fact":"不増額特約＝有効、不減額特約＝無効（普通借家）","trap":"","q":"普通建物賃貸借で、一定期間賃料を減額しない旨の特約は有効である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額請求","fact":"増減額請求は形成権：意思表示が相手に届いた時点から将来に向かって効力が生じる。裁判の前に調停が必要（調停前置）","trap":"","q":"賃料増減額請求について裁判を起こす前には、原則として調停を申し立てる必要がある。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額請求","fact":"増額請求 → 賃借人は自分が相当と思う額を払えばよい。確定額に不足があれば年1割の利息を付けて支払う","trap":"","q":"増額請求を受けた賃借人は、賃貸人の請求額を支払わなければ債務不履行となる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額請求","fact":"減額請求 → 賃貸人は自分が相当と思う額を請求できる。確定額を超えて受け取った分は年1割の利息を付けて返す","trap":"","q":"減額請求を受けた賃貸人が確定額を超えて受け取った分は、年1割の利息を付けて返還しなければならない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","fact":"名目を問わず（保証金等も含む）賃料債務等を担保する目的の金銭は「敷金」（民法622条の2）","trap":"","q":"「保証金」という名目で預かった金銭でも、賃料債務等を担保する目的であれば敷金にあたる。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","fact":"返還時期：①賃貸借が終了し、明け渡した時 ②賃借権を適法に譲渡した時。明渡しが先（同時履行ではない）","trap":"","q":"敷金の返還と建物の明渡しは、同時履行の関係にある。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","fact":"賃貸人は契約期間中でも敷金を未払賃料に充当できる。賃借人から「敷金を充当して」とは言えない","trap":"","q":"賃借人は、契約期間中、敷金を未払賃料に充当するよう賃貸人に請求できる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","fact":"オーナーチェンジ → 新賃貸人に承継される／賃借権の譲渡 → 新賃借人には承継されない","trap":"","q":"賃借権が適法に譲渡された場合、敷金は新賃借人に承継される。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","fact":"敷引特約は、高額すぎなければ有効（最判平23.3.24）","trap":"","q":"敷引特約は、敷引額が高額すぎなければ有効である。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"賃貸人に修繕義務あり。ただし賃借人の責めに帰すべき事由で必要になった修繕は除く","trap":"","q":"賃借人の責めに帰すべき事由で修繕が必要になった場合でも、賃貸人は修繕義務を負う。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"賃借人の修繕権：通知したのに（又は賃貸人が知ったのに）相当期間内に修繕されない／急迫の事情 → 賃借人が自ら修繕できる","trap":"","q":"急迫の事情があるときは、賃借人は自ら修繕することができる。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"必要費 → 直ちに償還請求できる。有益費 → 契約終了時に、価値の増加が残っている場合に限り、支出額か増加額（賃貸人が選ぶ）を請求できる","trap":"","q":"有益費は、支出後直ちに賃貸人に償還を請求することができる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"賃貸人の保存行為は拒めない。ただし賃借人の意思に反する保存行為で賃借の目的を達せられないときは、賃借人は解除できる","trap":"","q":"賃借人の意思に反する保存行為で賃借の目的を達せられないときは、賃借人は契約を解除できる。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"一部滅失 → 賃料は当然に減額（請求不要）。残る部分で目的を達せられない → 解除可。全部滅失 → 賃貸借は当然に終了","trap":"","q":"賃借物の一部が滅失した場合、賃借人が減額請求をしなければ賃料は減額されない。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","fact":"小修繕を賃借人の負担とする特約は有効（賃貸人の修繕義務を免除する趣旨）","trap":"","q":"小修繕を賃借人の負担とする特約は有効である。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復（民法621条）","fact":"賃借人は受け取った後に生じた損傷を原状に戻す義務を負う。ただし通常損耗・経年変化と、賃借人に帰責事由のない損傷は除く","trap":"","q":"賃借人は、通常損耗・経年変化についても原状回復義務を負う。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復（民法621条）","fact":"通常損耗を賃借人の負担とする特約は、負担範囲が契約書に具体的に明記され、賃借人が明確に合意した場合のみ有効（最判平17.12.16）","trap":"","q":"通常損耗を賃借人の負担とする特約は、範囲が具体的に明記され、賃借人が明確に合意していれば有効である。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復（民法621条）","fact":"賃借人が取り付けた物は、終了時に取り外す義務と権利がある（収去義務・収去権）","trap":"","q":"賃借人が取り付けた物について、賃借人は終了時に取り外す義務を負わない。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","fact":"無断転貸・無断譲渡 → 原則解除できる。ただし背信的行為と認めるに足りない特段の事情があれば解除できない","trap":"","q":"無断転貸であっても、背信的行為と認めるに足りない特段の事情があれば、賃貸人は解除できない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","fact":"適法な転貸 → 賃貸人は転借人に直接賃料を請求できる（上限は賃借料と転借料のうち低い方）。転借人は賃料の前払いを理由に支払を拒めない","trap":"","q":"適法な転貸借で賃貸人が転借人に直接請求できる賃料の上限は、常に転借料の額である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","fact":"合意解除 → 転借人に対抗できない（ただし合意解除の時点で賃貸人に債務不履行解除権があれば対抗できる）","trap":"","q":"合意解除の時点で賃貸人が債務不履行による解除権を有していた場合は、合意解除を転借人に対抗できる。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","fact":"債務不履行解除 → 転借人に対抗できる。転借人への催告は不要。転貸借は、賃貸人が転借人に返還を請求した時に終了する","trap":"","q":"債務不履行解除を転借人に対抗するには、転借人に支払の機会を与える催告が必要である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"保証契約は書面（電磁的記録）でしなければ無効","trap":"","q":"保証契約は口頭でも有効に成立する。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"個人の根保証は極度額（上限額）を書面で定めなければ無効。法人の保証人は対象外","trap":"","q":"法人が賃借人の債務を根保証する場合も、極度額を定めなければ無効である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"元本確定事由：保証人の財産への強制執行、保証人の破産、賃借人又は保証人の死亡","trap":"賃借人の破産・強制執行は確定事由ではない","q":"賃借人が死亡した場合、個人根保証契約の元本は確定する。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"委託を受けた保証人（個人・法人とも）から請求があれば、賃貸人は賃借人の支払状況を情報提供しなければならない","trap":"","q":"賃貸人が保証人に賃借人の支払状況を情報提供する義務は、保証人が個人の場合に限られる。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"契約締結時の情報提供義務（賃借人→個人保証人に財産状況等を伝える）は、事業用賃貸借の場合のみ","trap":"居住用賃貸借には適用されない","q":"居住用建物の賃貸借では、賃借人は個人保証人に対して、契約締結時の財産状況等の情報提供義務を負わない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","fact":"保証人の責任は、特段の事情がない限り更新後の債務にも及ぶ","trap":"","q":"保証人の責任は、特段の事情がない限り、更新後の賃料債務には及ばない。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"建物賃借権の対抗要件＝引渡し（借地借家法31条）又は賃借権の登記","trap":"","q":"建物賃借権は、登記がなくても建物の引渡しがあれば第三者に対抗できる。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"対抗要件を備えた建物が譲渡されると、賃貸人の地位は賃借人の承諾なしに新所有者へ移転","trap":"","q":"賃貸建物の譲渡で賃貸人たる地位が移転するには、賃借人の承諾が必要である。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"新所有者は所有権移転登記をしないと、賃借人に賃料を請求できない","trap":"","q":"新所有者は、所有権移転登記をしなければ賃借人に賃料を請求できない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"敷金返還債務と費用償還債務は新賃貸人に承継される","trap":"","q":"賃貸人たる地位が移転した場合でも、費用償還債務は旧賃貸人に残る。","a":false},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"譲渡人と譲受人が「賃貸人の地位を譲渡人に残す＋譲受人が譲渡人に貸す」と合意すれば、地位は移転しない","trap":"","q":"譲渡人と譲受人が賃貸人の地位を譲渡人に残し、譲受人が譲渡人に賃貸する合意をすれば、地位は移転しない。","a":true},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力・オーナーチェンジ","fact":"抵当権設定登記後の賃借人は競売の買受人に対抗できないが、買受けから6か月間は明渡しが猶予される","trap":"","q":"抵当権設定登記後の賃借人は、競売の買受人の買受けから1年間、明渡しが猶予される。","a":false},{"f":"管理実務・原状回復","k":"原状回復ガイドライン","fact":"ガイドラインには法的拘束力がない（トラブル防止の目安）","trap":"","q":"原状回復ガイドラインには法的拘束力がある。","a":false},{"f":"管理実務・原状回復","k":"原状回復ガイドライン","fact":"賃借人の負担は経過年数で減らす。クロス・カーペット・クッションフロア・エアコン等は6年、流し台5年、便器・洗面台等は15年","trap":"6年経過で残存価値1円","q":"カーペットは耐用年数6年として経過年数を考慮する。","a":true},{"f":"管理実務・原状回復","k":"原状回復ガイドライン","fact":"経過年数を考慮しない：畳表・襖紙・障子紙（消耗品）、フローリングの部分補修","trap":"フローリングを全面張り替える場合は建物の耐用年数で考える","q":"襖紙・障子紙は、経過年数を考慮して負担割合を算定する。","a":false},{"f":"管理実務・原状回復","k":"原状回復ガイドライン","fact":"補修範囲は原則として傷のある最小単位。クロスは㎡単位が原則だが、色合わせのため1面単位まではやむを得ないとされる","trap":"部屋全体の張替えを賃借人に負担させるのは×","q":"クロスの毀損は、色合わせのため1面単位で張り替える費用までは賃借人負担とすることもやむを得ないとされる。","a":true},{"f":"管理実務・原状回復","k":"原状回復ガイドライン","fact":"入退去時のチェックリスト・写真で、入居時の状態を双方で確認しておく","trap":"","q":"入居時の状態を確認するチェックリストや写真を残すことが推奨されている。","a":true},{"f":"管理実務・原状回復","k":"通常損耗の例","fact":"【賃貸人負担】家具の設置跡、日照による畳・フローリングの変色、電気ヤケ、エアコン設置のビス穴、画鋲・ピンの穴","trap":"","q":"エアコン設置のためのビス穴は、賃借人負担である。","a":false},{"f":"管理実務・原状回復","k":"通常損耗の例","fact":"【賃貸人負担】入替時の鍵交換、通常の清掃をしていた場合のハウスクリーニング、地震による破損、耐用年数が過ぎた設備の故障、破損のない網戸・浴槽の交換","trap":"","q":"通常の清掃をしていた場合のハウスクリーニング費用は、賃貸人負担である。","a":true},{"f":"管理実務・原状回復","k":"通常損耗の例","fact":"【賃借人負担】タバコのヤニ・臭い、ペットによる傷・臭い、結露を放置して広がったカビ・シミ、台所の油汚れの放置、引越作業の傷","trap":"","q":"結露を放置して拡大したカビ・シミは、賃貸人負担である。","a":false},{"f":"管理実務・原状回復","k":"通常損耗の例","fact":"【賃借人負担】下地ボードの張替えが必要な釘穴・ネジ穴、落書き、鍵の紛失・破損、エアコンの水漏れを放置して生じた壁の腐食","trap":"","q":"鍵の紛失による交換費用は、賃借人負担である。","a":true},{"f":"管理実務・原状回復","k":"滞納対応","fact":"自力救済の禁止：鍵の交換、家財の搬出、ドアへの督促文の貼り紙等は不法行為になり得る","trap":"","q":"滞納が長期にわたる場合は、鍵を交換して賃借人を締め出すことが認められる。","a":false},{"f":"管理実務・原状回復","k":"滞納対応","fact":"1か月程度の滞納だけでは信頼関係の破壊にならず、解除できないのが原則（3か月程度が目安とされる）。解除は原則として催告してから行う","trap":"","q":"1か月程度の賃料滞納だけで、直ちに契約を解除できるのが原則である。","a":false},{"f":"管理実務・原状回復","k":"滞納対応","fact":"保証会社の「賃料を2か月以上滞納するなど一定の要件を満たせば明渡しがあったとみなす」条項は、消費者契約法により無効（最判令4.12.12）","trap":"","q":"一定の要件を満たせば明渡しがあったとみなす保証会社の条項は、消費者契約法により無効とされた。","a":true},{"f":"管理実務・原状回復","k":"滞納対応","fact":"少額訴訟：60万円以下の金銭請求のみ（明渡しは不可）。原則1回で審理。同じ簡易裁判所で年10回まで。控訴はできず、異議の申立てのみ","trap":"","q":"少額訴訟の判決に不服がある場合、地方裁判所に控訴することができる。","a":false},{"f":"管理実務・原状回復","k":"滞納対応","fact":"支払督促：簡易裁判所の書記官が発する。債務者は受け取ってから2週間以内に異議を申し立てられ、異議があれば訴訟に移る。異議がなければ仮執行宣言が付く","trap":"","q":"支払督促に対し、債務者は受け取ってから2週間以内に異議を申し立てることができる。","a":true},{"f":"管理実務・原状回復","k":"滞納対応","fact":"明渡しの強制執行には債務名義（判決等）が必要。内容証明による催告は6か月間の時効の完成猶予のみ。賃料債権の時効は5年","trap":"","q":"内容証明郵便で催告をすれば時効が更新され、新たに時効期間が進行する。","a":false},{"f":"建物・設備","k":"耐震・構造","fact":"新耐震基準＝1981年6月1日以降に「建築確認」を受けた建物（竣工日ではない）。木造は2000年基準（接合金物等）も押さえる","trap":"基準は竣工日ではなく建築確認日","q":"新耐震基準が適用されるかどうかは、建物の竣工日が1981年6月1日以降かどうかで判断する。","a":false},{"f":"建物・設備","k":"耐震・構造","fact":"耐震＝柱・梁・壁で揺れに耐える／制震＝ダンパーで揺れを吸収／免震＝積層ゴム等で揺れを伝えにくくする","trap":"","q":"免震構造は、ダンパーで揺れを吸収する構造である。","a":false},{"f":"建物・設備","k":"耐震・構造","fact":"RC造：圧縮に強いコンクリート＋引張に強い鉄筋。中性化 → 鉄筋の錆 → 膨張してコンクリートが剥がれる（爆裂）。白い析出物＝白華（エフロレッセンス）","trap":"","q":"コンクリートの中性化が進むと、鉄筋が錆びて爆裂の原因となる。","a":true},{"f":"建物・設備","k":"耐震・構造","fact":"ラーメン構造＝柱と梁で支える（間取りの自由度が高い）。壁式構造＝壁で支える（中低層向き）","trap":"","q":"壁式構造は、柱と梁で建物を支える構造である。","a":false},{"f":"建物・設備","k":"給水","fact":"直結直圧（低層向き）・直結増圧（ポンプで圧力を上げる、受水槽不要）・受水槽方式（高置水槽方式、ポンプ直送方式）","trap":"","q":"水道直結増圧方式では、受水槽が不要である。","a":true},{"f":"建物・設備","k":"給水","fact":"簡易専用水道＝受水槽の有効容量10㎥超。1年以内ごとに1回、登録検査機関の検査を受け、水槽を清掃する。10㎥以下は小規模貯水槽水道（条例等で管理）","trap":"","q":"受水槽の有効容量が10㎥以下の場合も、簡易専用水道として年1回の検査義務がある。","a":false},{"f":"建物・設備","k":"給水","fact":"受水槽は六面点検ができるように設置する（上部100cm以上、周囲・下部60cm以上）","trap":"","q":"受水槽の上部には100cm以上、周囲・下部には60cm以上の点検スペースが必要である。","a":true},{"f":"建物・設備","k":"給水","fact":"ウォーターハンマー＝水栓を急に閉めたときの衝撃音（対策は水撃防止器）。クロスコネクション（上水と他の配管の接続）は禁止","trap":"","q":"ウォーターハンマーとは、水栓を急に閉めたときに生じる衝撃音である。","a":true},{"f":"建物・設備","k":"給水","fact":"給水栓の水の遊離残留塩素は0.1mg/L以上を保つ","trap":"","q":"給水栓の水の遊離残留塩素は、0.01mg/L以上を保てばよい。","a":false},{"f":"建物・設備","k":"消防","fact":"消防用設備等の点検：機器点検6か月ごと、総合点検1年ごと","trap":"","q":"消防用設備等の総合点検は、6か月ごとに行う。","a":false},{"f":"建物・設備","k":"消防","fact":"点検結果の報告：共同住宅（非特定防火対象物）3年ごと、特定防火対象物1年ごと。報告先は消防長又は消防署長","trap":"店舗が入る複合用途の建物は特定防火対象物になり得る","q":"共同住宅の消防用設備等の点検結果は、3年ごとに報告する。","a":true},{"f":"建物・設備","k":"消防","fact":"防火管理者：共同住宅は収容人員50人以上で選任。消防計画の作成、消火・通報・避難訓練の実施","trap":"特定防火対象物は30人以上","q":"共同住宅では、収容人員30人以上で防火管理者の選任が必要である。","a":false},{"f":"建物・設備","k":"消防","fact":"住宅用火災警報器：新築・既存を問わず設置義務。寝室と、寝室のある階の階段等に設置","trap":"","q":"住宅用火災警報器の設置義務は、既存住宅にも適用される。","a":true},{"f":"実務・税金・保険","k":"固定資産税・都市計画税","fact":"1月1日時点の所有者に、市町村（東京23区は都）が課税。評価替えは3年ごと","trap":"年の途中で売っても1月1日の所有者が納税義務者","q":"年の途中で不動産を売却した場合、その年の固定資産税の納税義務者は買主となる。","a":false},{"f":"実務・税金・保険","k":"固定資産税・都市計画税","fact":"標準税率：固定資産税1.4%、都市計画税は上限0.3%（市街化区域内）","trap":"","q":"固定資産税の標準税率は1.4%である。","a":true},{"f":"実務・税金 function startMock(list, pos = 0) { if (!list.length) return toast('対象の問題がありません'); if (S.exam) { tab = 'mock'; render(); return toast('本番モード実施中です'); } ui.mq = list; ui.mi = pos; ui.mRev = !!S.mock[list[pos]]; ui.result = null; tab = 'mock'; render(); scrollTo(0, 0); }
function qBody(q, chosen, reveal) {

  if (q.items) h += `<div class="items">${q.items.map((t, i) => `<div><b>${KANA[i]}</b>　${esc(t)}${reveal ? `<span class="why ${q.itemExp[i].ok ? '' : ''}" style="display:block;font-size:13px;color:var(--sub)">${q.itemExp[i].ok ? '○ 該当' : '× 非該当'}：${esc(q.itemExp[i].r)}</span>` : ''}</div>`).join('')}</div>`;
  h += q.c.map((t, i) => {

    return `<button class="ch ${cls}" data-a="mAns" data-v="${n}" ${reveal ? 'disabled' : ''}><span class="n">${n}</span><span class="grow">${esc(t)}${why}</span></button>`;

/* ===== 操作 ===== */
const H = {

    const all = MOCK.map(q => q.no);

  exStart: () => { if (!confirm('本番モード（120分）を開始しますか？')) return; S.exam = { start: Date.now(), ans: {} }; ui.ei = 0; ui.mq = null; ui.result = null; save(); render(); scrollTo(0, 0); },
  eMove: v => { ui.ei = Math.max(0, Math.min(49, (ui.ei || 0) + +v)); render(); scrollTo(0, 0); },
  eJump: v => { ui.ei = +v; render(); scrollTo(0, 0); },
  exQuit: () => { if (confirm('本番モードを中止します。解答は保存されません。')) { S.exam = null; save(); render(); } },
  exGrade: () => { const n = Object.keys(S.exam.ans).length; if (!confirm(n < 50 ? `未解答が${50 - n}問あります。採点しますか？` : '採点しますか？')) return; grade(); render(); scrollTo(0, 0); },
  rReview: () => { const w = MOCK.filter(q => ui.result.ans[q.no] !== q.ans).map(q => q.no); ui.result = null; if (w.length) startMock(w); else { toast('全問正解です！'); render(); } },
  rClose: () => { ui.result = null; render(); },
  dField: v => { ui.dF = ui.dF.includes(v) ? ui.dF.filter(x => x !== v) : [...ui.dF, v]; render(); },
  dOne: v => startDrill('order', [v]),
  dStart: v => startDrill(v, ['random10'].includes(v) || tab === 'home' ? [] : ui.dF),
  dAns: v => {
    const i = ui.dq[ui.di], ok = (+v === 1) === DRILL[i].a, r = S.drill[i] || { n: 0, c: 0, s: 0 };
    r.n++; if (ok) { r.c++; r.s++; } else r.s = 0; r.l = ok ? 1 : 0; S.drill[i] = r;
    ui.dAns = +v; ui.dRes.push({ i, ok }); save(); render();
  },
  dNext: () => { ui.di++; ui.dAns = null; render(); scrollTo(0, 0); },
  dRetry: () => { ui.dq = shuffle(ui.dRes.filter(x => !x.ok).map(x => x.i)); ui.di = 0; ui.dAns = null; ui.dRes = []; render(); scrollTo(0, 0); },
  dExit: () => { ui.dq = null; render(); scrollTo(0, 0); },
  nSeg: v => { ui.noteSeg = v; ui.noteF = ''; ui.noteQ = ''; render(); },
  nStar: () => { ui.star3 = !ui.star3; render(); },
  nHide: () => { S.hideNum = !S.hideNum; ui.shown = {}; save(); render(); },
  nShow: v => { if (!S.hideNum) return; ui.shown = ui.shown || {}; ui.shown[v] = !ui.shown[v]; $('#nlist').innerHTML = noteList(); },
  nChk: v => { S.chk[v] = !S.chk[v]; if (!S.chk[v]) delete S.chk[v]; save(); $('#nlist').innerHTML = noteList(); },
  reset: v => {
    const names = { mock: '模試の記録', drill: '○×の記録', chk: '要点のチェック', all: 'すべての記録' };
    if (!confirm(`${names[v]}を消去します。元に戻せません。よろしいですか？`)) return;
    if (v === 'mock' || v === 'all') { S.mock = {}; S.hist = []; S.exam = null; }
    if (v === 'drill' || v === 'all') S.drill = {};
    if (v === 'chk' || v === 'all') S.chk = {};
    save(); render(); toast('消去しました');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT') return;
  if (el.dataset.a === 'mAns' && S.exam && tab === 'mock') { S.exam.ans[MOCK[ui.ei || 0].no] = +el.dataset.v; save(); render(); return; }
  const f = H[el.dataset.a]; if (f) f(el.dataset.v);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'mField' && el.value) startMock(MOCK.filter(q => q.f === el.value).map(q => q.no));
  if (el.dataset.a === 'nField') { ui.noteF = el.value; $('#nlist').innerHTML = noteList(); }
});
document.addEventListener('input', e => { if (e.target.id === 'nq') { ui.noteQ = e.target.value; $('#nlist').innerHTML = noteList(); } });

if (S.exam && !S.exam.done) ui.ei = 0;
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
