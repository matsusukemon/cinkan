成する前であれば、損害を賠償することなくいつでも契約を解除できる。"],"exp":[{"ok":false,"r":"民法634条。可分な部分の給付で注文者が利益を受けるときは、その割合に応じて報酬を請求できる。"},{"ok":false,"r":"民法637条。知った時から1年以内に通知が必要。"},{"ok":true,"r":"民法633条。"},{"ok":false,"r":"民法641条。仕事完成前はいつでも解除できるが、損害を賠償しなければならない。"}],"ans":3},{"no":3,"f":"管理受託契約","pt":"管理業務＝「委託を受けて」行う維持保全（＋併せて行う金銭管理）。","stem":"次のうち、賃貸住宅管理業法上の「管理業務」に該当するものはいくつあるか。","items":["賃貸人から委託を受けて、居室と共用部分の点検・清掃を行い、必要な修繕を業者に手配する業務","賃貸人から委託を受けて、家賃の集金のみを行う業務","賃貸人から委託を受けて、維持保全と併せて敷金・共益費の管理を行う業務","自ら所有するアパートの点検・修繕を自ら行う業務"],"itemExp":[{"ok":true,"r":"維持保全（点検等と修繕の手配を一貫して行う）に該当。"},{"ok":false,"r":"金銭管理のみは非該当。"},{"ok":true,"r":"維持保全と併せて行う金銭管理は該当。"},{"ok":false,"r":"「委託を受けて」行うものではないため非該当。"}],"note":"→ 該当するものは2つ。正解は肢2。","c":["１つ","２つ","３つ","４つ"],"ans":2},{"no":4,"f":"管理受託契約","pt":"全部の再委託は、分割しても・相手が登録業者でも禁止。","stem":"管理受託契約における再委託・責任に関する次の記述のうち、最も不適切なものはどれか。","c":["各再委託先が賃貸住宅管理業者であれば、管理業務の全部を複数の者に分割して再委託することができる。","責任及び免責に関する定めがあるときは、その内容を管理受託契約締結時書面に記載しなければならない。","再委託に関する定めがあるときは、その内容を管理受託契約締結時書面に記載しなければならない。","管理業務の一部を再委託する予定がある場合、再委託先に関する事項は重要事項説明の対象となる。"],"exp":[{"ok":false,"r":"再委託先が誰であっても、全部の再委託（分割して全部を任せることを含む）は禁止。"},{"ok":true,"r":"締結時書面の記載事項。"},{"ok":true,"r":"締結時書面の記載事項。"},{"ok":true,"r":"再委託に関する事項は重要事項。"}],"ans":1},{"no":5,"f":"管理受託契約","pt":"オーナーチェンジで賃貸借は承継されるが、管理受託契約は当然には承継されない。","stem":"管理受託契約の終了・承継等に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅標準管理受託契約書では、契約期間中の解約の申入れは一切認められていない。","管理業者が管理業務の一部を再委託した場合でも、委託者に対する責任は管理業者が負う。","管理受託契約は、当事者の合意がなくても、期間満了時に必ず自動的に更新される。","委託者が賃貸住宅を第三者に売却した場合、管理受託契約は当然に新所有者に承継される。"],"exp":[{"ok":false,"r":"一定期間前に申し入れることで解約できる条項がある。"},{"ok":true,"r":"再委託先の行為についても管理業者が責任を負う。"},{"ok":false,"r":"更新は契約の定めや当事者の合意による。"},{"ok":false,"r":"賃貸人の地位は移転しても、管理受託契約（委任）は当然には承継されない。新所有者との新たな契約が必要。"}],"ans":2},{"no":6,"f":"管理受託契約","pt":"委任終了後も急迫の事情があれば必要な処分をする義務がある。","stem":"委任契約における受任者の義務に関する次の記述のうち、最も不適切なものはどれか。","c":["受任者が、委任者に引き渡すべき金銭を自己のために消費したときは、消費した日以後の利息を支払わなければならない。","受任者は、委任事務を処理するに当たって受け取った金銭を、委任者に引き渡さなければならない。","委任が終了した場合、急迫の事情があるときでも、受任者は一切の事務処理をしてはならない。","受任者は、委任事務を処理するため自己に過失なく損害を受けたときは、委任者に賠償を請求できる。"],"exp":[{"ok":true,"r":"民法647条。損害があれば賠償も必要。"},{"ok":true,"r":"民法646条1項。"},{"ok":false,"r":"民法654条。急迫の事情があるときは、委任者等が処理できるまで必要な処分をしなければならない。"},{"ok":true,"r":"民法650条3項。"}],"ans":3},{"no":7,"f":"管理受託契約","pt":"管理業の登録 ≠ 宅建業免許・建設業許可。訴訟追行は非弁行為のおそれ。","stem":"賃貸住宅管理業者の業務と他の法令の関係に関する次の記述のうち、最も適切なものはどれか。","c":["管理業者が入居者募集のため賃貸借の媒介を業として行う場合、宅地建物取引業の免許が必要である。","賃貸住宅管理業者であれば、建設業の許可がなくても、あらゆる規模の修繕工事を請け負うことができる。","管理業者は、オーナーの代理人として、賃料増額請求の訴訟を報酬を得て追行することができる。","賃貸住宅管理業の登録を受けていれば、宅建業の免許がなくても、賃貸借の媒介を業として行うことができる。"],"exp":[{"ok":true,"r":"賃貸借の媒介は宅建業に当たる。"},{"ok":false,"r":"軽微な工事（原則500万円未満）を除き、建設業の許可が必要。"},{"ok":false,"r":"弁護士法72条（非弁行為）に抵触するおそれがある。"},{"ok":false,"r":"管理業の登録は宅建業の免許の代わりにならない。"}],"ans":1},{"no":8,"f":"維持保全・原状回復","pt":"タバコのヤニは居室全体の張替えも賃借人負担になり得る（最小単位の原則の例外）。","stem":"「原状回復をめぐるトラブルとガイドライン」に関する次の記述のうち、最も不適切なものはどれか。","c":["賃借人の過失で破損したフローリングの部分補修費用は、経過年数を考慮しない。","賃借人が鍵を紛失した場合のシリンダー交換費用は、賃借人の負担となる。","喫煙によるヤニで居室全体のクロスが変色した場合、居室全体のクロスの張替費用を賃借人負担とすることが妥当とされる。","賃借人が通常の清掃を怠ったことにより生じた浴槽の水垢・カビの除去費用は、常に賃貸人の負担となる。"],"exp":[{"ok":true,"r":"フローリングの部分補修は経過年数を考慮しない。"},{"ok":true,"r":"賃借人の管理不十分による。"},{"ok":true,"r":"毀損部分の最小単位の原則の例外として、居室全体の張替えが妥当とされる。"},{"ok":false,"r":"通常の清掃を怠った結果は、賃借人負担となる。"}],"ans":4},{"no":9,"f":"維持保全・原状回復","pt":"賃借人所有のエアコンのビス穴も賃貸人負担（通常損耗）。","stem":"「原状回復をめぐるトラブルとガイドライン」において、賃貸人の負担とされるものはいくつあるか。","items":["テレビや冷蔵庫等の後部壁面の黒ずみ（電気ヤケ）","賃借人所有のエアコン設置による壁のビス穴・跡","飼育ペットによる柱のキズ","賃借人が通常の清掃を行っていた場合の、退去時の専門業者による全体のハウスクリーニング"],"itemExp":[{"ok":true,"r":"通常損耗（賃貸人負担）。"},{"ok":true,"r":"エアコンは生活必需品となっており、通常損耗（賃貸人負担）。"},{"ok":false,"r":"賃借人負担。"},{"ok":true,"r":"次の入居者確保のためのもので賃貸人負担。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":10,"f":"建物・設備","pt":"用途変更の確認は200㎡超。既存不適格は直ちに改修する義務なし。","stem":"建築基準法に関する次の記述のうち、最も適切なものはどれか。","c":["既存不適格建築物は、法改正後直ちに現行の基準に適合するよう改修しなければならない。","建物の増築・改築には、建築確認が一切不要である。","床面積200㎡を超える建物を共同住宅（特殊建築物）に用途変更する場合は、建築確認が必要である。","共同住宅は、建築基準法上の特殊建築物に該当しない。"],"exp":[{"ok":false,"r":"既存不適格は違法ではなく、増改築等の際に適合させればよい。"},{"ok":false,"r":"規模等に応じて増改築でも建築確認が必要。"},{"ok":true,"r":"2019年改正で100㎡から200㎡に緩和された。"},{"ok":false,"r":"共同住宅は特殊建築物に該当する。"}],"ans":3},{"no":11,"f":"建物・設備","pt":"避雷設備20m超、非常用エレベーター31m超、連結送水管7階以上、換気0.5回/h。","stem":"建物の高さ・階数に応じた設備に関する次の記述のうち、最も不適切なものはどれか。","c":["住宅の居室の機械換気設備は、換気回数0.5回/h以上の能力が求められる。","地階を除く階数が7以上の建物であっても、連結送水管の設置は不要である。","高さ31mを超える建築物には、原則として非常用の昇降機を設けなければならない。","高さ20mを超える建築物には、原則として避雷設備を設けなければならない。"],"exp":[{"ok":true,"r":"シックハウス対策の基準。"},{"ok":false,"r":"消防法上、地階を除く階数7以上の建物には連結送水管の設置が必要。"},{"ok":true,"r":"建築基準法34条2項。"},{"ok":true,"r":"建築基準法33条。"}],"ans":2},{"no":12,"f":"建物・設備","pt":"号数＝1分間に25℃上げた湯のリットル数。大きいほど湯量が多い。","stem":"給湯・ガス設備に関する次の記述のうち、最も不適切なものはどれか。","c":["ガスのマイコンメーターは、一定以上の地震やガスの異常な流量を検知すると自動でガスを遮断する。","給湯器の号数が大きいほど、一度に出せる湯量は少なくなる。","ガス機器の不完全燃焼により一酸化炭素が発生するおそれがあるため、換気が重要である。","給湯器の号数は、1分間に水温を25℃上昇させた湯を何リットル出せるかを表す。"],"exp":[{"ok":true,"r":"復帰ボタンで復旧できる。"},{"ok":false,"r":"号数が大きいほど、一度に出せる湯量は多い。"},{"ok":true,"r":"CO中毒防止のため換気が必要。"},{"ok":true,"r":"例：24号＝1分間に24リットル。"}],"ans":2},{"no":13,"f":"建物・設備","pt":"浄化槽：保守点検・清掃（年1回以上）・法定検査（年1回）の3つ。","stem":"浄化槽・排水設備に関する次の記述のうち、最も不適切なものはどれか。","c":["排水管の詰まりを防止するためには、定期的な高圧洗浄が有効である。","浄化槽の清掃は、原則として年1回以上行う。","浄化槽の管理者は、毎年1回、指定検査機関による定期検査（法定検査）を受けなければならない。","浄化槽は、放流水の水質が基準を満たしていれば、保守点検は不要である。"],"exp":[{"ok":true,"r":"台所系統は特に詰まりやすい。"},{"ok":true,"r":"浄化槽法。"},{"ok":true,"r":"浄化槽法11条。"},{"ok":false,"r":"定期的な保守点検・清掃・法定検査がいずれも必要。"}],"ans":4},{"no":14,"f":"建物・設備","pt":"ポップアウト＝円錐状の剥がれ、エフロレッセンス＝白華（石灰分）、錆汁＝鉄筋の錆。","stem":"コンクリートの劣化現象・調査に関する次の記述のうち、最も適切なものはどれか。","c":["外壁のひび割れは、幅の大小にかかわらず、雨水浸入の原因とはならない。","赤外線調査では、外壁タイルの浮きを調べることはできない。","エフロレッセンス（白華）とは、内部の鉄筋の錆が表面に流れ出たものである。","ポップアウトとは、コンクリート内部の膨張圧によって表面が円錐状に剥がれる現象である。"],"exp":[{"ok":false,"r":"ひび割れは雨水浸入や鉄筋腐食の原因になる。"},{"ok":false,"r":"温度差を利用して浮きを調べることができる。"},{"ok":false,"r":"エフロレッセンスはセメント中の石灰分等が表面に析出した白い物質。錆の流出は錆汁。"},{"ok":true,"r":"骨材の膨張などが原因。"}],"ans":4},{"no":15,"f":"維持保全・原状回復","pt":"共用廊下・階段は避難経路。私物の放置は撤去を求める。","stem":"共用部分の管理に関する次の記述のうち、最も不適切なものはどれか。","c":["共用部分の清掃は、維持保全の一環として管理業務に含まれ得る。","共用部分の点検で発見した不具合は、委託者（オーナー）に報告すべきである。","共用部分の照明は、防犯上、一定の明るさを確保することが望ましい。","共用廊下に入居者の私物が置かれていても、避難の支障にならないため放置してよい。"],"exp":[{"ok":true,"r":"点検・修繕と一貫して行えば維持保全。"},{"ok":true,"r":"修繕の要否の判断のため。"},{"ok":true,"r":"防犯対策の基本。"},{"ok":false,"r":"避難経路の障害となり、消防法上も問題となり得るため撤去を求める。"}],"ans":4},{"no":16,"f":"維持保全・原状回復","pt":"計画修繕＝長期修繕計画＋資金計画。工事前に入居者へ周知。","stem":"計画修繕に関する次の記述のうち、最も適切なものはどれか。","c":["修繕工事の実施時期は、劣化の状況に関係なく築年数だけで決める。","賃貸住宅の大規模修繕の費用は、すべて家賃とは別に賃借人に請求できる。","修繕工事を行う際、入居者への事前の説明や周知は不要である。","計画修繕を確実に実施するには、修繕費用を計画的に積み立てるなど資金計画を立てておくことが重要である。"],"exp":[{"ok":false,"r":"点検結果による劣化状況を踏まえて決める。"},{"ok":false,"r":"修繕費用は原則として賃貸人負担。"},{"ok":false,"r":"騒音・立入り等があるため、事前の周知が必要。"},{"ok":true,"r":"長期修繕計画と資金計画をセットで考える。"}],"ans":4},{"no":17,"f":"建物・設備","pt":"エレベーター：定期検査（年1回・報告）と保守点検は別物。","stem":"昇降機・機械式駐車場の管理に関する次の記述のうち、最も不適切なものはどれか。","c":["機械式駐車場は、メーカー等による定期的な保守点検が推奨されている。","フルメンテナンス契約は、POG契約に比べて月額の保守費用が高くなる傾向がある。","エレベーターは、年1回の定期検査を受けていれば、日常の保守点検は不要である。","エレベーターの定期検査の結果は、所有者等が特定行政庁に報告する。"],"exp":[{"ok":true,"r":"事故防止のため。"},{"ok":true,"r":"部品交換費用を含むため。"},{"ok":false,"r":"定期検査とは別に、保守点検（月1回程度等）が必要。"},{"ok":true,"r":"建築基準法12条。"}],"ans":3},{"no":18,"f":"金銭管理・会計","pt":"受領拒否・受領不能・債権者不確知→供託で債務消滅。","stem":"賃料の供託に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸人が賃料の受領を拒んだ場合、賃借人は賃料を供託することができ、供託により債務を免れる。","賃借人が適法に供託した場合でも、賃貸人は賃料不払いを理由に契約を解除できる。","供託は、どの供託所に対しても行うことができる。","賃料を供託できるのは、賃貸人が死亡した場合に限られる。"],"exp":[{"ok":true,"r":"民法494条。"},{"ok":false,"r":"供託で債務は消滅するため、不払いを理由に解除できない。"},{"ok":false,"r":"債務の履行地の供託所に行う。"},{"ok":false,"r":"受領拒否、受領不能、債権者を確知できない場合に供託できる。"}],"ans":1},{"no":19,"f":"金銭管理・会計","pt":"判決があっても自力執行は不可。明渡しの催告→原則1か月後が引渡し期限。","stem":"明渡し・強制執行等に関する次の記述のうち、最も不適切なものはどれか。","c":["少額訴訟で請求を認容する判決には、原則として仮執行宣言が付される。","仮執行宣言が付された支払督促に基づいて、強制執行をすることができる。","建物明渡しの判決が確定すれば、賃貸人自身が鍵を壊して入室し、家財を処分することができる。","執行官が明渡しの催告をした場合、引渡しの期限は、原則として催告日から1か月を経過する日となる。"],"exp":[{"ok":true,"r":"少額訴訟の特則。"},{"ok":true,"r":"債務名義となる。"},{"ok":false,"r":"判決後も自力救済は許されず、執行官による強制執行の手続が必要。"},{"ok":true,"r":"民事執行法168条の2。"}],"ans":3},{"no":20,"f":"金銭管理・会計","pt":"一部弁済＝承認→時効の更新。連帯保証人にはすぐ請求できる。","stem":"滞納賃料の回収に関する次の記述のうち、最も適切なものはどれか。","c":["賃借人が滞納賃料の一部を支払った場合、債務の承認に当たり、その賃料債権の消滅時効は更新される。","管理業者は、委託者に代わって、自らの名前で滞納賃料の支払請求訴訟を提起することができる。","滞納者の勤務先に電話をかけて滞納の事実を伝えることは、督促として問題ない。","連帯保証人への請求は、賃借人が支払えないことが確定した後でなければできない。"],"exp":[{"ok":true,"r":"民法152条（承認による時効の更新）。"},{"ok":false,"r":"訴訟の原告は賃貸人。管理業者が業として行えば非弁行為のおそれ。"},{"ok":false,"r":"プライバシー侵害・不当な督促となり得る。"},{"ok":false,"r":"連帯保証人には催告・検索の抗弁権がなく、直ちに請求できる。"}],"ans":1},{"no":21,"f":"金銭管理・会計","pt":"B/S＝一時点の財政状態、P/L＝期間の経営成績。預り敷金は負債。","stem":"財務諸表に関する次の記述のうち、最も不適切なものはどれか。","c":["損益計算書は、一定期間の経営成績（収益・費用・利益）を示す。","貸借対照表は、一定時点の財政状態（資産・負債・純資産）を示す。","賃借人から預かった敷金は、貸借対照表上、資産に計上する。","キャッシュ・フロー計算書は、一定期間の現金の増減を示す。"],"exp":[{"ok":true,"r":"P/L。"},{"ok":true,"r":"バランスシート。"},{"ok":false,"r":"返還義務がある預り金なので負債に計上する。"},{"ok":true,"r":"営業・投資・財務の3区分。"}],"ans":3},{"no":22,"f":"賃貸借契約","pt":"個人オーナーも賃貸業を営めば「事業者」。違約金の平均的損害超過分・一方的な不利益条項は無効。","stem":"消費者契約法と賃貸借契約に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸人が個人であれば、賃貸業を営んでいても、消費者契約法は一切適用されない。","契約解除に伴う損害賠償額の予定（違約金）のうち、平均的な損害の額を超える部分は無効となる。","消費者の利益を一方的に害する条項は、無効となり得る。","事業者の損害賠償責任の全部を免除する条項は、無効となる。"],"exp":[{"ok":false,"r":"個人でも事業として賃貸していれば「事業者」に当たり、居住用の賃借人（消費者）との契約に適用される。"},{"ok":true,"r":"消費者契約法9条。"},{"ok":true,"r":"消費者契約法10条。"},{"ok":true,"r":"消費者契約法8条。"}],"ans":1},{"no":23,"f":"賃貸借契約","pt":"無催告解除特約は「催告しなくても不合理でない事情」がある場合に有効。","stem":"無催告解除特約に関する次の記述のうち、最も適切なものはどれか。","c":["「賃料を1か月でも滞納すれば無催告で解除できる」旨の特約は、どのような場合でも有効である。","無催告解除特約は、催告をしなくても不合理とは認められない事情がある場合には、無催告で解除することを認めた趣旨として有効とされる。","無催告解除特約は、賃借人が個人である場合に限り有効である。","無催告解除特約は、一律に無効である。"],"exp":[{"ok":false,"r":"判例上、無条件では効力を認められない。"},{"ok":true,"r":"判例（最判昭43.11.21）。"},{"ok":false,"r":"そのような限定はない。"},{"ok":false,"r":"一定の場合には有効とされる。"}],"ans":2},{"no":24,"f":"賃貸借契約","pt":"失火でも賃借人は賃貸人に債務不履行責任を負う（失火責任法は適用されない）。","stem":"賃借人の責任に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸人の承諾を得て転貸した場合でも、転借人が建物を損傷したときは、賃借人が賃貸人に対して責任を負う。","賃借人は、賃借物を返還する際、通常損耗を除き原状回復義務を負う。","賃借人の同居家族の過失で建物を損傷した場合、賃借人が賃貸人に対して損害賠償責任を負う。","失火責任法により、賃借人は軽過失による失火であれば、賃貸人に対して損害賠償責任を負わない。"],"exp":[{"ok":true,"r":"転借人の行為についても賃借人が責任を負う。"},{"ok":true,"r":"民法621条。"},{"ok":true,"r":"同居家族は履行補助者とされ、賃借人の責任となる。"},{"ok":false,"r":"失火責任法は不法行為責任に関する法律。賃借人は賃貸人に債務不履行責任（返還義務違反）を負う。"}],"ans":4},{"no":25,"f":"賃貸借契約","pt":"賃貸人破産：対抗要件ある賃借人の契約は管財人も解除不可。賃借人破産：管財人は解除を選べる。","stem":"当事者の破産と賃貸借に関する次の記述のうち、最も適切なものはどれか。","c":["民法には、賃借人が破産した場合に賃貸人が解約の申入れをすることができる旨の規定がある。","賃貸人が破産した場合、賃借人は直ちに建物を明け渡さなければならない。","賃借人が破産した場合でも、破産管財人は賃貸借契約を解除することができない。","賃貸人が破産した場合、対抗要件を備えた賃借人との賃貸借契約は、破産管財人が解除することができない。"],"exp":[{"ok":false,"r":"2004年の破産法改正に伴い削除された。"},{"ok":false,"r":"対抗要件を備えた賃借人は保護される。"},{"ok":false,"r":"賃借人の破産管財人は、破産法53条により契約の解除を選択できる。"},{"ok":true,"r":"破産法56条1項。賃借人の保護。"}],"ans":4},{"no":26,"f":"賃貸借契約","pt":"32条を排除できるのは定期借家の賃料改定特約だけ。自動改定特約があっても減額請求は可能。","stem":"賃料の自動改定特約に関する次の記述のうち、最も不適切なものはどれか。","c":["定期建物賃貸借で賃料改定に関する特約がある場合、借地借家法32条は適用されない。","一定期間ごとに一定割合で賃料を増額する自動改定特約は、原則として有効である。","普通建物賃貸借では、賃料の改定に関する特約を定めることで、借地借家法32条の適用を排除できる。","自動改定特約があっても、その基礎となった事情が失われて特約による賃料が不相当になれば、借地借家法32条の減額請求ができる。"],"exp":[{"ok":true,"r":"借地借家法38条9項。"},{"ok":true,"r":"判例。"},{"ok":false,"r":"普通建物賃貸借では32条は排除できない（排除できるのは定期建物賃貸借の賃料改定特約）。"},{"ok":true,"r":"判例（最判平15.6.12等）。"}],"ans":3},{"no":27,"f":"賃貸借契約","pt":"違約金は平均的損害を超える部分が無効になり得る。更新料特約は原則有効。","stem":"更新料・違約金等に関する次の記述のうち、最も適切なものはどれか。","c":["法定更新された場合、更新後の期間は従前の契約と同一の期間となる。","更新料の不払いは、どのような場合でも賃貸借契約の解除事由とならない。","賃借人の中途解約時の違約金特約は、平均的な損害を超える部分について、消費者契約法により無効となり得る。","更新料特約は、消費者契約法10条により常に無効である。"],"exp":[{"ok":false,"r":"法定更新後は期間の定めがないものとなる。"},{"ok":false,"r":"信頼関係を破壊する程度であれば解除事由となり得る（判例）。"},{"ok":true,"r":"消費者契約法9条。"},{"ok":false,"r":"高額すぎるなど特段の事情がなければ有効（最判平23.7.15）。"}],"ans":3},{"no":28,"f":"賃貸借契約","pt":"地位の留保に賃借人の承諾は不要。留保後に譲渡人・譲受人間の賃貸借が終われば地位は譲受人へ。","stem":"賃貸人たる地位の移転・留保に関する次の記述のうち、最も不適切なものはどれか。","c":["譲渡人と譲受人が賃貸人たる地位を譲渡人に留保するには、賃借人の承諾が必要である。","賃貸人たる地位を譲渡人に留保した場合において、その後に譲渡人と譲受人の間の賃貸借が終了したときは、留保されていた地位は譲受人に移転する。","賃貸人たる地位が移転した場合、敷金返還債務は新賃貸人に承継される。","対抗要件を備えた賃貸借の目的物が譲渡された場合、賃貸人たる地位の移転に賃借人の承諾は不要である。"],"exp":[{"ok":false,"r":"留保は譲渡人と譲受人の合意（＋譲受人が譲渡人に賃貸する合意）で足り、賃借人の承諾は不要。"},{"ok":true,"r":"民法605条の2第2項後段。"},{"ok":true,"r":"民法605条の2第4項。"},{"ok":true,"r":"民法605条の2第1項。"}],"ans":1},{"no":29,"f":"賃貸借契約","pt":"敷金から差し引けるのは「賃貸借に基づく賃借人の債務」（未払賃料・原状回復費用等）。","stem":"敷金の充当・敷引に関する次の記述のうち、最も適切なものはどれか。","c":["敷金は、賃借人の承諾がなければ未払賃料に充当できない。","敷引特約は、賃借人が明確に合意していれば、敷引額がいくら高額であっても有効である。","敷金から控除できるのは、未払賃料や賃借人が負担すべき原状回復費用など、賃貸借に基づいて生じた賃借人の債務である。","原状回復費用の見積りが出るまで、賃貸人は敷金の返還時期を無期限に延ばすことができる。"],"exp":[{"ok":false,"r":"賃貸人は賃借人の承諾なく充当できる。"},{"ok":false,"r":"高額すぎる場合は消費者契約法10条で無効となり得る（最判平23.3.24）。"},{"ok":true,"r":"民法622条の2。"},{"ok":false,"r":"明渡し後、精算して遅滞なく返還すべき。"}],"ans":3},{"no":30,"f":"賃貸借契約","pt":"定期借家：書面が必要なのは「契約」と「事前説明」。終了通知に方式の定めはない。","stem":"定期建物賃貸借に関する次の記述のうち、最も不適切なものはどれか。","c":["定期建物賃貸借の終了の通知は、書面でしなければ効力を生じない。","床面積200㎡以上の建物であっても、賃借人の中途解約を認める特約を定めることは有効である。","事前説明書面には、契約の更新がなく期間の満了により終了する旨を記載する。","定期建物賃貸借で、賃貸人からの中途解約を認める特約は、賃借人に不利なものとして無効と解されている。"],"exp":[{"ok":false,"r":"終了通知の方式は法律上定められていない（実務では証拠のため書面で行う）。"},{"ok":true,"r":"法定の中途解約権がない場合でも、特約で定めることは可能。"},{"ok":true,"r":"借地借家法38条3項。"},{"ok":true,"r":"賃借人に不利な特約として効力を否定されるのが一般的な考え方。"}],"ans":1},{"no":31,"f":"賃貸借契約","pt":"借地借家法の対象外：建物所有目的でない土地（駐車場）、使用貸借、一時使用。","stem":"借地借家法の適用範囲に関する次の記述のうち、最も適切なものはどれか。","c":["建物の一部であっても、構造上・利用上独立した部分の賃貸借には借地借家法が適用され得る。","駐車場として土地のみを賃貸する場合にも、借地借家法の借地に関する規定が適用される。","使用貸借にも、借地借家法の借家に関する規定が適用される。","一時使用のための建物の賃貸借にも、借地借家法の更新に関する規定が適用される。"],"exp":[{"ok":true,"r":"マンションの一室や間仕切りされた店舗部分等。"},{"ok":false,"r":"建物所有を目的としない土地の賃貸借には借地の規定は適用されない。"},{"ok":false,"r":"借地借家法は賃貸借（有償）にのみ適用。"},{"ok":false,"r":"借地借家法40条により適用されない。"}],"ans":1},{"no":32,"f":"賃貸住宅管理業法","pt":"登録がなくなっても、締結済み契約の業務の結了の範囲では管理業者とみなされる。","stem":"登録の失効・取消し後の業務に関する次の記述のうち、最も不適切なものはどれか。","c":["登録が取り消された場合でも、締結済みの管理受託契約に基づく業務を結了する目的の範囲内では、なお賃貸住宅管理業者とみなされる。","登録の更新を受けずに有効期間が満了した場合、締結済みの契約に基づく業務も、直ちに一切行えなくなる。","登録を取り消された者は、取消しの日から5年を経過しなければ、新たに登録を受けることができない。","廃業の届出により登録が効力を失った場合も、締結済みの契約に基づく業務の結了の範囲内では、なお管理業者とみなされる。"],"exp":[{"ok":true,"r":"登録がなくなった後の業務の結了に関する規定。"},{"ok":false,"r":"業務を結了する目的の範囲内では、なお管理業者とみなされる。"},{"ok":true,"r":"登録拒否事由。"},{"ok":true,"r":"登録取消しの場合と同様。"}],"ans":2},{"no":33,"f":"賃貸住宅管理業法","pt":"サブリース規制 2020年12月 → 登録制度 2021年6月（1年の経過措置）。","stem":"賃貸住宅管理業法の施行等に関する次の記述のうち、最も適切なものはどれか。","c":["サブリース規制は2020年12月に、賃貸住宅管理業の登録制度は2021年6月に施行された。","賃貸住宅管理業法を所管するのは総務大臣である。","賃貸住宅管理業法の施行前には、賃貸住宅管理業に関する登録制度は一切存在しなかった。","登録制度の施行日に、経過措置なく直ちに登録が義務付けられた。"],"exp":[{"ok":true,"r":"サブリース規制が先に施行された。"},{"ok":false,"r":"国土交通大臣。"},{"ok":false,"r":"国土交通省告示による任意の登録制度（2011年〜）があった。"},{"ok":false,"r":"施行後1年間の経過措置があった。"}],"ans":1},{"no":34,"f":"賃貸住宅管理業法","pt":"兼務しても業務管理者の職務（管理・監督）は免除されない。","stem":"業務管理者に関する次の記述のうち、最も不適切なものはどれか。","c":["業務管理者は、他の営業所又は事務所の業務管理者を兼務することができない。","業務管理者が専任の宅地建物取引士を兼務している場合は、管理業務の管理・監督を行わなくてよい。","業務管理者が欠けた営業所では、新たに業務管理者を選任するまでの間、管理受託契約を締結してはならない。","業務管理者は、同じ営業所の専任の宅地建物取引士を兼務することができる。"],"exp":[{"ok":true,"r":"法12条3項。"},{"ok":false,"r":"兼務していても、業務管理者としての管理・監督の職務は免除されない。"},{"ok":true,"r":"法12条2項。"},{"ok":true,"r":"業務に支障がなければ可。"}],"ans":2},{"no":35,"f":"賃貸住宅管理業法","pt":"誇大広告・不当勧誘の禁止は「サブリース」だけの規制。管理受託には適用されない。","stem":"賃貸住宅管理業法の規制対象に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸住宅管理業者が管理受託契約の締結を勧誘する際には、不当な勧誘等の禁止の規定が適用される。","賃貸住宅管理業法には、賃貸住宅管理業者が管理受託契約を勧誘する際の広告について、誇大広告を禁止する規定は置かれていない。","特定転貸事業者が誇大広告等の禁止に違反しても、罰則の対象とはならない。","賃貸住宅管理業者は、従業者証明書を携帯させる義務を負わない。"],"exp":[{"ok":false,"r":"不当勧誘の禁止はサブリースの規制で、管理受託契約には規定がない。"},{"ok":true,"r":"誇大広告・不当勧誘の禁止はサブリース（特定賃貸借）の規制。"},{"ok":false,"r":"罰則（罰金）の対象。"},{"ok":false,"r":"携帯させる義務がある。"}],"ans":2},{"no":36,"f":"賃貸住宅管理業法","pt":"罰金刑で欠格になるのは管理業法違反等。拘禁刑以上は罪種を問わない。","stem":"次のうち、賃貸住宅管理業の登録拒否事由に該当するものはいくつあるか。","items":["破産手続開始の決定を受けて復権を得ない者","賃貸住宅管理業法に違反して罰金刑に処せられ、その執行を終えた日から3年を経過した者","道路交通法に違反して罰金刑に処せられ、その執行を終えた日から1年を経過した者","心身の故障により賃貸住宅管理業を適正に営むことができない者として国土交通省令で定めるもの"],"itemExp":[{"ok":true,"r":"該当する。"},{"ok":true,"r":"5年を経過していないので該当する。"},{"ok":false,"r":"罰金刑で欠格となるのは管理業法違反等の場合のみ。該当しない。"},{"ok":true,"r":"該当する。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":37,"f":"賃貸住宅管理業法","pt":"定期報告は委託者の申出でも省略不可。","stem":"委託者への定期報告に関する次の記述のうち、最も不適切なものはどれか。","c":["定期報告は、管理受託契約を締結した日から1年を超えない期間ごとに行う必要がある。","定期報告の説明は、委託者と対面で行うほか、ITを活用して行うこともできる。","管理業務報告書には、報告の対象となる期間を記載する。","委託者が定期報告は不要であると申し出た場合は、定期報告の義務は免除される。"],"exp":[{"ok":true,"r":"施行規則。"},{"ok":true,"r":"説明方法は対面に限られない。"},{"ok":true,"r":"記載事項。"},{"ok":false,"r":"委託者の申出によって法律上の義務は免除されない。"}],"ans":4},{"no":38,"f":"賃貸住宅管理業法","pt":"秘密保持・証明書は代表者・アルバイト・派遣を含め、業務に従事する全員が対象。","stem":"秘密保持・従業者証明書に関する次の記述のうち、最も適切なものはどれか。","c":["秘密保持義務に違反しても、罰則の対象とはならない。","従業者証明書の携帯義務は、管理業務に従事する代表者（社長）には及ばない。","秘密保持義務を負う「従業者」には、アルバイト等の一時的に業務に従事する者も含まれる。","従業者証明書は管理業者が任意に発行するもので、携帯は努力義務にとどまる。"],"exp":[{"ok":false,"r":"罰則（罰金）の対象。"},{"ok":false,"r":"代表者も管理業務に従事する以上、携帯が必要。"},{"ok":true,"r":"雇用形態を問わない。"},{"ok":false,"r":"携帯させなければ業務に従事させてはならない（義務）。"}],"ans":3},{"no":39,"f":"サブリース（特定賃貸借）","pt":"サブリース重説は例外なく締結前に必要（プロ相手を除く）。","stem":"特定賃貸借契約重要事項説明に関する次の記述のうち、最も不適切なものはどれか。","c":["説明書面には、契約期間中に家賃が減額され得ることや、オーナーからの更新拒絶等には正当事由が必要であることを記載する。","特定転貸事業者がオーナーに代わって入居者募集を行う場合には、オーナーへの重要事項説明は不要である。","説明の後、相手方が契約を締結するかどうかを判断する期間を置くことが望ましい。","説明書面は、相手方が十分に理解できるよう、文字の大きさや記載方法に配慮して作成することが望ましい。"],"exp":[{"ok":true,"r":"最も重要な説明事項。"},{"ok":false,"r":"入居者募集の有無にかかわらず、特定賃貸借契約の締結前に説明が必要。"},{"ok":true,"r":"1週間程度が望ましいとされる。"},{"ok":true,"r":"ガイドラインの考え方。"}],"ans":2},{"no":40,"f":"サブリース（特定賃貸借）","pt":"勧誘者は個人・法人を問わない（既存オーナー、親会社、建設会社、金融機関等）。","stem":"勧誘者に関する次の記述のうち、最も適切なものはどれか。","c":["特定転貸事業者から紹介料を受け取り、知人のオーナーにその事業者のサブリースを勧める既存のオーナーは、勧誘者に該当し得る。","特定転貸事業者の親会社は、勧誘者に該当しない。","勧誘者に該当するのは、法人に限られる。","特定の事業者を勧めることなく、サブリースの一般的な仕組みを説明するだけの行為も、常に勧誘者の勧誘に当たる。"],"exp":[{"ok":true,"r":"個人の既存オーナーも勧誘者に該当し得る。"},{"ok":false,"r":"親会社・グループ会社も該当し得る。"},{"ok":false,"r":"個人も該当し得る。"},{"ok":false,"r":"特定の特定転貸事業者のための勧誘でなければ当たらない。"}],"ans":1},{"no":41,"f":"サブリース（特定賃貸借）","pt":"サブリースの違反は監督処分（指示・業務停止）＋多くに罰則。","stem":"特定転貸事業者に対する規制に関する次の記述のうち、正しいものはいくつあるか。","items":["誇大広告等の禁止に違反した場合、罰則の対象となる","故意に事実を告げず、又は不実のことを告げる行為は、罰則の対象となる","相手方を威迫して困惑させる行為は、指示や業務停止命令の対象となる","特定賃貸借契約重要事項説明を怠っても、監督処分の対象とはならない"],"itemExp":[{"ok":true,"r":"正しい（30万円以下の罰金）。"},{"ok":true,"r":"正しい。"},{"ok":true,"r":"正しい。"},{"ok":false,"r":"誤り。指示・業務停止命令の対象となり、罰則もある。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":42,"f":"サブリース（特定賃貸借）","pt":"標準契約書はひな形（任意）。維持保全・費用負担は別表で明確化。","stem":"特定賃貸借標準契約書に関する次の記述のうち、最も不適切なものはどれか。","c":["借主（特定転貸事業者）が行う維持保全の内容と、貸主・借主の費用負担を別表で定める形式となっている。","特定賃貸借標準契約書は、国土交通省が作成・公表している。","契約が終了した場合、貸主（オーナー）は転貸借契約における転貸人の地位を承継する。","特定賃貸借標準契約書を使用しなければ、特定賃貸借契約は無効となる。"],"exp":[{"ok":true,"r":"修繕の範囲・費用負担を明確にする。"},{"ok":true,"r":"ひな形。"},{"ok":true,"r":"入居者保護のため。"},{"ok":false,"r":"使用は任意。"}],"ans":4},{"no":43,"f":"サブリース（特定賃貸借）","pt":"減額の効果は請求時から。調停は原則簡易裁判所。差額は年1割の利息で精算。","stem":"サブリース家賃の減額請求に関する次の記述のうち、最も適切なものはどれか。","c":["家賃の減額に関する調停は、原則として地方裁判所に申し立てる。","減額請求を受けたオーナーは、裁判が確定するまでは、相当と認める額の家賃の支払を請求できる。","減額請求の効果は、裁判が確定した時から生じる。","減額請求を受けたオーナーは、減額に合意しない限り従前の家賃全額を受け取ることができ、裁判で確定した額との差額を精算する必要はない。"],"exp":[{"ok":false,"r":"原則として簡易裁判所（相手方の住所地等）に申し立てる。"},{"ok":true,"r":"借地借家法32条3項。"},{"ok":false,"r":"請求の意思表示が到達した時から（相当額の範囲で）生じる。"},{"ok":false,"r":"確定額を超えて受け取った分は、年1割の利息を付けて返還する。"}],"ans":2},{"no":44,"f":"サブリース（特定賃貸借）","pt":"業務状況調書等：事業年度ごとに作成→営業所に備置き→相手方等の求めで閲覧。","stem":"特定転貸事業者の書類の閲覧に関する次の記述のうち、最も不適切なものはどれか。","c":["書類は、特定賃貸借契約の相手方や相手方となろうとする者の求めに応じて閲覧させる。","業務及び財産の状況を記載した書類は、事業年度ごとに作成する。","書類は、電磁的記録で作成し、画面表示等により閲覧させることもできる。","相手方から閲覧の求めがあっても、特定転貸事業者は理由なく拒むことができる。"],"exp":[{"ok":true,"r":"法32条。"},{"ok":true,"r":"施行規則。"},{"ok":true,"r":"可能。"},{"ok":false,"r":"閲覧させる義務がある。"}],"ans":4},{"no":45,"f":"サブリース（特定賃貸借）","pt":"収支シミュレーションにはリスクを反映。リスクを説明しても不実告知は違反。","stem":"サブリースの勧誘時の説明に関する次の記述のうち、最も適切なものはどれか。","c":["家賃減額リスクを説明したうえで、事実に反して「当社は過去に一度も家賃を減額したことがない」と告げても問題はない。","勧誘時に重要事項説明をすれば、広告で家賃減額リスクを表示する必要はない。","勧誘者が勧誘を行った場合、特定転貸事業者は一切責任を負わない。","勧誘時に収支シミュレーションを示す場合、家賃減額・空室・修繕費の増加等のリスクを考慮しないものは、相手方の誤認を招くおそれがある。"],"exp":[{"ok":false,"r":"不実告知に当たる。"},{"ok":false,"r":"広告自体が誇大広告規制の対象。"},{"ok":false,"r":"勧誘者の違反について特定転貸事業者も監督処分の対象となる。"},{"ok":true,"r":"リスクを反映しない試算は誤認を招く。"}],"ans":4},{"no":46,"f":"実務・税金・保険","pt":"アパートの敷地も住宅用地特例（200㎡×戸数まで1/6）。","stem":"固定資産税・都市計画税に関する次の記述のうち、最も不適切なものはどれか。","c":["固定資産税の評価替えは、原則として3年ごとに行われる。","都市計画税は、原則として市街化区域内の土地・家屋に課される。","固定資産税の住宅用地の特例は、賃貸住宅の敷地には適用されない。","固定資産税は、原則として年4回に分けて納付することができる。"],"exp":[{"ok":true,"r":"基準年度ごと。"},{"ok":true,"r":"目的税。"},{"ok":false,"r":"賃貸住宅（アパート等）の敷地も住宅用地として特例の対象。"},{"ok":true,"r":"一括納付も可能。"}],"ans":3},{"no":47,"f":"実務・税金・保険","pt":"事業的規模（5棟10室）の効果：65万円控除、専従者給与など。","stem":"不動産所得に関する次の記述のうち、最も適切なものはどれか。","c":["青色申告をしていない者でも、不動産所得の純損失を翌年以後3年間繰り越すことができる。","不動産所得の赤字は、土地取得のための借入金利子に相当する部分を除き、給与所得等と損益通算できる。","不動産所得は、他の所得と分離して課税される。","事業的規模でなくても、生計を一にする家族に支払った給与を青色事業専従者給与として必要経費にできる。"],"exp":[{"ok":false,"r":"純損失の繰越控除は原則として青色申告者が対象。"},{"ok":true,"r":"損益通算の制限は土地の借入金利子部分。"},{"ok":false,"r":"総合課税。"},{"ok":false,"r":"事業的規模であることが必要。"}],"ans":2},{"no":48,"f":"実務・税金・保険","pt":"地震保険は単独不可（火災保険に付帯）。","stem":"賃貸住宅の保険に関する次の記述のうち、最も不適切なものはどれか。","c":["上階からの漏水による水濡れ損害は、火災保険の補償や特約で補償される場合がある。","地震保険は、火災保険とは別に単独で契約することができる。","火災保険の補償対象には、一般に火災のほか落雷・破裂・爆発が含まれる。","事故により空室となった期間の家賃損失を補償する特約がある。"],"exp":[{"ok":true,"r":"契約内容による。"},{"ok":false,"r":"火災保険に付帯して契約する。"},{"ok":true,"r":"基本補償。"},{"ok":true,"r":"家賃収入特約等。"}],"ans":2},{"no":49,"f":"実務・税金・保険","pt":"居住支援法人＝都道府県知事が指定、居住サポート住宅＝市区町村長等が認定。","stem":"住宅セーフティネット制度に関する次の記述のうち、最も適切なものはどれか。","c":["セーフティネット住宅（登録住宅）は、住宅確保要配慮者の入居を拒まない賃貸住宅として登録されたものである。","登録住宅は、住宅確保要配慮者以外の者に賃貸することは一切できない。","居住サポート住宅は、国土交通大臣が認定する。","居住支援法人は、国土交通大臣が指定する。"],"exp":[{"ok":true,"r":"都道府県等に登録。"},{"ok":false,"r":"要配慮者の入居を拒まないものであり、それ以外の者への賃貸も可能（専用住宅を除く）。"},{"ok":false,"r":"市区町村長等が認定する。"},{"ok":false,"r":"都道府県知事が指定する。"}],"ans":1},{"no":50,"f":"実務・税金・保険","pt":"レバレッジ＝借入で自己資金利回りを高める（逆レバレッジに注意）。","stem":"不動産投資に関する次の記述のうち、最も不適切なものはどれか。","c":["J-REITは、投資法人が投資家から資金を集めて不動産に投資し、賃料収入等を分配する仕組みである。","レバレッジ効果とは、借入金を使わず自己資金のみで投資することで利回りを高める効果をいう。","NOI利回りは、一般に表面利回りより低くなる。","不動産特定共同事業法は、不動産の小口化商品等を取り扱う事業を規制する法律である。"],"exp":[{"ok":true,"r":"上場不動産投資信託。"},{"ok":false,"r":"借入金を利用して自己資金の利回りを高める効果。"},{"ok":true,"r":"運営費用を差し引くため。"},{"ok":true,"r":"許可・登録制。"}],"ans":2}],"mock4":[{"no":1,"f":"管理受託契約","pt":"定期報告・入居者への周知方法・契約期間は、いずれも重要事項。","stem":"管理受託契約重要事項説明の説明事項に関する次の記述のうち、最も適切なものはどれか。","c":["委託者への定期報告に関する事項は、重要事項説明の対象である。","重要事項説明書に記載すべき事項を契約書にすべて記載すれば、重要事項説明書の交付を省略できる。","入居者への対応（管理業務の内容等の周知の方法）は、重要事項説明の対象ではない。","契約期間は、契約締結時書面にのみ記載すれば足り、重要事項説明の対象ではない。"],"exp":[{"ok":true,"r":"報告の内容・頻度は重要事項。"},{"ok":false,"r":"締結前に重要事項説明書を交付して説明する必要がある。"},{"ok":false,"r":"入居者への対応に関する事項も重要事項。"},{"ok":false,"r":"契約期間は重要事項であり、締結時書面の記載事項でもある。"}],"ans":1},{"no":2,"f":"管理受託契約","pt":"IT重説：承諾・事前送付・映像と音声・受領確認・不具合時は中断。","stem":"ITを活用した重要事項説明に関する次の記述のうち、最も不適切なものはどれか。","c":["説明を開始する前に、相手方が重要事項説明書を受け取っていることを確認する必要がある。","説明者と相手方が、図面等の書類や説明の内容を十分に理解できる程度に映像を視認でき、双方の音声を十分に聞き取れる環境が必要である。","相手方がITに不慣れであっても、管理業者が希望すれば必ずIT重説で行うことができる。","説明の途中で映像や音声に不具合が生じた場合は、直ちに説明を中断し、解消してから再開する。"],"exp":[{"ok":true,"r":"事前送付と受領の確認。"},{"ok":true,"r":"IT重説の要件。"},{"ok":false,"r":"相手方の承諾が必要。"},{"ok":true,"r":"不具合のまま続行しない。"}],"ans":3},{"no":3,"f":"管理受託契約","pt":"委任の終了：委任者＝死亡・破産／受任者＝死亡・破産・後見開始。解除は将来効。","stem":"委任契約の解除・終了に関する次の記述のうち、最も適切なものはどれか。","c":["委任の解除には遡及効があり、受任者はすでに処理した事務の報酬も返還しなければならない。","委任者が後見開始の審判を受けたときは、委任は終了する。","受任者の利益（専ら報酬を得ることによるものを除く）をも目的とする委任を委任者が解除したときは、やむを得ない事由がある場合を除き、受任者の損害を賠償しなければならない。","受任者が後見開始の審判を受けても、委任は終了しない。"],"exp":[{"ok":false,"r":"委任の解除は将来に向かってのみ効力を生じる（民法652条・620条）。"},{"ok":false,"r":"委任者の後見開始は終了事由ではない（委任者の死亡・破産は終了事由）。"},{"ok":true,"r":"民法651条2項2号。"},{"ok":false,"r":"受任者の後見開始は委任の終了事由（民法653条3号）。"}],"ans":3},{"no":4,"f":"管理受託契約","pt":"管理業者の義務：重説・書面・再委託禁止・分別管理・証明書・帳簿・標識・定期報告・秘密保持。","stem":"次のうち、賃貸住宅管理業法上、賃貸住宅管理業者（管理受託）に課される義務はいくつあるか。","items":["管理受託契約重要事項説明","誇大広告等の禁止","委託者への定期報告","不当な勧誘等の禁止"],"itemExp":[{"ok":true,"r":"管理業者の義務。"},{"ok":false,"r":"サブリース（特定転貸事業者・勧誘者）の規制。"},{"ok":true,"r":"管理業者の義務。"},{"ok":false,"r":"サブリースの規制。"}],"note":"→ 該当するものは2つ。正解は肢2。","c":["１つ","２つ","３つ","４つ"],"ans":2},{"no":5,"f":"管理受託契約","pt":"家賃の変更など賃貸人の権限に属する事項は、委託者の承諾なく決められない。","stem":"管理業者と入居者・委託者の関係に関する次の記述のうち、最も不適切なものはどれか。","c":["管理業者は、委託者の承諾を得ずに、委託者を拘束する家賃減額の合意を入居者と結ぶことができる。","管理業者は、入居者から苦情を受けた場合、管理受託契約の内容に従って対応する。","管理業者が鍵を保管する場合、紛失や不正使用がないよう適切に管理しなければならない。","管理業者は、委託者に対して善良な管理者の注意義務を負う。"],"exp":[{"ok":false,"r":"委託者の権限に属する事項であり、承諾（代理権）なく合意することはできない。"},{"ok":true,"r":"苦情対応は管理業務の一部となり得る。"},{"ok":true,"r":"鍵の管理は重要な業務。"},{"ok":true,"r":"委任（準委任）の性質から。"}],"ans":1},{"no":6,"f":"管理受託契約","pt":"経営管理士は2021年から国家資格。業務管理者には「登録」が必要。","stem":"賃貸不動産経営管理士に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸不動産経営管理士は、賃貸住宅管理業法の施行に伴い、2021年から国家資格となった。","賃貸不動産経営管理士試験に合格すれば、登録を受けなくても業務管理者となることができる。","賃貸不動産経営管理士の登録には、管理業務の実務経験やそれに代わる講習の修了は不要である。","宅地建物取引士は、指定講習を修了しなくても業務管理者となることができる。"],"exp":[{"ok":true,"r":"業務管理者の要件となる資格として位置付けられた。"},{"ok":false,"r":"登録が必要。"},{"ok":false,"r":"2年以上の実務経験又は講習修了が必要。"},{"ok":false,"r":"指定講習（業務管理者移行講習）の修了が必要。"}],"ans":1},{"no":7,"f":"管理受託契約","pt":"再委託しても、委託者に対する責任は管理業者。","stem":"管理業務の再委託に関する次の記述のうち、最も不適切なものはどれか。","c":["再委託先の選定は、管理業者の責任で行う。","管理受託契約に再委託に関する定めがあれば、管理業務の一部を再委託することができる。","再委託先の故意・過失によって生じた損害について、管理業者には一切責任が生じない。","再委託先が行った業務の不備で委託者に損害が生じた場合、管理業者が委託者に対して責任を負う。"],"exp":[{"ok":true,"r":"委託者との関係では管理業者が責任を負う。"},{"ok":true,"r":"一部の再委託は可能。"},{"ok":false,"r":"管理業者が委託者に対して責任を負う。"},{"ok":true,"r":"再委託しても責任は管理業者。"}],"ans":3},{"no":8,"f":"維持保全・原状回復","pt":"残存価値割合＝（6年－経過年数）÷6。2年なら約2/3。","stem":"入居時に新品だった壁クロスを、入居から2年経過した時点で賃借人の故意により毀損し、張替費用が6万円かかった。「原状回復をめぐるトラブルとガイドライン」の考え方（耐用年数6年・定額法で6年経過時に残存価値1円）による賃借人負担額の目安として、最も適切なものはどれか。","c":["6万円","4万円","3万円","2万円"],"exp":[{"ok":false,"r":"経過年数を考慮していない。"},{"ok":true,"r":"6年で価値がほぼ0になるので、2年経過時点の残存価値は約3分の2。6万円×2/3＝約4万円。"},{"ok":false,"r":"3年経過時点の目安。"},{"ok":false,"r":"4年経過時点の目安。"}],"ans":2},{"no":9,"f":"維持保全・原状回復","pt":"故意・過失・管理不十分＝賃借人。日照・地震・経年＝賃貸人。","stem":"「原状回復をめぐるトラブルとガイドライン」において、賃借人の負担とされるものはいくつあるか。","items":["壁への落書き","鍵の紛失による交換費用","地震で生じた壁のひび割れ","日照によるクロスの変色"],"itemExp":[{"ok":true,"r":"故意による毀損。"},{"ok":true,"r":"賃借人の管理不十分。"},{"ok":false,"r":"自然災害（賃貸人負担）。"},{"ok":false,"r":"通常損耗（賃貸人負担）。"}],"note":"→ 該当するものは2つ。正解は肢2。","c":["１つ","２つ","３つ","４つ"],"ans":2},{"no":10,"f":"建物・設備","pt":"シックハウス規制：ホルムアルデヒド（面積制限）・クロルピリホス（禁止）。増改築にも適用。","stem":"シックハウス対策等に関する次の記述のうち、最も不適切なものはどれか。","c":["シックハウス対策の規制は新築のみが対象で、増改築には適用されない。","シロアリ駆除剤のクロルピリホスを添加した建材は、居室を有する建築物に使用できない。","居室の内装仕上げにホルムアルデヒドを発散する建材を使う場合、発散量の等級に応じて使用面積が制限される。","吹付け石綿など、石綿を飛散させるおそれのある建材の使用は禁止されている。"],"exp":[{"ok":false,"r":"増改築・大規模修繕等にも適用される。"},{"ok":true,"r":"使用禁止。"},{"ok":true,"r":"F☆☆☆☆は制限なし。"},{"ok":true,"r":"建築基準法28条の2。"}],"ans":1},{"no":11,"f":"建物・設備","pt":"帯筋（フープ）＝せん断破壊防止。軟弱地盤は揺れが大きい。","stem":"建物の構造・耐震に関する次の記述のうち、最も適切なものはどれか。","c":["1981年5月以前に建築確認を受けた建物は、すべて耐震性に問題がある。","地震の揺れは、一般に軟弱な地盤より硬い地盤の方が大きくなりやすい。","鉄筋コンクリート造の柱の帯筋（フープ）は、せん断破壊を防ぐ役割を持つ。","耐震改修は、建物の構造を変えない限り行う必要はない。"],"exp":[{"ok":false,"r":"個別の耐震診断で判断する。"},{"ok":false,"r":"軟弱地盤の方が揺れが増幅されやすい。"},{"ok":true,"r":"主筋を囲むように巻く鉄筋。"},{"ok":false,"r":"耐震診断の結果に応じて改修を検討する。"}],"ans":3},{"no":12,"f":"建物・設備","pt":"汚水＝トイレ、雑排水＝台所・浴室・洗面・洗濯、雨水は別系統。","stem":"給排水設備に関する次の記述のうち、最も不適切なものはどれか。","c":["雑排水とは、台所・浴室・洗面所・洗濯機などからの排水をいう。","排水管の勾配が不足すると、排水が滞り詰まりやすくなる。","汚水とは、台所から出る排水をいう。","給水管からの赤水は、鉄管の錆が原因の一つである。"],"exp":[{"ok":true,"r":"トイレ以外の生活排水。"},{"ok":true,"r":"適切な勾配が必要。"},{"ok":false,"r":"汚水はトイレ（便器）からの排水。"},{"ok":true,"r":"配管の更新・更生で対応。"}],"ans":3},{"no":13,"f":"建物・設備","pt":"電気工事は電気工事士。アースは感電防止。","stem":"電気設備に関する次の記述のうち、最も適切なものはどれか。","c":["共同住宅の共用部分の電気料金は、各入居者が直接電力会社と契約して支払う。","電気設備の配線工事は、資格がなくても誰でも行うことができる。","アース（接地）は、感電の防止とは関係がない。","住戸の契約電流（アンペア）を上げる場合、建物全体の受電容量や幹線の確認が必要となることがある。"],"exp":[{"ok":false,"r":"共用部分は通常オーナー（管理者）が契約し、共益費等で賄う。"},{"ok":false,"r":"電気工事士の資格が必要。"},{"ok":false,"r":"漏電時の感電防止のために設ける。"},{"ok":true,"r":"建物側の容量が不足する場合がある。"}],"ans":4},{"no":14,"f":"建物・設備","pt":"ルーフドレンの清掃、防水は10〜15年で改修。","stem":"屋上・防水に関する次の記述のうち、最も不適切なものはどれか。","c":["防水工事は、一度施工すれば建物の寿命まで再施工は不要である。","屋上のルーフドレン（排水口）の詰まりは、雨漏りの原因となる。","防水層の上の押えコンクリートには、伸縮目地が設けられる。","屋上防水には、アスファルト防水、シート防水、ウレタン塗膜防水などの工法がある。"],"exp":[{"ok":false,"r":"10〜15年程度を目安に改修が必要。"},{"ok":true,"r":"落ち葉等の定期清掃が必要。"},{"ok":true,"r":"温度変化による膨張・収縮に対応。"},{"ok":true,"r":"主な防水工法。"}],"ans":1},{"no":15,"f":"建物・設備","pt":"消火器も点検対象。避難経路に物を置かない。","stem":"消防・防火に関する次の記述のうち、最も適切なものはどれか。","c":["防火管理者は、消防計画を作成する必要はない。","避難経路となる共用廊下や階段に物を置くことは、避けるべきである。","消防用設備等の点検・報告の義務は、入居者が負う。","共同住宅に設置した消火器は、点検の対象とはならない。"],"exp":[{"ok":false,"r":"消防計画の作成は防火管理者の主な業務。"},{"ok":true,"r":"避難の妨げになる。"},{"ok":false,"r":"防火対象物の関係者（所有者・管理者・占有者）が負う。実務上は所有者・管理者。"},{"ok":false,"r":"消防用設備等として点検が必要。"}],"ans":2},{"no":16,"f":"維持保全・原状回復","pt":"法定点検は省略不可。点検記録を残す。","stem":"建物の点検に関する次の記述のうち、最も不適切なものはどれか。","c":["点検の結果は記録し、保存しておくことが望ましい。","法定点検は、所有者の判断で省略することができる。","法定点検とは、法令に基づき、有資格者等が定期的に行う点検である。","日常点検とは、管理業者等が建物を巡回して異常の有無を確認するものである。"],"exp":[{"ok":true,"r":"修繕計画や売却時に役立つ。"},{"ok":false,"r":"法令上の義務であり省略できない。"},{"ok":true,"r":"例：消防用設備、昇降機、簡易専用水道。"},{"ok":true,"r":"目視・巡回が中心。"}],"ans":2},{"no":17,"f":"維持保全・原状回復","pt":"入居時の説明・契約書への明記・退去時の立会い・見積りの提示。","stem":"原状回復トラブルの予防に関する次の記述のうち、最も適切なものはどれか。","c":["原状回復費用の見積りは、賃借人に示す必要はない。","入居時に原状回復の負担区分を説明し、契約書に明記しておくことは、トラブル防止に有効である。","退去時の立会いは、トラブル防止の観点から行わない方がよい。","賃借人負担の原状回復工事は、必ず賃借人自身が業者を手配しなければならない。"],"exp":[{"ok":false,"r":"内訳を示して説明することが望ましい。"},{"ok":true,"r":"ガイドラインが推奨。"},{"ok":false,"r":"双方で確認するため立会いが望ましい。"},{"ok":false,"r":"一般には賃貸人側が手配し、費用を精算する。"}],"ans":2},{"no":18,"f":"金銭管理・会計","pt":"遅延損害金：約定がなければ法定利率。消費者契約は年14.6％が上限。","stem":"賃料の遅延損害金に関する次の記述のうち、最も不適切なものはどれか。","c":["消費者契約である賃貸借で、遅延損害金のうち年14.6％を超える部分は無効となる。","遅延損害金の利率は、特約で定めることができる。","遅延損害金は、約定がなければ一切請求することができない。","支払期日が決まっている賃料は、期日を過ぎれば請求がなくても履行遅滞となる。"],"exp":[{"ok":true,"r":"消費者契約法9条2号。"},{"ok":true,"r":"約定利率。"},{"ok":false,"r":"約定がなくても法定利率により請求できる。"},{"ok":true,"r":"確定期限のある債務。"}],"ans":3},{"no":19,"f":"金銭管理・会計","pt":"支払督促は公示送達不可。少額訴訟は即時取調べの証拠のみ・控訴不可・年10回まで。","stem":"簡易な法的手続に関する次の記述のうち、最も適切なものはどれか。","c":["少額訴訟は、同一の簡易裁判所で年に何回でも利用できる。","支払督促は、債務者の住所が不明でも、公示送達により手続を進めることができる。","少額訴訟の判決に不服がある場合は、地方裁判所に控訴できる。","少額訴訟では、証拠調べは即時に取り調べることができる証拠に限られる。"],"exp":[{"ok":false,"r":"年10回まで。"},{"ok":false,"r":"支払督促は公示送達によることができない。"},{"ok":false,"r":"控訴はできず、同じ簡易裁判所への異議申立てのみ。"},{"ok":true,"r":"1回の期日で審理を終えるため。"}],"ans":4},{"no":20,"f":"金銭管理・会計","pt":"保証人死亡：それまでの債務は相続、その後の債務は負わない。","stem":"個人根保証と相続に関する次の記述のうち、最も不適切なものはどれか。","c":["保証人の死亡により元本が確定した時点までに生じていた債務は、相続人が承継する。","保証人が死亡すると元本は確定し、相続人はその後に生じた賃料債務について保証債務を負わない。","個人根保証の極度額は、書面（又は電磁的記録）に定めなければ効力を生じない。","法人が保証人となる場合も、個人保証と同様に極度額の定めが必須である。"],"exp":[{"ok":true,"r":"確定済みの保証債務は相続される。"},{"ok":true,"r":"民法465条の4。"},{"ok":true,"r":"民法465条の2。"},{"ok":false,"r":"極度額の規制は個人根保証のみ。"}],"ans":4},{"no":21,"f":"金銭管理・会計","pt":"発生主義。土地は減価償却しない。修繕費と資本的支出を区別。","stem":"会計の考え方に関する次の記述のうち、最も適切なものはどれか。","c":["企業会計では、現金主義が原則とされている。","発生主義では、家賃は入金の時期ではなく、その家賃が対応する期間に収益として計上する。","修繕費と資本的支出は、会計上区別する必要はない。","減価償却は、土地についても行う。"],"exp":[{"ok":false,"r":"発生主義が原則。"},{"ok":true,"r":"企業会計の原則。"},{"ok":false,"r":"資本的支出は資産計上して減価償却する。"},{"ok":false,"r":"土地は減価しないため償却しない。"}],"ans":2},{"no":22,"f":"賃貸借契約","pt":"賃借権に基づく妨害停止・返還請求には対抗要件が必要。","stem":"賃借権の対抗力・妨害排除に関する次の記述のうち、最も不適切なものはどれか。","c":["対抗要件を備えた建物の賃借人は、建物を占有する第三者に対して返還を請求できる。","対抗要件を備えた建物の賃借人は、占有を妨害する第三者に対して妨害の停止を請求できる。","同一の建物について二重に賃貸借契約が結ばれた場合、先に引渡しを受けた賃借人が優先する。","対抗要件を備えていない賃借人でも、賃借権に基づいて不法占拠者に妨害排除を常に請求できる。"],"exp":[{"ok":true,"r":"民法605条の4。"},{"ok":true,"r":"民法605条の4。"},{"ok":true,"r":"対抗要件（引渡し）の先後で決まる。"},{"ok":false,"r":"賃借権に基づく妨害排除・返還請求は対抗要件を備えた場合に認められる。"}],"ans":4},{"no":23,"f":"賃貸借契約","pt":"増減額請求：経済事情の変動・近傍同種との比較等で不相当になったとき。方式・時期の制限なし。","stem":"賃料増額請求に関する次の記述のうち、最も適切なものはどれか。","c":["一定期間増額しない旨の特約があっても、その期間中に増額請求ができる。","賃料増額請求は、契約の更新時にしかすることができない。","賃料増額請求は、書面でしなければ効力を生じない。","近傍同種の建物の賃料と比較して不相当となったときは、賃料の増額を請求できる。"],"exp":[{"ok":false,"r":"不増額特約は有効で、その期間中は増額請求できない。"},{"ok":false,"r":"要件を満たせば期間中でも請求できる。"},{"ok":false,"r":"方式の定めはない（実務上は内容証明等）。"},{"ok":true,"r":"借地借家法32条1項の要件の一つ。"}],"ans":4},{"no":24,"f":"賃貸借契約","pt":"モデル条項の対象は主に60歳以上の単身者。受任者は推定相続人・居住支援法人・管理業者等。","stem":"「残置物の処理等に関するモデル契約条項」に関する次の記述のうち、最も不適切なものはどれか。","c":["モデル契約条項は、賃借人の年齢や世帯構成を問わず、すべての賃貸借で使用することが推奨されている。","受任者としては、推定相続人のいずれか、又は居住支援法人・管理業者等の第三者が想定されている。","残置物事務受任者は、賃借人が指定した残置物（形見等）を指定された送付先に送付する。","解除事務受任者は、賃借人が死亡した場合に、賃貸借契約を合意解除する代理権を有する。"],"exp":[{"ok":false,"r":"主に60歳以上の単身者等の入居を想定したもの。"},{"ok":true,"r":"賃貸人は利益相反のため避ける。"},{"ok":true,"r":"指定残置物の取扱い。"},{"ok":true,"r":"賃貸借の解除に関する委任。"}],"ans":1},{"no":25,"f":"賃貸借契約","pt":"定期借家：書面契約、締結前の事前説明（電磁的方法は承諾要）、1年未満も可。","stem":"定期建物賃貸借に関する次の記述のうち、最も適切なものはどれか。","c":["定期建物賃貸借の期間は、1年以上でなければならない。","定期建物賃貸借契約は、口頭の合意で成立する。","事前説明は、契約締結後に行ってもよい。","事前説明書面を電磁的方法で提供するには、賃借人の承諾が必要である。"],"exp":[{"ok":false,"r":"1年未満でも有効。"},{"ok":false,"r":"書面（又は電磁的記録）が必要。"},{"ok":false,"r":"契約締結前に行う。"},{"ok":true,"r":"2022年5月施行の改正による。"}],"ans":4},{"no":26,"f":"賃貸借契約","pt":"必要費＝直ちに、有益費＝終了時。いずれも返還から1年以内。","stem":"修繕と費用償還に関する次の記述のうち、最も不適切なものはどれか。","c":["必要費の償還は、賃貸借契約の終了時まで請求することができない。","賃借人の費用償還請求は、賃貸人が返還を受けた時から1年以内にしなければならない。","賃借人が自ら必要な修繕をした場合、賃貸人に必要費の償還を請求できる。","雨漏りの修繕は、原則として賃貸人の義務である。"],"exp":[{"ok":false,"r":"必要費は直ちに請求できる（有益費は終了時）。"},{"ok":true,"r":"民法622条・600条。"},{"ok":true,"r":"民法608条1項。"},{"ok":true,"r":"民法606条。"}],"ans":1},{"no":27,"f":"賃貸借契約","pt":"既発生の未払賃料は当然には移転しない。敷金は新所有者へ。","stem":"オーナーチェンジに関する次の記述のうち、最も適切なものはどれか。","c":["新所有者が賃貸人たる地位を承継した場合、旧所有者が有していた未払賃料債権も当然に新所有者に移転する。","新所有者は、地位の承継を賃借人に通知しなければ、登記があっても賃料を請求できない。","新所有者は、所有権移転登記をすれば、地位の承継後に発生する賃料を賃借人に請求できる。","賃借人は、敷金の返還を旧所有者に請求しなければならない。"],"exp":[{"ok":false,"r":"既に発生した未払賃料債権は当然には移転しない（別途、債権譲渡が必要）。"},{"ok":false,"r":"対抗要件は所有権移転登記。"},{"ok":true,"r":"民法605条の2第3項。"},{"ok":false,"r":"敷金返還債務は新所有者に承継される。"}],"ans":3},{"no":28,"f":"賃貸借契約","pt":"転借人は賃貸人に「義務」は負うが「権利」は持たない（修繕請求は転貸人へ）。","stem":"転貸借における当事者の関係に関する次の記述のうち、最も不適切なものはどれか。","c":["転貸借は、原賃貸借が終了すると、その終了原因に応じて影響を受ける。","適法な転貸借の転借人は、賃貸人に対して直接修繕を請求することができる。","転借人は、賃貸人に対して目的物の保管について善管注意義務を負う。","適法な転貸借の場合、賃貸人は転借人に対して賃料を直接請求できる。"],"exp":[{"ok":true,"r":"合意解除・債務不履行解除・期間満了で扱いが異なる。"},{"ok":false,"r":"転借人は賃貸人に直接義務を負うが、賃貸人に対する権利（修繕請求等）は取得しない。"},{"ok":true,"r":"民法613条1項（直接の義務）。"},{"ok":true,"r":"民法613条1項。"}],"ans":2},{"no":29,"f":"賃貸借契約","pt":"正当事由は双方の事情の比較。立退料は補完要素で引換えに支払うことが多い。","stem":"正当事由と立退料に関する次の記述のうち、最も適切なものはどれか。","c":["賃借人が他に住居を持っているかどうかは、建物使用の必要性の判断に関係しない。","立退料の提供は、正当事由の判断において一切考慮されない。","立退料は、実務上、建物の明渡しと引換えに支払われることが多い。","正当事由は、賃貸人側の事情のみで判断される。"],"exp":[{"ok":false,"r":"使用の必要性の判断に影響する。"},{"ok":false,"r":"補完的な要素として考慮される。"},{"ok":true,"r":"引換給付。"},{"ok":false,"r":"双方の事情を比較して判断する。"}],"ans":3},{"no":30,"f":"賃貸借契約","pt":"用法違反でも解除には信頼関係の破壊が必要。民泊の届出には賃貸人の承諾書が必要。","stem":"用法違反・無断民泊に関する次の記述のうち、最も不適切なものはどれか。","c":["用法違反があれば、信頼関係が破壊されていなくても常に契約を解除できる。","賃借人が賃貸人に無断で住宅宿泊事業（民泊）を行うことは、解除事由となり得る。","契約で禁止されたペットを飼育することは、用法違反として解除事由となり得る。","賃借人が住宅宿泊事業の届出をする場合、賃貸人が転貸を承諾していることを証する書類が必要である。"],"exp":[{"ok":false,"r":"信頼関係を破壊する程度に至っていることが必要。"},{"ok":true,"r":"無断転貸・用法違反に当たり得る。"},{"ok":true,"r":"信頼関係の破壊があれば解除可。"},{"ok":true,"r":"届出時に確認される。"}],"ans":1},{"no":31,"f":"賃貸借契約","pt":"賃借人に不利な特約は無効。例外として造作買取請求権の排除特約は有効。","stem":"借地借家法の強行規定性に関する次の記述のうち、最も適切なものはどれか。","c":["更新拒絶に正当事由を不要とする特約は有効である。","造作買取請求権を排除する特約は無効である。","賃貸人に有利な特約は、借地借家法に反していてもすべて有効である。","借家に関する規定に反する特約でも、賃借人に有利なものは有効である。"],"exp":[{"ok":false,"r":"賃借人に不利で無効。"},{"ok":false,"r":"有効（借地借家法37条の対象外）。"},{"ok":false,"r":"賃借人に不利な特約は無効。"},{"ok":true,"r":"片面的強行規定。"}],"ans":4},{"no":32,"f":"賃貸住宅管理業法","pt":"敷金も金銭管理・分別管理の対象。","stem":"金銭管理業務・分別管理に関する次の記述のうち、最も不適切なものはどれか。","c":["敷金は賃貸人が返還義務を負うものなので、管理業者が受領・管理することはできない。","金銭管理を行う場合、家賃等を固有財産と分別して管理しなければならない。","金銭管理業務には、家賃・敷金・共益費などの受領が含まれる。","維持保全を行わず金銭管理のみを行う業務は、管理業務に該当しない。"],"exp":[{"ok":false,"r":"敷金も管理業者が受領・管理することができ、分別管理の対象となる。"},{"ok":true,"r":"法16条。"},{"ok":true,"r":"受領・管理する業務。"},{"ok":true,"r":"維持保全と併せて行う場合のみ該当。"}],"ans":1},{"no":33,"f":"賃貸住宅管理業法","pt":"登録事項の変更はすべて30日以内に届出（事前許可ではない）。","stem":"登録事項の変更の届出に関する次の記述のうち、最も適切なものはどれか。","c":["商号を変更した場合でも、届出は不要である。","営業所又は事務所を新設した場合は、その日から30日以内に届け出なければならない。","法人の役員が変更した場合は、90日以内に届け出ればよい。","営業所の新設には、事前に国土交通大臣の許可が必要である。"],"exp":[{"ok":false,"r":"30日以内に届出が必要。"},{"ok":true,"r":"営業所の名称・所在地は登録事項。"},{"ok":false,"r":"30日以内。"},{"ok":false,"r":"事後の届出（30日以内）。"}],"ans":2},{"no":34,"f":"賃貸住宅管理業法","pt":"役員の欠格・暴力団の支配・業務管理者を選任できない→登録拒否。資本金要件はない。","stem":"次のうち、法人が賃貸住宅管理業の登録を拒否される事由に該当するものはいくつあるか。","items":["役員のうちに、拘禁刑の執行を終えた日から5年を経過しない者がいる","暴力団員等がその事業活動を支配している","営業所又は事務所ごとに業務管理者を確実に選任すると認められない","資本金の額が1億円未満である"],"itemExp":[{"ok":true,"r":"該当する。"},{"ok":true,"r":"該当する。"},{"ok":true,"r":"該当する。"},{"ok":false,"r":"資本金の額は登録の要件ではない（財産的基礎は負債と資産の比較等）。"}],"note":"→ 該当するものは3つ。正解は肢3。","c":["１つ","２つ","３つ","４つ"],"ans":3},{"no":35,"f":"賃貸住宅管理業法","pt":"標識・証明書・帳簿も違反すれば監督処分・罰則の対象。","stem":"標識・従業者証明書に関する次の記述のうち、最も不適切なものはどれか。","c":["標識には、登録番号などを記載する。","従業者証明書の携帯義務に違反しても、監督処分の対象とはならない。","従業者証明書は、取引の関係者から請求があったときは提示しなければならない。","標識は、営業所又は事務所ごとに、公衆の見やすい場所に掲げる。"],"exp":[{"ok":true,"r":"様式が定められている。"},{"ok":false,"r":"法令違反として監督処分の対象となる（罰則もある）。"},{"ok":true,"r":"法17条2項。"},{"ok":true,"r":"法19条。"}],"ans":2},{"no":36,"f":"賃貸住宅管理業法","pt":"定期報告にはプロ相手の例外もない。苦情は対応済みでも報告。","stem":"定期報告に関する次の記述のうち、最も適切なものはどれか。","c":["委託者が法人の場合は、定期報告は不要である。","定期報告では、入居者からの苦情の発生状況及び対応状況も報告する。","定期報告は、口頭でのみ行わなければならない。","入居者の苦情に管理業者が対応済みであれば、その苦情は報告しなくてよい。"],"exp":[{"ok":false,"r":"委託者の属性を問わず必要（プロ相手の例外はない）。"},{"ok":true,"r":"報告事項。"},{"ok":false,"r":"管理業務報告書を交付して説明する。"},{"ok":false,"r":"発生状況と対応状況を報告する。"}],"ans":2},{"no":37,"f":"賃貸住宅管理業法","pt":"登録取消しの欠格は役員にも及ぶ（5年）。","stem":"監督処分・登録取消しに関する次の記述のうち、最も不適切なものはどれか。","c":["登録を取り消された法人の役員であった者は、個人としては直ちに登録を受けることができる。","不正の手段により登録を受けた場合、登録が取り消される。","業務停止命令に違反した場合、登録が取り消されることがある。","国土交通大臣は、監督処分をしたときは、その旨を公告する。"],"exp":[{"ok":false,"r":"取消し前の一定期間内に役員であった者は、取消しから5年間登録を受けられない。"},{"ok":true,"r":"必要的取消し事由。"},{"ok":true,"r":"取消し事由。"},{"ok":true,"r":"公告される。"}],"ans":1},{"no":38,"f":"賃貸住宅管理業法","pt":"経営管理士（業務管理者）の役割は管理・監督。宅建業の重説や訴訟代理はできない。","stem":"業務管理者・賃貸不動産経営管理士の役割に関する次の記述のうち、最も適切なものはどれか。","c":["賃貸不動産経営管理士は、オーナーの代理人として報酬を得て訴訟を提起できる。","賃貸不動産経営管理士は、宅地建物取引業の重要事項説明を行うことができる。","賃貸不動産経営管理士は、業務管理者として、営業所における管理業務の管理・監督を担う。","賃貸不動産経営管理士は、登録を受けなくても業務管理者として選任できる。"],"exp":[{"ok":false,"r":"非弁行為に当たり得る。"},{"ok":false,"r":"宅建業の重説は宅建士の業務。"},{"ok":true,"r":"業務管理者の役割。"},{"ok":false,"r":"登録が必要。"}],"ans":3},{"no":39,"f":"サブリース（特定賃貸借）","pt":"誇大広告の対象：家賃（免責期間含む）・維持保全・費用負担・解除。勧誘者の広告も対象。","stem":"誇大広告等の禁止に関する次の記述のうち、最も不適切なものはどれか。","c":["特定賃貸借契約の解除に関する事項は、誇大広告等の規制の対象となる事項である。","誇大広告等の規制は、特定転貸事業者が自社名で出す広告に限られ、勧誘者が出す広告は対象外である。","家賃支払の免責期間は、誇大広告等の規制の対象となる事項である。","維持保全の内容は、誇大広告等の規制の対象となる事項である。"],"exp":[{"ok":true,"r":"対象事項。"},{"ok":false,"r":"勧誘者の広告も対象。"},{"ok":true,"r":"家賃に関する事項。"},{"ok":true,"r":"対象事項。"}],"ans":2},{"no":40,"f":"サブリース（特定賃貸借）","pt":"同一内容の更新は不要、重要事項の変更は変更部分の説明が必要（有利・不利を問わない）。","stem":"特定賃貸借契約の変更・更新時の重要事項説明に関する次の記述のうち、最も適切なものはどれか。","c":["家賃を増額する変更であれば、オーナーに有利なので説明は不要である。","重要事項説明は、説明のみ行えば足り、書面の交付は不要である。","契約内容に変更がない更新であっても、必ず改めて重要事項説明が必要である。","契約期間中に家賃など重要事項を変更する場合は、変更する事項について説明が必要である。"],"exp":[{"ok":false,"r":"重要事項の変更であれば説明が必要。"},{"ok":false,"r":"書面（又は承諾を得て電磁的方法）の交付が必要。"},{"ok":false,"r":"従前と同一内容で期間のみ延長する場合は不要。"},{"ok":true,"r":"変更部分の説明が必要。"}],"ans":4},{"no":41,"f":"サブリース（特定賃貸借）","pt":"社宅の借上げ・親族や子会社の借上げは特定賃貸借に該当しない。","stem":"次のうち、特定賃貸借契約に該当するものはいくつあるか。","items":["不動産会社がオーナーから賃貸住宅を借り上げ、個人の入居者に転貸する契約","オーナー（法人）の子会社がオーナーから賃貸住宅を借り上げ、入居者に転貸する契約","企業が社宅として賃貸住宅を借り上げ、自社の従業員を入居させて使用料を徴収する契約","管理会社がオーナーから賃貸住宅を借り上げ、学生向けに転貸する契約"],"itemExp":[{"ok":true,"r":"該当する。"},{"ok":false,"r":"賃貸人と密接な関係にある者（子会社等）が借りる場合は除かれる。"},{"ok":false,"r":"転貸事業を目的とするものではなく、該当しない。"},{"ok":true,"r":"該当する。"}],"note":"→ 該当するものは2つ。正解は肢2。","c":["１つ","２つ","３つ","４つ"],"ans":2},{"no":42,"f":"サブリース（特定賃貸借）","pt":"重説書面は締結「前」に交付。","stem":"特定賃貸借契約重要事項説明の方法に関する次の記述のうち、最も不適切なものはどれか。","c":["重要事項説明は、一定の要件を満たせばITを活用して行うことができる。","重要事項説明は、特定転貸事業者の従業員が行うことができる。","重要事項説明書の交付は、契約締結後に行えばよい。","相手方の知識や経験に応じて、理解できるよう説明することが望ましい。"],"exp":[{"ok":true,"r":"IT重説可。"},{"ok":true,"r":"説明者の資格制限はない。"},{"ok":false,"r":"締結前に交付して説明する。"},{"ok":true,"r":"ガイドラインの考え方。"}],"ans":3},{"no":43,"f":"サブリース（特定賃貸借）","pt":"オーナーの解約申入れには正当事由が必要（中途解約条項があっても）。","stem":"マスターリース契約の解約・違約金に関する次の記述のうち、最も適切なものはどれか。","c":["オーナーからの中途解約を認める条項があっても、オーナーが解約を申し入れるには借地借家法上の正当事由が必要と解される。","中途解約の条件は、重要事項説明の対象ではない。","サブリース業者からの中途解約を認める条項を設けることは、法律で禁止されている。","中途解約時の違約金条項は、一切無効である。"],"exp":[{"ok":true,"r":"借地借家法28条（賃借人＝サブリース業者の保護）。"},{"ok":false,"r":"契約の解除に関する事項として説明が必要。"},{"ok":false,"r":"禁止されていない（重要事項として説明が必要）。"},{"ok":false,"r":"一律に無効ではない。"}],"ans":1},{"no":44,"f":"サブリース（特定賃貸借）","pt":"サブリース業者：オーナーには借主、入居者には貸主。特定賃貸借の重説の相手はオーナー。","stem":"特定転貸事業者の立場・義務に関する次の記述のうち、最も不適切なものはどれか。","c":["賃貸住宅管理業の登録を受けていない特定転貸事業者にも、サブリース規制は適用される。","特定転貸事業者は、入居者（転借人）に対して、特定賃貸借契約重要事項説明の義務を負う。","特定転貸事業者は、オーナーとの関係では賃借人の立場にある。","特定転貸事業者が200戸以上の賃貸住宅で管理業務を行う場合、賃貸住宅管理業の登録が必要である。"],"exp":[{"ok":true,"r":"登録の有無を問わない。"},{"ok":false,"r":"特定賃貸借の重説はオーナーに対するもの。"},{"ok":true,"r":"マスターリースの借主。"},{"ok":true,"r":"サブリース業者も登録が必要。"}],"ans":2},{"no":45,"f":"サブリース（特定賃貸借）","pt":"サブリースの監督：報告徴収・立入検査、指示、業務停止（1年以内）、公表。","stem":"特定転貸事業者に対する監督に関する次の記述のうち、最も適切なものはどれか。","c":["業務停止命令の期間は、最長3年である。","指示処分をしても、その旨は公表されない。","指示に従わなかった場合でも、業務停止命令の対象とはならない。","国土交通大臣は、特定転貸事業者に報告を求め、事務所に立ち入って検査させることができる。"],"exp":[{"ok":false,"r":"1年以内。"},{"ok":false,"r":"公表される。"},{"ok":false,"r":"指示違反は業務停止命令の対象となり得る。"},{"ok":true,"r":"報告徴収・立入検査。"}],"ans":4},{"no":46,"f":"実務・税金・保険","pt":"相続税の申告は10か月以内（準確定申告は4か月以内）。","stem":"相続税に関する次の記述のうち、最も不適切なものはどれか。","c":["貸付事業用宅地等は、200㎡まで評価額が50％減額される。","配偶者は、1億6,000万円又は法定相続分相当額のいずれか多い金額まで相続税がかからない。","賃貸アパートを建築すると、土地が貸家建付地、建物が貸家として評価され、相続税評価額が下がる場合がある。","相続税の申告期限は、相続の開始を知った日の翌日から6か月以内である。"],"exp":[{"ok":true,"r":"小規模宅地等の特例。"},{"ok":true,"r":"配偶者の税額軽減。"},{"ok":true,"r":"相続税対策の仕組み。"},{"ok":false,"r":"10か月以内。"}],"ans":4},{"no":47,"f":"実務・税金・保険","pt":"長期＝1月1日時点で5年超。分離課税。3,000万円控除は自宅のみ。","stem":"不動産の譲渡所得に関する次の記述のうち、最も適切なものはどれか。","c":["居住用財産の3,000万円特別控除は、賃貸物件の譲渡にも適用される。","土地・建物の譲渡所得は、譲渡した年の1月1日における所有期間が5年を超えると長期譲渡所得となる。","不動産の譲渡所得は、他の所得と合算して総合課税される。","短期譲渡所得の税率は、長期譲渡所得の税率より低い。"],"exp":[{"ok":false,"r":"自己の居住用財産のみ。"},{"ok":true,"r":"長期・短期の区分。"},{"ok":false,"r":"分離課税。"},{"ok":false,"r":"短期の方が高い（約39％、長期は約20％）。"}],"ans":2},{"no":48,"f":"実務・税金・保険","pt":"建物賃貸借＝非課税、土地賃貸借＝課税。印紙がなくても契約は有効。","stem":"印紙税に関する次の記述のうち、最も不適切なものはどれか。","c":["建物の賃貸借契約書は、印紙税の課税文書に該当しない。","土地の賃借権の設定に関する契約書は、印紙税の課税文書に該当する。","印紙税の納税義務者は、契約書を作成しなかった者である。","印紙を貼らなくても、契約そのものは有効である。"],"exp":[{"ok":true,"r":"非課税。"},{"ok":true,"r":"課税文書。"},{"ok":false,"r":"課税文書の作成者が納税義務者。"},{"ok":true,"r":"過怠税の問題になるだけ。"}],"ans":3},{"no":49,"f":"実務・税金・保険","pt":"合理的配慮：民間も義務（2024年4月〜）、ただし過重な負担とならない範囲。","stem":"障害者差別解消法に関する次の記述のうち、最も適切なものはどれか。","c":["民間事業者による障害者への合理的配慮の提供は、2024年4月から法的義務となった。","障害を理由に一律に入居を断ることは、差別に当たらない。","合理的配慮の提供は、行政機関のみに義務付けられている。","合理的配慮は、事業者にとって過重な負担となる場合でも、必ず提供しなければならない。"],"exp":[{"ok":true,"r":"改正法の施行。"},{"ok":false,"r":"不当な差別的取扱いに当たり得る。"},{"ok":false,"r":"民間事業者も義務。"},{"ok":false,"r":"過重な負担とならない範囲で提供する。"}],"ans":1},{"no":50,"f":"実務・税金・保険","pt":"直接還元法＝NOI÷還元利回り、DCF法＝将来CFの現在価値の合計。","stem":"不動産の価格の求め方に関する次の記述のうち、最も不適切なものはどれか。","c":["取引事例比較法は、多数の取引事例を収集し、比較して価格を求める方法である。","原価法は、再調達原価を求め、これに減価修正を行って価格を求める方法である。","収益還元法は、対象不動産が将来生み出す収益から価格を求める方法である。","直接還元法は、複数の期間の純収益と復帰価格を現在価値に割り引いて合計する方法である。"],"exp":[{"ok":true,"r":"比準価格。"},{"ok":true,"r":"積算価格。"},{"ok":true,"r":"収益価格。"},{"ok":false,"r":"それはDCF法。直接還元法は一期間の純収益を還元利回りで割る方法。"}],"ans":4}],"review":[{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"管理受託契約重要事項説明は、管理業者の従業者であれば、宅地建物取引士でなくても行うことができる。","a":true,"fact":"説明者の資格は法定されていない（業務管理者の管理・監督の下で行う）。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"重要事項説明をしないで締結した管理受託契約は、民事上当然に無効となる。","a":false,"fact":"契約自体は当然には無効にならない。業法違反として監督処分の対象となる。","trap":""},{"f":"賃貸住宅管理業法","k":"定義","q":"賃貸住宅管理業とは、賃貸住宅の賃貸人から委託を受けて管理業務を行う事業をいう。","a":true,"fact":"委託を受けて行うことが要件。自己所有物件の管理は該当しない。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"更新の申請をせずに有効期間（5年）が満了すると、登録は効力を失う。","a":true,"fact":"更新申請は満了の90日前〜30日前。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"法人の役員に登録拒否事由に該当する者がいる場合、その法人は登録を拒否される。","a":true,"fact":"役員の欠格は法人の登録拒否事由。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"拘禁刑に処せられた者は、刑の執行を終えた日から3年を経過すれば登録を受けることができる。","a":false,"fact":"5年を経過しなければ登録を受けられない。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者は登録申請時に選任すれば足り、その後欠けても新たに選任する必要はない。","a":false,"fact":"欠けた場合は新たに選任するまで管理受託契約を締結できない。常に営業所ごとに1人以上必要。","trap":""},{"f":"賃貸住宅管理業法","k":"書面","q":"管理受託契約締結時書面は、委託者の承諾があっても、電子メールで提供することはできない。","a":false,"fact":"委託者の承諾があれば電磁的方法で提供できる。","trap":""},{"f":"賃貸住宅管理業法","k":"再委託","q":"管理業務の一部を再委託する場合、再委託先は賃貸住宅管理業の登録を受けた者でなければならない。","a":false,"fact":"再委託先が登録業者である必要はない。ただし全部の再委託は禁止で、責任は委託を受けた管理業者が負う。","trap":""},{"f":"賃貸住宅管理業法","k":"分別管理","q":"家賃等を管理する口座は、管理受託契約ごとに必ず別々に設けなければならない。","a":false,"fact":"口座は1つでもよい。帳簿等で委託者ごとに区分して管理する。","trap":""},{"f":"賃貸住宅管理業法","k":"従業者証明書","q":"従業者証明書は、取引の関係者から請求があっても提示する義務はない。","a":false,"fact":"関係者から請求があれば提示しなければならない。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"管理業務報告書の説明は、一定の要件を満たせばテレビ会議等のITを活用して行うことができる。","a":true,"fact":"書面（又は電磁的方法）を交付したうえで、ITによる説明も可能。","trap":""},{"f":"賃貸住宅管理業法","k":"秘密保持","q":"賃貸住宅管理業者は、管理業を営まなくなった後は、秘密保持義務を負わない。","a":false,"fact":"管理業者でなくなった後も、従業者でなくなった後も秘密保持義務を負う。","trap":""},{"f":"賃貸住宅管理業法","k":"監督","q":"国土交通大臣は、賃貸住宅管理業者に報告を求め、営業所に立ち入って検査させることができる。","a":true,"fact":"報告徴収・立入検査の権限がある。","trap":""},{"f":"賃貸住宅管理業法","k":"罰則","q":"従業者が業務に関して違反行為をした場合、行為者のほか法人にも罰金刑が科されることがある。","a":true,"fact":"両罰規定。","trap":""},{"f":"賃貸住宅管理業法","k":"定義","q":"賃貸人のために維持保全に係る契約の締結の媒介・取次ぎ・代理を行う業務も、維持保全を行う業務に含まれる。","a":true,"fact":"修繕業者の手配などが該当する。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"説明から契約締結まで1週間程度空けられない場合は、事前に書面を送付するなど、相手方が十分に理解できるよう配慮することが望ましい。","a":true,"fact":"相手方が内容を理解したうえで契約できるようにするため。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"定期報告は委託者（賃貸人）に対して行うもので、入居者に報告する義務はない。","a":true,"fact":"報告の相手方は委託者。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"自ら所有する賃貸住宅を自ら管理している戸数も、登録義務の判定（200戸）に含める。","a":false,"fact":"委託を受けて管理する戸数で判定する。自己所有物件の管理は賃貸住宅管理業に当たらない。","trap":""},{"f":"賃貸住宅管理業法","k":"名義貸し","q":"名義貸しの禁止には、他人に自己の名義で賃貸住宅管理業を営む旨の表示や広告をさせることも含まれる。","a":true,"fact":"法11条2項。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定転貸事業者が入居者（転借人）と締結する転貸借契約にも、特定賃貸借契約重要事項説明が必要である。","a":false,"fact":"特定賃貸借契約重要事項説明はオーナーとの契約が対象。入居者との転貸借は宅建業法等の問題。","trap":""},{"f":"サブリース（特定賃貸借）","k":"勧誘","q":"勧誘時に用いる資料に家賃減額のリスクを記載しないことは、誇大広告等や不当勧誘に当たり得る。","a":true,"fact":"重要なリスクの不表示・不告知は規制対象になり得る。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"相手方のオーナーが不動産賃貸の経験が豊富な個人であれば、重要事項説明を省略できる。","a":false,"fact":"省略できるのは管理業者・宅建業者等の一定のプロのみ。個人オーナーは経験を問わず必要。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定賃貸借契約重要事項説明は、締結時書面の交付と同時に行えば足りる。","a":false,"fact":"契約締結「前」に行う必要がある。","trap":""},{"f":"サブリース（特定賃貸借）","k":"書類閲覧","q":"特定転貸事業者は、業務及び財産の状況を記載した書類を営業所に備え置き、相手方等の求めに応じて閲覧させなければならない。","a":true,"fact":"法32条。","trap":""},{"f":"サブリース（特定賃貸借）","k":"不当勧誘","q":"相手方を長時間拘束するなど、迷惑を覚えさせるような方法で勧誘することは禁止されている。","a":true,"fact":"迷惑を覚えさせる勧誘の禁止。","trap":""},{"f":"サブリース（特定賃貸借）","k":"不当勧誘","q":"「家賃が減額されることは一切ない」と告げて勧誘することは、不実告知に当たり得る。","a":true,"fact":"借地借家法32条により減額はあり得るため。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"サブリース業者の家賃減額請求は、オーナーが承諾しなければ効力を生じない。","a":false,"fact":"増減額請求は形成権。相当な額の範囲で請求時から効力が生じる（争いは調停・裁判で確定）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"サブリース業者から減額請求を受けたオーナーは、裁判確定までは相当と認める額の家賃を請求できる。","a":true,"fact":"借地借家法32条3項。","trap":""},{"f":"サブリース（特定賃貸借）","k":"誇大広告","q":"「空室保証」と表示する場合、家賃支払の免責期間があるなら、その旨も表示しないと誇大広告となり得る。","a":true,"fact":"免責期間を隠すと誤認を招く。","trap":""},{"f":"サブリース（特定賃貸借）","k":"監督","q":"特定転貸事業者が業務停止命令に違反した場合、罰則の対象となる。","a":true,"fact":"業務停止命令違反には罰則がある。","trap":""},{"f":"サブリース（特定賃貸借）","k":"監督","q":"国土交通大臣は、勧誘者に対しても指示や勧誘停止の命令をすることができる。","a":true,"fact":"勧誘者も監督処分の対象。","trap":""},{"f":"サブリース（特定賃貸借）","k":"書面","q":"特定賃貸借契約の重要事項説明書と締結時書面は、別個の書面として交付する必要がある。","a":true,"fact":"一体化は不可（締結時書面は契約書との兼用は可）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"特定賃貸借契約は、オーナー（賃貸人）と特定転貸事業者（賃借人）との間の賃貸借契約である。","a":true,"fact":"いわゆるマスターリース契約。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"維持保全をオーナー自らが行う内容の契約は、特定賃貸借契約に該当しない。","a":false,"fact":"転貸事業を目的とする賃貸借であれば、維持保全を誰が行うかに関係なく該当する。","trap":""},{"f":"サブリース（特定賃貸借）","k":"施行時期","q":"サブリース規制は、賃貸住宅管理業の登録制度よりも後に施行された。","a":false,"fact":"サブリース規制は2020年12月、登録制度は2021年6月の施行。サブリース規制が先。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃貸人の義務","q":"賃貸人は、賃借人が賃借物を使用収益できる状態に置く義務までは負わない。","a":false,"fact":"賃貸人は使用収益させる義務を負う（修繕義務もその一環）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料","q":"賃料を前払いとする特約は有効である。","a":true,"fact":"民法614条の後払いは任意規定。実務では前月末払いが一般的。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"自力救済","q":"賃料を滞納している賃借人の室内に、承諾なく入って家財を搬出することは許されない。","a":true,"fact":"自力救済の禁止。不法行為・刑事責任のおそれ。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","q":"賃借人は、敷金を預けていることを理由に、賃料の支払を拒むことはできない。","a":true,"fact":"敷金を賃料に充当するよう主張できるのは賃貸人のみ。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"連帯保証人は、まず賃借人に請求するよう求める催告の抗弁権を有する。","a":false,"fact":"連帯保証人には催告の抗弁権も検索の抗弁権もない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"個人の根保証人は、極度額を超える部分について支払う義務を負わない。","a":true,"fact":"極度額が責任の上限。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"契約不適合","q":"賃借物が契約の内容に適合しない場合、賃借人は修補請求や賃料減額請求、損害賠償、解除ができる。","a":true,"fact":"売買の規定が賃貸借に準用される（民法559条）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"強行規定","q":"借地借家法の借家の規定に反する特約で、賃借人に不利なものは無効である。","a":true,"fact":"片面的強行規定（例：更新・解約・正当事由の規定）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"相続","q":"賃借人が死亡して相続人がいる場合、同居していた内縁の配偶者は、相続人の賃借権を援用して居住を続けられることがある。","a":true,"fact":"判例。相続人がいない場合は借地借家法36条で承継。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"明渡し","q":"賃貸借終了後に賃借人が明渡しを遅らせた場合、賃貸人は賃料相当損害金を請求できる。","a":true,"fact":"不法占有による損害賠償。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"時効","q":"賃料債権の消滅時効は、権利を行使できることを知った時から10年である。","a":false,"fact":"知った時から5年（権利を行使できる時から10年）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"中途解約","q":"期間の定めのある普通建物賃貸借で、賃借人の中途解約を認めない特約は無効である。","a":false,"fact":"期間の定めがあれば中途解約できないのが原則なので、そのような特約は有効。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"契約書に「更新がない」旨の定めがなければ、事前説明をしていても定期建物賃貸借にはならない。","a":true,"fact":"契約書面に更新がない旨の定めが必要。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"終身建物賃貸借","q":"終身建物賃貸借は、60歳以上の高齢者を対象とする制度である。","a":true,"fact":"高齢者住まい法。賃借人の死亡で終了し、相続されない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","q":"適法な転貸で転借人が賃貸人に直接賃料を支払った場合、その範囲で賃借人の賃貸人に対する賃料債務も消滅する。","a":true,"fact":"直接請求に応じた支払は、賃借人の債務の弁済にもなる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","q":"賃貸人が修繕しないために使用できなかった期間の賃料について、賃借人はその割合に応じて支払を免れる。","a":true,"fact":"使用収益できない部分の賃料は減額される（民法611条等）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復","q":"通常損耗の補修費用を賃借人が負担する特約は、消費者契約法により一律に無効とされる。","a":false,"fact":"負担範囲が具体的に明記され、明確に合意されていれば有効（最判平17.12.16）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復","q":"賃借人が設置した物の撤去（収去）は、原状回復の内容に含まれる。","a":true,"fact":"収去義務（民法622条・599条）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"用法違反","q":"賃借人が賃貸人の承諾なく建物を増改築した場合、用法違反として解除されることがある。","a":true,"fact":"信頼関係を破壊する程度であれば解除できる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"合意解約","q":"期間の定めがある建物賃貸借は、期間満了前に当事者の合意で解約することはできない。","a":false,"fact":"合意解約はいつでもできる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"更新拒絶","q":"更新拒絶の通知は、口頭で行っても法律上は有効である。","a":true,"fact":"方式の定めはない。実務では証拠を残すため内容証明郵便等を用いる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"建物","q":"マンションの一室は、借地借家法の「建物」に当たらない。","a":false,"fact":"独立して住居等に使える区分された部分も「建物」に当たる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"抵当権","q":"抵当権設定登記より前に引渡しを受けた建物賃借人は、競売の買受人に賃借権を対抗できる。","a":true,"fact":"対抗要件の先後で決まる。登記後の賃借人は6か月の明渡猶予のみ。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"解約申入れ","q":"期間の定めのない建物賃貸借で、賃貸人の解約申入れは、正当事由がなければ効力を生じない。","a":true,"fact":"借地借家法28条。","trap":""},{"f":"管理実務・原状回復","k":"原状回復","q":"敷金から差し引く原状回復費用について、内訳を示した精算書を交付することが望ましい。","a":true,"fact":"トラブル防止のため、根拠を明示する。","trap":""},{"f":"管理実務・原状回復","k":"原状回復","q":"ガイドラインでは、畳の賃借人負担は原則として1枚単位とされる。","a":true,"fact":"毀損した部分の最小単位が原則。","trap":""},{"f":"管理実務・原状回復","k":"原状回復","q":"飲み物をこぼしたことによるカーペットのシミで、手入れが不十分だったものは賃借人負担となる。","a":true,"fact":"善管注意義務違反。","trap":""},{"f":"管理実務・原状回復","k":"原状回復","q":"破損等していない網戸の張替え費用は、賃借人負担である。","a":false,"fact":"次の入居者確保のための張替えは賃貸人負担。","trap":""},{"f":"管理実務・原状回復","k":"人の死の告知","q":"賃貸借取引で、他殺があった物件は、発生から概ね3年以内であれば、借主から問われなくても告げる必要がある。","a":true,"fact":"自然死・日常生活上の不慮の死以外は、概ね3年間告げる。","trap":""},{"f":"管理実務・原状回復","k":"残置物","q":"残置物の処理等に関するモデル契約条項は、主に60歳以上の単身の賃借人を想定している。","a":true,"fact":"単身高齢者の入居を円滑にするための条項。","trap":""},{"f":"管理実務・原状回復","k":"滞納対応","q":"深夜や早朝に電話で滞納家賃を督促することは、不適切な取立てとなり得る。","a":true,"fact":"平穏な生活を害する督促は避ける。","trap":""},{"f":"管理実務・原状回復","k":"少額訴訟","q":"少額訴訟を起こされた被告は、通常の訴訟手続に移行させる旨の申述をすることができる。","a":true,"fact":"最初の口頭弁論期日で弁論するまでに申述できる。","trap":""},{"f":"管理実務・原状回復","k":"支払督促","q":"支払督促は、請求額が140万円を超える場合、地方裁判所の書記官に申し立てる。","a":false,"fact":"請求額にかかわらず、債務者の住所地の簡易裁判所の書記官に申し立てる。","trap":""},{"f":"管理実務・原状回復","k":"入居審査","q":"外国人であることのみを理由に入居を拒否することは、不適切である。","a":true,"fact":"国籍のみを理由とする拒否は差別に当たり得る。","trap":""},{"f":"管理実務・原状回復","k":"媒介報酬","q":"居住用建物の賃貸借の媒介で、借主の承諾がなくても、借主から賃料1か月分＋消費税を受け取ることができる。","a":false,"fact":"居住用は、承諾がなければ依頼者の一方から0.5か月分＋税まで。","trap":""},{"f":"管理実務・原状回復","k":"鍵","q":"入居者の希望で入居時に鍵を交換した場合、合意があれば費用を賃借人の負担とすることもできる。","a":true,"fact":"入替時の交換は原則賃貸人負担だが、賃借人の希望による交換は合意次第。","trap":""},{"f":"管理実務・原状回復","k":"苦情対応","q":"騒音トラブルでは、まず掲示や文書配布など全体への注意喚起から始めるのが一般的である。","a":true,"fact":"いきなり特定の入居者を名指しすると、新たなトラブルの原因になりやすい。","trap":""},{"f":"管理実務・原状回復","k":"原状回復","q":"ペット飼育可の物件であっても、ペットによるキズや臭いの補修費用は賃借人の負担となり得る。","a":true,"fact":"飼育可でも、通常の使用を超える損耗は賃借人負担。","trap":""},{"f":"建物・設備","k":"耐震","q":"耐震改修促進法により、旧耐震基準の建物の所有者には、耐震診断・改修の努力義務がある。","a":true,"fact":"一定の建物は耐震診断が義務付けられている。","trap":""},{"f":"建物・設備","k":"構造","q":"鉄骨造は耐火性に優れているため、耐火被覆は不要である。","a":false,"fact":"鉄は熱に弱いため、耐火被覆が必要。","trap":""},{"f":"建物・設備","k":"構造","q":"鉄骨鉄筋コンクリート造（SRC造）は、強度と粘り強さがあり、高層建築に適している。","a":true,"fact":"鉄骨の周りに鉄筋コンクリートを施した構造。","trap":""},{"f":"建物・設備","k":"耐震","q":"耐震診断のIs値（構造耐震指標）が0.6以上であれば、大地震で倒壊・崩壊する危険性が低いとされる。","a":true,"fact":"0.3未満は危険性が高い、0.3以上0.6未満は危険性がある、とされる。","trap":""},{"f":"建物・設備","k":"給水","q":"受水槽の水が長期間使われずに滞留すると、残留塩素が減少し水質が悪化するおそれがある。","a":true,"fact":"使用水量に合った容量にすることが重要。","trap":""},{"f":"建物・設備","k":"給水","q":"ポンプ直送方式は、受水槽の水を高置水槽に揚水してから重力で給水する方式である。","a":false,"fact":"それは高置水槽方式。ポンプ直送方式は高置水槽を使わずポンプで直接各戸に給水する。","trap":""},{"f":"建物・設備","k":"排水","q":"長期間使用しない排水口では、トラップの封水が蒸発して破封し、悪臭の原因となることがある。","a":true,"fact":"空室では定期的に通水する。","trap":""},{"f":"建物・設備","k":"排水","q":"通気管が詰まると、排水時にトラップの封水が破られやすくなる。","a":true,"fact":"管内の気圧変動を逃がせなくなるため。","trap":""},{"f":"建物・設備","k":"換気","q":"シックハウス対策として、ホルムアルデヒドを発散する建材は、発散量に応じて使用面積が制限されている。","a":true,"fact":"2003年の建築基準法改正による。","trap":""},{"f":"建物・設備","k":"消防","q":"共同住宅の消火器の設置義務は、延べ面積500㎡以上のものに限られる。","a":false,"fact":"共同住宅は延べ面積150㎡以上で消火器の設置が必要（自動火災報知設備は500㎡以上）。","trap":""},{"f":"建物・設備","k":"消防","q":"共同住宅では、延べ面積500㎡以上の場合に自動火災報知設備の設置が必要となる。","a":true,"fact":"共同住宅の自動火災報知設備は延べ面積500㎡以上。","trap":""},{"f":"建物・設備","k":"消防","q":"防火管理者は、消防計画を作成し、消防長又は消防署長に届け出なければならない。","a":true,"fact":"防火管理者の業務。","trap":""},{"f":"建物・設備","k":"昇降機","q":"エレベーターの保守契約のうち、部品の交換費用まで含むのはPOG契約である。","a":false,"fact":"部品交換まで含むのはフルメンテナンス契約。POG契約は消耗品程度のみで、部品交換は別料金。","trap":""},{"f":"建物・設備","k":"外壁","q":"外壁タイルの浮きは、テストハンマーによる打診で確認する。","a":true,"fact":"打診音の違いで浮きを判別する（赤外線調査もある）。","trap":""},{"f":"建物・設備","k":"修繕","q":"鉄部の塗装は、一般に5年程度ごとに行うのが目安とされる。","a":true,"fact":"鉄部は錆びやすいため、外壁より短い周期で塗装する。","trap":""},{"f":"建物・設備","k":"石綿","q":"2006年9月以降、石綿を0.1％を超えて含有する製品の製造・使用等は原則として禁止されている。","a":true,"fact":"それ以前の建物は石綿含有建材が使われている可能性がある。","trap":""},{"f":"実務・税金・保険","k":"不動産取得税","q":"相続により不動産を取得した場合も、不動産取得税が課される。","a":false,"fact":"相続による取得は不動産取得税が非課税。","trap":""},{"f":"実務・税金・保険","k":"登録免許税","q":"建物を新築して所有権保存登記をする場合にも、登録免許税が課される。","a":true,"fact":"保存登記・移転登記・抵当権設定登記などに課される。","trap":""},{"f":"実務・税金・保険","k":"減価償却","q":"1998年4月以降に取得した建物は、定率法を選択して減価償却することができる。","a":false,"fact":"建物は定額法のみ（建物附属設備・構築物も2016年4月以降は定額法）。","trap":""},{"f":"実務・税金・保険","k":"減価償却","q":"2016年4月以降に取得した建物附属設備・構築物は、定額法で減価償却する。","a":true,"fact":"建物と同じく定額法のみ。","trap":""},{"f":"実務・税金・保険","k":"相続税","q":"賃貸アパートの敷地は貸家建付地として評価され、自用地よりも評価額が低くなる。","a":true,"fact":"借地権割合×借家権割合×賃貸割合の分だけ減額される。","trap":""},{"f":"実務・税金・保険","k":"固定資産税","q":"管理不全空家等として勧告を受けた空き家の敷地は、固定資産税の住宅用地特例が適用されなくなる。","a":true,"fact":"2023年施行の改正空家法による。","trap":""},{"f":"実務・税金・保険","k":"消費税","q":"店舗や事務所の賃料は、消費税の課税対象である。","a":true,"fact":"非課税は住宅の貸付け（1か月以上）など。","trap":""},{"f":"実務・税金・保険","k":"保険","q":"地震保険は、居住用の建物と家財が対象で、店舗専用の建物は対象外である。","a":true,"fact":"住居部分のある併用住宅は対象。","trap":""},{"f":"実務・税金・保険","k":"証券化","q":"不動産証券化において、SPC（特別目的会社）は、オリジネーターの倒産の影響を受けないよう（倒産隔離）設立される。","a":true,"fact":"資産を切り離して投資家を保護する。","trap":""},{"f":"実務・税金・保険","k":"民泊","q":"住宅宿泊事業法の届出住宅で人を宿泊させられる日数の上限は、年間120日である。","a":false,"fact":"年間180日が上限（条例でさらに制限される地域もある）。","trap":""}],"final":[{"f":"賃貸住宅管理業法","k":"登録","q":"管理戸数が200戸以上の賃貸住宅管理業を営む者は、国土交通大臣の登録を受けなければならない。","a":true,"fact":"200戸以上は義務、未満は任意。登録先は常に国土交通大臣。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"登録の有効期間は3年である。","a":false,"fact":"5年。更新申請は満了の90日前〜30日前。","trap":""},{"f":"賃貸住宅管理業法","k":"届出","q":"登録事項に変更があった場合は、変更の日から30日以内に届け出なければならない。","a":true,"fact":"廃業等の届出も30日以内。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者は、営業所又は事務所ごとに1人以上選任しなければならない。","a":true,"fact":"他の営業所との兼任は不可。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者が欠けた営業所でも、既存の契約の範囲であれば新たな管理受託契約を締結できる。","a":false,"fact":"新たに選任するまで、管理受託契約を締結してはならない。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"管理受託契約重要事項説明は、業務管理者が自ら行わなければならない。","a":false,"fact":"説明者の資格制限はない（業務管理者の管理・監督の下で行う）。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"管理受託契約重要事項説明は、契約締結前に書面を交付して行う。","a":true,"fact":"1週間程度空けるのが望ましい。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"委託者が宅地建物取引業者である場合、管理受託契約重要事項説明は不要である。","a":true,"fact":"プロ相手は不要。","trap":""},{"f":"賃貸住宅管理業法","k":"書面","q":"重要事項説明書と契約締結時書面は、1つの書面にまとめることができる。","a":false,"fact":"一体化は不可（締結時書面と契約書の兼用は可）。","trap":""},{"f":"賃貸住宅管理業法","k":"再委託","q":"管理業務の全部を他の者に再委託することは禁止されている。","a":true,"fact":"一部の再委託は可。","trap":""},{"f":"賃貸住宅管理業法","k":"分別管理","q":"家賃等は、自己の固有財産と分別して管理しなければならない。","a":true,"fact":"口座を分け、帳簿で委託者ごとに区分。","trap":""},{"f":"賃貸住宅管理業法","k":"帳簿","q":"帳簿は、各事業年度の末日で閉鎖し、閉鎖後5年間保存する。","a":true,"fact":"営業所ごとに備え付ける。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"委託者への定期報告は、契約締結日から2年を超えない期間ごとに行えばよい。","a":false,"fact":"1年を超えない期間ごと＋期間満了後遅滞なく。","trap":""},{"f":"賃貸住宅管理業法","k":"秘密保持","q":"従業者は、従業者でなくなった後も秘密保持義務を負う。","a":true,"fact":"管理業者も同様。","trap":""},{"f":"サブリース（特定賃貸借）","k":"適用範囲","q":"サブリース規制は、戸数や登録の有無にかかわらず、すべての特定転貸事業者に適用される。","a":true,"fact":"特定転貸事業者に登録制度はない。","trap":""},{"f":"サブリース（特定賃貸借）","k":"勧誘者","q":"誇大広告等の禁止と不当な勧誘等の禁止は、勧誘者にも適用される。","a":true,"fact":"建設会社・金融機関等も勧誘者になり得る。","trap":""},{"f":"サブリース（特定賃貸借）","k":"勧誘者","q":"勧誘者は、特定賃貸借契約重要事項説明の義務を負う。","a":false,"fact":"重説・書面交付は特定転貸事業者の義務。","trap":""},{"f":"サブリース（特定賃貸借）","k":"誇大広告","q":"「家賃保証」と表示する場合は、借地借家法32条により減額され得ることを隣接箇所に表示する必要がある。","a":true,"fact":"表示しなければ誇大広告に該当し得る。","trap":""},{"f":"サブリース（特定賃貸借）","k":"不当勧誘","q":"過失により重要事項を告げなかった場合も、不当な勧誘等の禁止に違反する。","a":false,"fact":"「故意に」告げないことが要件。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定賃貸借契約重要事項説明では、家賃が減額され得ることを必ず説明しなければならない。","a":true,"fact":"最重要の説明事項。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"家賃保証特約があれば、サブリース業者は家賃の減額請求をすることができない。","a":false,"fact":"借地借家法32条は強行規定。保証特約があっても減額請求可（最判平15.10.21）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"借地借家法","q":"オーナーがマスターリース契約の更新を拒絶するには、正当事由が必要である。","a":true,"fact":"サブリース業者は借主として保護される。","trap":""},{"f":"サブリース（特定賃貸借）","k":"標準契約書","q":"特定賃貸借標準契約書では、契約終了時、オーナーは転貸人の地位を承継しない。","a":false,"fact":"承継する（入居者は住み続けられる）。","trap":""},{"f":"サブリース（特定賃貸借）","k":"監督","q":"特定転貸事業者に対する業務停止命令の期間は、1年以内である。","a":true,"fact":"指示・業務停止は公表される。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"期間","q":"期間を1年未満とする普通建物賃貸借は、期間の定めがないものとみなされる。","a":true,"fact":"定期借家は1年未満も可。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"更新拒絶","q":"更新拒絶の通知は、期間満了の1年前から6か月前までにしなければならない。","a":true,"fact":"正当事由も必要。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"法定更新","q":"法定更新された賃貸借の期間は、従前の契約と同じ期間となる。","a":false,"fact":"期間の定めがないものとなる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"解約申入れ","q":"期間の定めのない建物賃貸借で賃貸人が解約を申し入れた場合、3か月経過で終了する。","a":false,"fact":"賃貸人からは6か月（正当事由要）、賃借人からは3か月。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"定期建物賃貸借の事前説明は、契約書とは別個独立の書面で行う必要がある。","a":true,"fact":"承諾があれば電磁的方法も可。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"事前説明をしなかった定期建物賃貸借は、契約全体が無効となる。","a":false,"fact":"更新がない旨の定めが無効となり、普通借家になる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"床面積200㎡未満の居住用の定期借家では、賃借人はやむを得ない事情があれば中途解約でき、申入れから1か月で終了する。","a":true,"fact":"賃貸人からの中途解約権はない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額","q":"一定期間賃料を減額しない旨の特約は、普通建物賃貸借では無効である。","a":true,"fact":"不増額特約は有効。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料増減額","q":"増額請求を受けた賃借人は、裁判が確定するまで、自ら相当と認める額を支払えばよい。","a":true,"fact":"不足分は年1割の利息を付けて支払う。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","q":"敷金の返還と建物の明渡しは、同時履行の関係にある。","a":false,"fact":"明渡しが先。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"敷金","q":"賃貸人が交代した場合、敷金返還債務は新賃貸人に承継される。","a":true,"fact":"賃借人が交代（賃借権の譲渡）した場合は承継されない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"修繕","q":"賃借物の一部が使用できなくなった場合、賃借人が請求しなくても賃料は当然に減額される。","a":true,"fact":"賃借人に帰責事由がない場合。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"原状回復","q":"賃借人は、通常損耗・経年変化について原状回復義務を負わない。","a":true,"fact":"民法621条。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","q":"原賃貸借が合意解除された場合、賃貸人は原則として転借人に対抗できない。","a":true,"fact":"債務不履行解除なら対抗できる（転借人への催告不要）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"個人根保証契約は、極度額を書面で定めなければ効力を生じない。","a":true,"fact":"法人保証には適用されない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"賃借人が破産手続開始決定を受けたときは、個人根保証の元本が確定する。","a":false,"fact":"確定事由は保証人の破産、賃借人又は保証人の死亡等。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"対抗力","q":"建物の賃借権は、登記がなくても引渡しがあれば、その後の建物の取得者に対抗できる。","a":true,"fact":"借地借家法31条。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"オーナーチェンジ","q":"建物の新所有者は、所有権移転登記をしなければ、賃借人に賃料を請求できない。","a":true,"fact":"民法605条の2第3項。","trap":""},{"f":"管理実務・原状回復","k":"原状回復GL","q":"壁クロスは、6年で残存価値が1円となるよう経過年数を考慮して賃借人の負担を算定する。","a":true,"fact":"畳表・襖紙等は経過年数を考慮しない。","trap":""},{"f":"管理実務・原状回復","k":"原状回復GL","q":"入居者の入れ替わりに伴う鍵の交換費用は、賃借人の負担である。","a":false,"fact":"賃貸人負担（紛失した場合は賃借人負担）。","trap":""},{"f":"管理実務・原状回復","k":"原状回復GL","q":"タバコのヤニによるクロスの変色は、賃借人の負担となり得る。","a":true,"fact":"通常の使用を超える損耗。","trap":""},{"f":"管理実務・原状回復","k":"人の死の告知","q":"賃貸借取引では、自死等の事案は概ね3年間告げる必要があり、自然死は原則として告げなくてよい。","a":true,"fact":"特殊清掃等が行われた場合は自然死でも告知対象。","trap":""},{"f":"管理実務・原状回復","k":"滞納","q":"家賃を長期間滞納している賃借人の部屋の鍵を交換することは、認められる。","a":false,"fact":"自力救済の禁止。","trap":""},{"f":"管理実務・原状回復","k":"少額訴訟","q":"少額訴訟は、60万円以下の金銭の支払請求に限られる。","a":true,"fact":"建物明渡しには使えない。年10回まで。","trap":""},{"f":"管理実務・原状回復","k":"支払督促","q":"支払督促に対して適法な異議があると、通常の訴訟に移行する。","a":true,"fact":"簡易裁判所の書記官が発する。","trap":""},{"f":"管理実務・原状回復","k":"非弁","q":"管理業者が報酬を得る目的で業として明渡し交渉を代行することは、非弁行為となるおそれがある。","a":true,"fact":"弁護士法72条。","trap":""},{"f":"建物・設備","k":"耐震","q":"新耐震基準は、1981年6月1日以降に建築確認を受けた建物に適用されている。","a":true,"fact":"竣工日ではなく建築確認日。","trap":""},{"f":"建物・設備","k":"給水","q":"受水槽の有効容量が10㎥を超える簡易専用水道は、年1回以上の検査を受ける必要がある。","a":true,"fact":"水槽の清掃も年1回。","trap":""},{"f":"建物・設備","k":"排水","q":"排水トラップの封水深は、一般に5〜10cmである。","a":true,"fact":"二重トラップは禁止。","trap":""},{"f":"建物・設備","k":"換気","q":"第3種換気は、機械給気と自然排気の組み合わせである。","a":false,"fact":"第3種は自然給気＋機械排気（住宅に多い）。","trap":""},{"f":"建物・設備","k":"消防","q":"共同住宅の消防用設備等の点検結果の報告は、3年に1回である。","a":true,"fact":"点検は機器点検6か月・総合点検1年。","trap":""},{"f":"建物・設備","k":"消防","q":"共同住宅では、収容人員30人以上で防火管理者を選任しなければならない。","a":false,"fact":"共同住宅（非特定）は50人以上。","trap":""},{"f":"実務・税金・保険","k":"固定資産税","q":"小規模住宅用地（200㎡以下の部分）の固定資産税の課税標準は、価格の6分の1となる。","a":true,"fact":"都市計画税は3分の1。","trap":""},{"f":"実務・税金・保険","k":"相続税","q":"相続税の基礎控除額は「3,000万円＋600万円×法定相続人の数」である。","a":true,"fact":"申告期限は10か月。","trap":""},{"f":"実務・税金・保険","k":"印紙税","q":"建物の賃貸借契約書には、印紙税が課される。","a":false,"fact":"非課税（土地の賃貸借契約書は課税）。","trap":""},{"f":"実務・税金・保険","k":"保険","q":"地震保険の保険金額は、火災保険の保険金額の30〜50％の範囲内で設定する。","a":true,"fact":"建物5,000万円・家財1,000万円が上限。","trap":""}],"edge":[{"f":"賃貸住宅管理業法","k":"規制の違い","q":"賃貸住宅管理業法には、管理受託契約の勧誘に関する誇大広告の禁止や不当勧誘の禁止の規定はない。","a":true,"fact":"誇大広告・不当勧誘の禁止はサブリース（特定賃貸借）だけの規制。管理業者と混同させるひっかけに注意。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"委託者となろうとする個人オーナーが「説明は不要」と申し出れば、管理受託契約重要事項説明を省略できる。","a":false,"fact":"相手方の申出では省略できない。省略できるのは法令で定めるプロ（管理業者・宅建業者・信託の受託者等）が相手の場合のみ。","trap":""},{"f":"賃貸住宅管理業法","k":"定期報告","q":"委託者が宅地建物取引業者であれば、定期報告は不要である。","a":false,"fact":"重説と違い、定期報告にはプロ相手の例外がない。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"自ら所有する賃貸住宅を自ら管理する戸数は、登録が必要かどうか（200戸）の判定に含まれる。","a":false,"fact":"「委託を受けて」管理する戸数で判定する。","trap":""},{"f":"賃貸住宅管理業法","k":"登録の失効","q":"登録の取消しや廃業の後でも、締結済みの管理受託契約に基づく業務を結了する目的の範囲内では、なお管理業者とみなされる。","a":true,"fact":"委託者の保護のため。","trap":""},{"f":"賃貸住宅管理業法","k":"施行時期","q":"サブリース規制（2020年12月）は、登録制度（2021年6月）より先に施行された。","a":true,"fact":"登録制度には1年間の経過措置があった。","trap":""},{"f":"賃貸住宅管理業法","k":"再委託","q":"一部の再委託をする場合、再委託先は賃貸住宅管理業者でなければならない。","a":false,"fact":"再委託先が登録業者である必要はない。ただし全部の再委託は相手を問わず禁止。","trap":""},{"f":"賃貸住宅管理業法","k":"従業者","q":"派遣社員やアルバイトも、秘密保持義務を負い、従業者証明書の携帯が必要である。","a":true,"fact":"内部管理事務のみに従事する者は証明書不要。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者が専任の宅建士を兼務している場合でも、業務管理者としての管理・監督の職務は免除されない。","a":true,"fact":"兼務は可能だが、職務は両方果たす必要がある。","trap":""},{"f":"賃貸住宅管理業法","k":"登録拒否","q":"道路交通法違反で罰金刑に処せられた者は、執行を終えてから5年間登録を受けられない。","a":false,"fact":"罰金刑で欠格となるのは管理業法違反等の場合のみ。拘禁刑以上は罪種を問わず5年。","trap":""},{"f":"賃貸住宅管理業法","k":"重要事項説明","q":"管理受託契約重要事項説明は、契約締結の直前に行っても、締結前であれば法違反にはならない。","a":true,"fact":"1週間程度空けるのは「望ましい」にとどまる。","trap":""},{"f":"賃貸住宅管理業法","k":"管理受託と承継","q":"オーナーが賃貸住宅を売却した場合、管理受託契約は当然に新オーナーに承継される。","a":false,"fact":"賃貸人の地位は移転しても、管理受託契約（委任）は当然には承継されない。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"企業が社宅として賃貸住宅を借り上げ、従業員から使用料を取って入居させる契約は、特定賃貸借契約に該当する。","a":false,"fact":"転貸事業を目的とするものではないため該当しない。","trap":""},{"f":"サブリース（特定賃貸借）","k":"定義","q":"オーナー（法人）の子会社が借り上げて転貸する契約は、特定賃貸借契約に該当しない。","a":true,"fact":"賃貸人と密接な関係にある者（個人なら親族、法人なら親会社・子会社・役員等）の借上げは除外。","trap":""},{"f":"サブリース（特定賃貸借）","k":"勧誘者","q":"勧誘者は法人に限られ、個人の既存オーナーが勧誘者になることはない。","a":false,"fact":"紹介料を得て知人に特定の事業者を勧める既存オーナーも勧誘者になり得る。","trap":""},{"f":"サブリース（特定賃貸借）","k":"重要事項説明","q":"特定賃貸借契約重要事項説明では、家賃の額だけでなく、その設定根拠も説明する。","a":true,"fact":"近傍同種の家賃等の根拠を示す。","trap":""},{"f":"サブリース（特定賃貸借）","k":"減額請求","q":"サブリース業者の家賃減額請求の効果は、裁判で減額が確定した時から生じる。","a":false,"fact":"請求の意思表示が到達した時から（相当額の範囲で）生じる。","trap":""},{"f":"サブリース（特定賃貸借）","k":"調停","q":"家賃増減額に関する紛争は、訴訟の前に原則として調停を申し立てる必要がある（調停前置）。","a":true,"fact":"原則として簡易裁判所。","trap":""},{"f":"サブリース（特定賃貸借）","k":"中途解約","q":"マスターリースにオーナーからの中途解約条項があっても、オーナーの解約申入れには正当事由が必要と解される。","a":true,"fact":"サブリース業者は借地借家法で保護される借主。","trap":""},{"f":"サブリース（特定賃貸借）","k":"転借人の保護","q":"転貸を予定したマスターリースでは、期間満了による終了を、オーナーが信義則上転借人に対抗できない場合がある。","a":true,"fact":"最判平14.3.28。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"定期建物賃貸借の終了の通知は、書面でしなければ効力を生じない。","a":false,"fact":"書面が必要なのは「契約」と「事前説明」。終了通知に方式の定めはない（実務上は書面）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"期間1年未満の定期建物賃貸借では、終了の通知は不要である。","a":true,"fact":"通知が必要なのは期間1年以上の場合。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"床面積200㎡以上の居住用定期借家でも、賃借人の中途解約を認める特約は有効である。","a":true,"fact":"法定の中途解約権がなくても、特約で定めることはできる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"定期借家","q":"定期建物賃貸借の再契約では、改めて事前説明をする必要はない。","a":false,"fact":"再契約は新たな契約なので事前説明が必要。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"賃料改定","q":"借地借家法32条の適用を特約で排除できるのは、定期建物賃貸借の賃料改定特約の場合だけである。","a":true,"fact":"普通借家では不減額特約も無効。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"破産","q":"賃貸人が破産しても、対抗要件を備えた賃借人との賃貸借契約は、破産管財人が解除できない。","a":true,"fact":"破産法56条。賃借人が破産した場合は管財人が解除を選択できる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"妨害排除","q":"対抗要件を備えていない建物賃借人でも、賃借権に基づいて不法占拠者に返還を請求できる。","a":false,"fact":"賃借権に基づく妨害停止・返還請求は、対抗要件を備えた場合に認められる（民法605条の4）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"転貸","q":"適法な転貸借の転借人は、賃貸人に対して直接修繕を請求できる。","a":false,"fact":"転借人は賃貸人に義務を負うが、権利は取得しない。修繕は転貸人に請求する。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"地位の留保","q":"賃貸人たる地位を譲渡人に留保するには、賃借人の承諾が必要である。","a":false,"fact":"譲渡人と譲受人の合意（＋譲受人が譲渡人に賃貸する合意）で足りる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"オーナーチェンジ","q":"賃貸人たる地位が移転すると、旧所有者のもとで発生していた未払賃料債権も当然に新所有者に移転する。","a":false,"fact":"既に発生した賃料債権は当然には移転しない（債権譲渡が必要）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"共有","q":"共有建物を3年を超える期間で賃貸するには、共有者全員の同意が必要である。","a":true,"fact":"3年以内なら持分価格の過半数で決められる（管理行為）。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"保証人が死亡した場合、相続人は死亡時までに生じた保証債務は承継するが、その後に生じる賃料債務は保証しない。","a":true,"fact":"保証人の死亡で元本が確定する。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"保証","q":"居住用建物の賃貸借で、賃借人は個人保証人に対し、契約締結時に自己の財産状況等を情報提供する義務を負う。","a":false,"fact":"締結時の情報提供義務は事業のための債務（事業用賃貸借）の場合のみ。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"失火","q":"賃借人の軽過失による失火で建物が焼損した場合、失火責任法により賃借人は賃貸人に対して責任を負わない。","a":false,"fact":"失火責任法は不法行為責任の規定。賃貸人に対しては債務不履行責任を負う。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"造作","q":"賃借人の債務不履行で賃貸借が解除された場合でも、造作買取請求ができる。","a":false,"fact":"判例上、債務不履行解除の場合は造作買取請求できない。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"一時使用","q":"契約書に「一時使用」と書けば、借地借家法の更新の規定は適用されない。","a":false,"fact":"一時使用かどうかは実態で客観的に判断される。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"使用貸借","q":"使用貸借の借主は、建物の引渡しを受けていれば、新所有者に借主の権利を対抗できる。","a":false,"fact":"使用借権には対抗力がない。借主の死亡で終了する点も賃貸借と異なる。","trap":""},{"f":"賃貸借契約（民法・借地借家法）","k":"内縁","q":"居住用建物の賃借人が相続人なしに死亡した場合、同居の内縁配偶者は、死亡を知った後1か月以内に反対の意思表示をしなければ賃借人の権利義務を承継する。","a":true,"fact":"借地借家法36条。","trap":""},{"f":"管理実務・原状回復","k":"原状回復GL","q":"喫煙によるヤニで居室全体のクロスが変色した場合、居室全体の張替費用を賃借人負担とすることが妥当とされる。","a":true,"fact":"最小単位（㎡単位・1面単位）の原則の例外。","trap":""},{"f":"管理実務・原状回復","k":"原状回復GL","q":"賃借人が所有するエアコンを設置したことによる壁のビス穴は、賃借人の負担である。","a":false,"fact":"エアコンは生活必需品であり、通常損耗として賃貸人負担。","trap":""},{"f":"管理実務・原状回復","k":"支払督促","q":"支払督促は、債務者の住所が不明でも公示送達によって進めることができる。","a":false,"fact":"支払督促は公示送達によることができない（訴訟なら公示送達が可能）。","trap":""},{"f":"管理実務・原状回復","k":"少額訴訟","q":"少額訴訟の判決に不服がある場合は、地方裁判所に控訴できる。","a":false,"fact":"控訴できず、同じ簡易裁判所への異議申立てのみ。","trap":""},{"f":"管理実務・原状回復","k":"強制執行","q":"執行官による明渡しの催告があった場合、引渡しの期限は原則として催告日から1か月を経過する日となる。","a":true,"fact":"民事執行法168条の2。","trap":""},{"f":"管理実務・原状回復","k":"遅延損害金","q":"居住用の賃貸借（消費者契約）では、遅延損害金のうち年14.6％を超える部分は無効となる。","a":true,"fact":"消費者契約法9条2号。","trap":""},{"f":"建物・設備","k":"用途変更","q":"床面積200㎡を超える建物を共同住宅に用途変更する場合は、建築確認が必要である。","a":true,"fact":"2019年改正で100㎡から200㎡に緩和。","trap":""},{"f":"建物・設備","k":"高さ・階数","q":"高さ20m超で避雷設備、高さ31m超で非常用の昇降機、地階を除く階数7以上で連結送水管の設置が必要となる。","a":true,"fact":"数字の組み合わせを正確に。","trap":""},{"f":"建物・設備","k":"耐震診断","q":"耐震診断のIs値が0.3以上0.6未満の建物は、大地震で倒壊する危険性が低いと評価される。","a":false,"fact":"0.6以上が「危険性が低い」。0.3以上0.6未満は「危険性がある」、0.3未満は「危険性が高い」。","trap":""},{"f":"建物・設備","k":"エレベーター","q":"部品交換の費用まで含む保守契約はPOG契約である。","a":false,"fact":"部品交換まで含むのはフルメンテナンス契約。","trap":""},{"f":"実務・税金・保険","k":"住宅用地特例","q":"アパートの敷地の住宅用地特例で、200㎡以下かどうかは住戸1戸あたりで判定する。","a":true,"fact":"例：10戸なら2,000㎡まで小規模住宅用地。","trap":""},{"f":"実務・税金・保険","k":"登記","q":"住所等の変更登記の申請義務（2026年4月施行）の期限は、変更日から2年以内である。","a":true,"fact":"相続登記は知った日から3年以内。","trap":""}],"eve":[{"f":"賃貸住宅管理業法","k":"登録義務","q":"委託を受けて管理する賃貸住宅が200戸以上となる事業者は、賃貸住宅管理業の登録を受けなければならない。","a":true,"fact":"200戸未満は任意登録。","trap":""},{"f":"賃貸住宅管理業法","k":"登録義務","q":"管理戸数が200戸未満の事業者が任意に登録を受けた場合、賃貸住宅管理業法上の義務は課されない。","a":false,"fact":"登録を受ければ、戸数にかかわらず法の義務がすべて課される。","trap":""},{"f":"賃貸住宅管理業法","k":"戸数の数え方","q":"自ら所有し自ら管理している賃貸住宅の戸数も、登録義務の200戸に含めて判定する。","a":false,"fact":"「委託を受けて」管理する戸数で判定する。","trap":""},{"f":"賃貸住宅管理業法","k":"登録","q":"1つの都道府県内だけで営業する場合は、都道府県知事の登録を受ければよい。","a":false,"fact":"営業の範囲にかかわらず国土交通大臣の登録。","trap":""},{"f":"賃貸住宅管理業法","k":"登録の更新","q":"登録の有効期間は5年で、更新の申請は有効期間満了の日の90日前から30日前までに行う。","a":true,"fact":"期間内に申請すれば、処分があるまで従前の登録は有効。","trap":""},{"f":"賃貸住宅管理業法","k":"登録の更新","q":"更新の申請後、処分がないまま有効期間が満了した場合、登録は直ちに効力を失う。","a":false,"fact":"処分があるまでの間は、従前の登録がなお効力を有する。","trap":""},{"f":"賃貸住宅管理業法","k":"登録の更新","q":"更新後の登録の有効期間は、更新の処分がされた日から5年である。","a":false,"fact":"従前の登録の有効期間満了日の翌日から5年。","trap":""},{"f":"賃貸住宅管理業法","k":"欠格事由","q":"破産手続開始の決定を受けた者は、復権を得れば直ちに登録を受けることができる。","a":true,"fact":"復権後の待機期間はない。","trap":""},{"f":"賃貸住宅管理業法","k":"欠格事由","q":"賃貸住宅管理業法に違反して罰金刑に処せられた者は、執行を終えた日から5年を経過しなければ登録を受けられない。","a":true,"fact":"他の法律違反の罰金刑は欠格事由ではない。","trap":""},{"f":"賃貸住宅管理業法","k":"変更届","q":"登録事項に変更があったときは、変更の日から30日以内に国土交通大臣に届け出なければならない。","a":true,"fact":"事前の許可ではなく事後の届出。","trap":""},{"f":"賃貸住宅管理業法","k":"廃業等の届出","q":"個人の賃貸住宅管理業者が死亡した場合、相続人は死亡の日から30日以内に届け出なければならない。","a":false,"fact":"死亡の事実を「知った日」から30日以内。","trap":""},{"f":"賃貸住宅管理業法","k":"廃業等の届出","q":"廃業の届出があったときは、登録はその効力を失う。","a":true,"fact":"","trap":""},{"f":"賃貸住宅管理業法","k":"管理業の範囲","q":"賃貸人から委託を受けて家賃の集金だけを行う業務は、賃貸住宅管理業に当たる。","a":false,"fact":"金銭管理は維持保全と併せて行う場合のみ管理業務。","trap":""},{"f":"賃貸住宅管理業法","k":"管理業の範囲","q":"店舗兼住宅を一括して賃貸する場合、店舗部分も含めて「賃貸住宅」に当たる。","a":false,"fact":"住宅として使用する部分のみが賃貸住宅。","trap":""},{"f":"賃貸住宅管理業法","k":"管理業の範囲","q":"旅館業法の許可を受けて営業しているウィークリーマンションは、「賃貸住宅」に当たる。","a":false,"fact":"旅館業法の施設は賃貸住宅から除かれる。","trap":""},{"f":"賃貸住宅管理業法","k":"管理業の範囲","q":"建設工事の完了前でも、完了後に居住用として賃貸されることが明らかな家屋は「賃貸住宅」に当たる。","a":true,"fact":"","trap":""},{"f":"賃貸住宅管理業法","k":"管理業の範囲","q":"賃貸人のために修繕業者を手配する（契約の締結の媒介・取次ぎ・代理をする）業務も、維持保全に含まれる。","a":true,"fact":"自ら修繕しなくてもよい。","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者は、営業所又は事務所ごとに1人以上選任しなければならない。","a":true,"fact":"","trap":""},{"f":"賃貸住宅管理業法","k":"業務管理者","q":"業務管理者は、業務に支障がなければ、他の営業所の業務管理者を兼ねることができる。","a":false,"fact":"他の営業所・事務所の業務管理者との兼任はできない。","trap":""},{"f":"賃貸住宅管理業法","k":"業
